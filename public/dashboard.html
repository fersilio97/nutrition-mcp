                            if (err && err.message === "unauthorized") return;
                            if ($("me-save")) $("me-save").disabled = false;
                            const s = $("me-status");
                            if (s) {
                                s.className = "b-status err";
                                s.textContent = "Could not reach the server.";
                            }
                        });
                });

                RENDER.meals = function () {
                    const meals = data.meals;
                    if (!meals.length) {
                        $("meals-body").innerHTML =
                            '<p class="empty">No meals logged in this range.</p>';
                        return;
                    }
                    // Group by local day in the PROFILE timezone, newest first
                    // (the API already sorts newest first).
                    const groups = [];
                    const byDay = {};
                    meals.forEach(function (m) {
                        const d = localDate(m.logged_at);
                        if (!byDay[d]) {
                            byDay[d] = { date: d, meals: [] };
                            groups.push(byDay[d]);
                        }
                        byDay[d].meals.push(m);
                    });
                    const capped = meals.length >= 50;
                    const sum = (list, k) =>
                        list.reduce((a, m) => a + (m[k] || 0), 0);
                    const MAC = [
                        ["protein_g", "P"],
                        ["carbs_g", "C"],
                        ["fat_g", "F"],
                        ["fiber_g", "Fib"],
                        ["sugar_g", "Sug"],
                    ];
                    const body = groups
                        .map(function (g, gi) {
                            const day = parseDay(g.date).toLocaleDateString(
                                undefined,
                                {
                                    weekday: "short",
                                    month: "short",
                                    day: "numeric",
                                },
                            );
                            const partial =
                                capped && gi === groups.length - 1
                                    ? ' <span class="partial">(partial — older meals not shown)</span>'
                                    : "";
                            const tot =
                                "<b>" +
                                fmt(sum(g.meals, "calories")) +
                                "</b> kcal · P " +
                                fmt(sum(g.meals, "protein_g")) +
                                " · C " +
                                fmt(sum(g.meals, "carbs_g")) +
                                " · F " +
                                fmt(sum(g.meals, "fat_g")) +
                                " · Fib " +
                                fmt(sum(g.meals, "fiber_g"));
                            return (
                                '<tbody><tr class="day"><th colspan="10" scope="colgroup">' +
                                esc(day) +
                                partial +
                                '<span class="tot">' +
                                tot +
                                "</span></th></tr>" +
                                g.meals
                                    .map(function (m, i) {
                                        const editing = mealEditId === m.id;
                                        const last = i === g.meals.length - 1;
                                        return (
                                            '<tr class="meal' +
                                            (last && !editing ? " last" : "") +
                                            (editing ? " editing" : "") +
                                            '"><td class="t">' +
                                            esc(localTime(m.logged_at)) +
                                            '</td><td class="ty">' +
                                            esc(mealTypeLabel(m.meal_type)) +
                                            '</td><td class="d">' +
                                            esc(m.description) +
                                            '</td><td class="n k">' +
                                            nz(m.calories) +
                                            "</td>" +
                                            MAC.map(function (x) {
                                                return (
                                                    '<td class="n mac" data-l="' +
                                                    x[1] +
                                                    '"><b>' +
                                                    nz(m[x[0]]) +
                                                    "</b></td>"
                                                );
                                            }).join("") +
                                            '<td class="e"><button type="button" class="btn-edit" data-edit="' +
                                            esc(m.id) +
                                            '" aria-expanded="' +
                                            editing +
                                            '"' +
                                            (editing
                                                ? ' aria-controls="me-form"'
                                                : "") +
                                            ' aria-label="Edit ' +
                                            esc(mealTypeLabel(m.meal_type)) +
                                            ", " +
                                            esc(localTime(m.logged_at)) +
                                            '">Edit</button></td></tr>' +
                                            (editing
                                                ? '<tr class="edit-row' +
                                                  (last ? " last" : "") +
                                                  '"><td colspan="10">' +
                                                  mealEditForm(m) +
                                                  "</td></tr>"
                                                : "")
                                        );
                                    })
                                    .join("") +
                                "</tbody>"
                            );
                        })
                        .join("");
                    $("meals-body").innerHTML =
                        (mealFlash
                            ? '<p class="lw-flash meal-flash" role="status">' +
                              esc(mealFlash) +
                              "</p>"
                            : "") +
                        '<div class="meals-wrap rv"><table class="meals-table"><caption class="sr-only">Meals in this range, grouped by day, newest first</caption><thead><tr><th scope="col">Time</th><th scope="col">Meal</th><th scope="col">Description</th><th scope="col" class="n">kcal</th><th scope="col" class="n">P</th><th scope="col" class="n">C</th><th scope="col" class="n">F</th><th scope="col" class="n">Fib</th><th scope="col" class="n">Sug</th><th scope="col"><span class="sr-only">Edit</span></th></tr></thead>' +
                        body +
                        '</table><p class="meals-foot">Showing the ' +
                        plural(
                            meals.length,
                            "most recent meal",
                            "most recent meals",
                        ) +
                        " in this range" +
                        (capped ? " — the dashboard lists at most 50." : ".") +
                        "</p></div>";
                };

                /* ---------- data ---------- */
                function renderHeader() {
                    const sub = $("sub");
                    sub.classList.toggle("is-error", loadError && !data);
                    if (loadError && !data)
                        sub.textContent =
                            "Could not load data. Is the server running?";
                    else if (data)
                        sub.textContent =
                            longDay(data.endDate) + " · " + data.timezone;
                    else sub.textContent = "Loading…";
                }
                function fetchData() {
                    return fetch("/api/dashboard/data?days=" + range, {
                        headers: { Authorization: "Bearer " + token },
                    }).then(function (r) {
                        if (r.status === 401) {
                            signOut();
                            throw new Error("unauthorized");
                        }
                        if (!r.ok) throw new Error("http " + r.status);
                        return r.json();
                    });
                }
                let seq = 0;
                function refresh() {
                    const mine = ++seq;
                    loading = true;
                    loadError = false;
                    renderBanners();
                    renderRangeHeads();
                    renderHeader();
                    paint();
                    return fetchData()
                        .then(function (d) {
                            if (mine !== seq || !token) return;
                            if (!data)
                                TABS.forEach(function (t) {
                                    revealNext[t] = true;
                                });
                            data = d;
                            loading = false;
                            onData();
                        })
                        .catch(function (e) {
                            if (mine !== seq) return;
                            loading = false;
                            if (e && e.message === "unauthorized") return;
                            loadError = true;
                            renderBanners();
                            renderRangeHeads();
                            renderHeader();
                            paint();
                        });
                }
                function onData() {
                    markDirty();
                    renderBanners();
                    renderRangeHeads();
                    renderHeader();
                    paint();
                }

                /* ---------- session ---------- */
                function showApp() {
                    $("login").hidden = true;
                    $("app").hidden = false;
                }
                function signOut() {
                    token = null;
                    data = null;
                    loading = false;
                    loadError = false;
                    seq++;
                    store(KEY, null);
                    clearInspect();
                    TABS.forEach(function (t) {
                        $(t + "-body").innerHTML = "";
                    });
                    $("app").hidden = true;
                    $("login").hidden = false;
                    $("email").focus();
                }
                $("signout").addEventListener("click", signOut);

                $("login-form").addEventListener("submit", function (ev) {
                    ev.preventDefault();
                    const err = $("login-err");
                    const btn = $("login-btn");
                    err.textContent = "";
                    if (!$("email").value.trim() || !$("password").value) {
                        err.textContent = "Email or password is incorrect.";
                        return;
                    }
                    btn.disabled = true;
                    fetch("/api/dashboard/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: $("email").value,
                            password: $("password").value,
                        }),
                    })
                        .then(function (r) {
                            return r
                                .json()
                                .catch(function () {
                                    return {};
                                })
                                .then(function (b) {
                                    return {
                                        ok: r.ok,
                                        status: r.status,
                                        body: b,
                                    };
                                });
                        })
                        .then(function (res) {
                            btn.disabled = false;
                            if (!res.ok || !res.body.access_token) {
                                err.textContent =
                                    res.status === 429
                                        ? "Too many attempts. Wait a minute and try again."
                                        : "Email or password is incorrect.";
                                return;
                            }
                            token = res.body.access_token;
                            store(KEY, token);
                            $("password").value = "";
                            showApp();
                            // A deep link (#body) survives signing in;
                            // otherwise this lands on Today.
                            const want = location.hash.slice(1);
                            const tab =
                                TABS.indexOf(want) >= 0 ? want : "today";
                            selectTab(tab, { fromHash: true });
                            $("tab-" + tab).focus();
                            refresh();
                        })
                        .catch(function () {
                            btn.disabled = false;
                            err.textContent = "Could not reach the server.";
                        });
                });

                /* ---------- boot ---------- */
                let savedRange = +load(RANGE_KEY);
                // The 90-day range was dropped: a stored 90 becomes 30, and
                // the migration is written back so it happens once.
                if (savedRange === 90) {
                    savedRange = 30;
                    store(RANGE_KEY, "30");
                }
                if (RANGES.some((r) => r[0] === savedRange)) range = savedRange;
                const startTab = location.hash.slice(1);
                active = TABS.indexOf(startTab) >= 0 ? startTab : "today";
                selectTab(active, { fromHash: true });
                token = load(KEY);
                if (token) {
                    showApp();
                    refresh();
                }
            })();
        </script>
    </body>
</html>
