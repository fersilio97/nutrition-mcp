                                                  LG.ring(),
                                                  "Est. burn = break-even",
                                              ],
                                          ])
                                    : [],
                            ),
                    );
                    const done = s.done;
                    const grouped =
                        g === "day"
                            ? ""
                            : " Each bar is one " +
                              perWord() +
                              ": the average per logged day, so unlogged days don’t pull it toward zero; the current " +
                              perWord() +
                              " is dimmed and counts today once it ends.";
                    const balNote = !hasBurn()
                        ? ""
                        : "Eaten − estimated burn, in kcal and in grams (÷ 6 kcal per gram of weight change). An estimate for spotting the trend — daily scale weight swings far more with water and salt. Today is left out until it ends." +
                          (g === "day"
                              ? ""
                              : " Each bar is the " +
                                perWord() +
                                "’s total over its complete logged days.") +
                          (done.length > 1
                              ? " Net over " +
                                done.length +
                                " complete logged days: " +
                                fmtSigned(
                                    done.reduce(
                                        (a, r) => a + (r.balance_kcal || 0),
                                        0,
                                    ),
                                ) +
                                " kcal · " +
                                fmtSigned(s.net) +
                                " g."
                              : "");
                    const calTitle =
                        g === "day"
                            ? "Calories per day"
                            : "Calories · " +
                              (g === "week" ? "weekly" : "monthly") +
                              " average per logged day";
                    const calNote =
                        (hasGoal && hasBurn()
                            ? "<b>Over goal compares with your goal; Balance compares with est. burn (break-even). The gap between them is your planned deficit.</b> "
                            : "") +
                        (hasGoal
                            ? (goalCustom()
                                  ? "The goal is your " +
                                    fmt(goalCustom()) +
                                    " kcal baseline plus that day’s active calories from your watch"
                                  : "No goal set, so the goal is your estimated burn (resting + active + digestion)") +
                              "; the part of a bar above it is hatched."
                            : "No calorie goal set.") +
                        (hasBurn()
                            ? data.calibration && data.calibration.applied
                                ? " Est. burn = resting (calibrated from your weight trend) + active + 10% of what you eat for digestion — estimates, not measurements."
                                : " Est. burn = resting (Mifflin-St Jeor) + active + 10% of what you eat for digestion — estimates, not measurements."
                            : "") +
                        grouped;
                    $("trends-body").innerHTML =
                        '<div class="stack">' +
                        tilesHtml(rows, s) +
                        (barsView
                            ? ""
                            : '<section class="rv" aria-labelledby="h-cal2">' +
                              calories2Html() +
                              "</section>") +
                        (barsView
                            ? '<section class="rv" aria-labelledby="h-cal">'
                            : '<section class="rv" hidden aria-labelledby="h-cal">') +
                        secHead({
                            wide: true,
                            eyebrow: "Energy",
                            id: "h-cal",
                            title: calTitle,
                            note: calNote,
                            aside:
                                '<div class="chart-prefs">' +
                                chartPref(
                                    "calories-axis",
                                    "Calories axis",
                                    caloriesAxis,
                                    [
                                        ["full", "Y axis: Full"],
                                        ["collapsed", "Collapsed"],
                                    ],
                                ) +
                                chartPref(
                                    "calories-today",
                                    "Today bar",
                                    caloriesToday,
                                    [
                                        ["hidden", "Today: Hidden"],
                                        ["shown", "Shown"],
                                    ],
                                ) +
                                "</div>",
                            legend: any ? calLegend : "",
                        }) +
                        (any
                            ? '<div class="plot" id="cal-plot"></div><p class="chart-note" id="cal-axis-note"></p>'
                            : emptyMsg) +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-bal">' +
                        secHead({
                            wide: true,
                            eyebrow: "Balance",
                            id: "h-bal",
                            title: 'Estimated body change <span class="est">(estimate)</span>',
                            note: balNote,
                            legend:
                                hasBurn() && done.length
                                    ? legend([
                                          [
                                              LG.bar("m-gain"),
                                              "Est. gain (+, up)",
                                          ],
                                          [
                                              LG.bar("m-loss"),
                                              "Est. loss (−, down)",
                                          ],
                                      ])
                                    : "",
                        }) +
                        (!hasBurn()
                            ? '<p class="empty">Add your height, birth date and sex under Body › Body details to estimate this.<br>' +
                              ADD_BODY +
                              "</p>"
                            : done.length
                              ? '<div class="plot" id="bal-plot"></div>'
                              : '<p class="empty">No complete logged days in this range.</p>') +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-evs">' +
                        evsHtml() +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-met">' +
                        metabolismHtml() +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-mac">' +
                        secHead({
                            wide: true,
                            eyebrow: "Macros",
                            id: "h-mac",
                            title:
                                g === "day"
                                    ? "Macros per day"
                                    : "Macros · " +
                                      (g === "week" ? "weekly" : "monthly") +
                                      " average per logged day",
                            note: "Stacked grams of protein, carbs and fat.",
                            aside:
                                '<div class="chart-prefs">' +
                                chartPref(
                                    "macro-segments",
                                    "Segment grams",
                                    macroSegments ? "on" : "off",
                                    [
                                        ["on", "Segment grams"],
                                        ["off", "Hidden"],
                                    ],
                                ) +
                                chartPref(
                                    "macro-totals",
                                    "Day total",
                                    macroTotals ? "on" : "off",
                                    [
                                        ["on", "Day total"],
                                        ["off", "Hidden"],
                                    ],
                                ) +
                                "</div>",
                            legend: any
                                ? legend([
                                      [LG.bar("m-protein"), "Protein"],
                                      [LG.bar("m-carbs"), "Carbs"],
                                      [LG.bar("m-fat"), "Fat"],
                                  ])
                                : "",
                        }) +
                        (any
                            ? '<div class="plot" id="macro-plot"></div>'
                            : emptyMsg) +
                        "</section></div>";
                };

                // Gridlines in --line-2 with mono ticks; no gridline at 0,
                // where the 1px ink baseline sits instead.
                function yAxis(svg, maxY, x0, x1, yAt, ticks, f) {
                    for (let i = 0; i <= ticks; i++) {
                        const v = (maxY / ticks) * i;
                        const y = yAt(v);
                        if (i)
                            svg.appendChild(
                                svgEl("line", {
                                    x1: x0,
                                    x2: x1,
                                    y1: y,
                                    y2: y,
                                    class: "gridline",
                                }),
                            );
                        svgText(
                            svg,
                            x0 - 8,
                            y + 4,
                            f ? f(v) : fmt(v),
                            "ax",
                            "end",
                        );
                    }
                }
                const yLabels = (maxY, ticks, f) =>
                    [...Array(ticks + 1).keys()].map((i) =>
                        f ? f((maxY / ticks) * i) : fmt((maxY / ticks) * i),
                    );
                function baseline(svg, x0, x1, y) {
                    svg.appendChild(
                        svgEl("line", {
                            x1: x0,
                            x2: x1,
                            y1: y + 0.5,
                            y2: y + 0.5,
                            class: "baseline",
                        }),
                    );
                }
                // §4.4.6: one label format per granularity and column width;
                // uppercase comes from CSS (.xl), the text stays mixed case.
                function xLabel(r, bw) {
                    const g = gran();
                    if (g === "week")
                        return bw >= 80
                            ? spanLabel(r.start, r.end)
                            : shortDay(r.start);
                    if (g === "month") {
                        const d = parseDay(r.start);
                        const yr = parseDay(data.endDate).getFullYear();
                        return (
                            d.toLocaleDateString(undefined, {
                                month: "short",
                            }) +
                            (d.getFullYear() !== yr
                                ? " ’" + String(d.getFullYear()).slice(2)
                                : "") +
                            (r.in_progress ? "*" : "")
                        );
                    }
                    const d = parseDay(r.date);
                    return bw >= 64
                        ? d.toLocaleDateString(undefined, {
                              weekday: "short",
                          }) +
                              " " +
                              d.getDate()
                        : d.toLocaleDateString(undefined, {
                              weekday: "narrow",
                          });
                }
                function xAxis(svg, rows, lay, x0, y) {
                    const labels = rows.map((r) => xLabel(r, lay.bw));
                    const chars = Math.max.apply(
                        null,
                        labels.map((l) => l.length),
                    );
                    xLabelIdx(rows.length, lay.bw * rows.length, chars).forEach(
                        function (i) {
                            svgText(
                                svg,
                                x0 + lay.bw * (i + 0.5),
                                y,
                                labels[i],
                                "xl" + (rows[i].in_progress ? " now" : ""),
                                "middle",
                            );
                        },
                    );
                }
                function rangeText() {
                    return (
                        shortDay(data.startDate) +
                        " to " +
                        shortDay(data.endDate)
                    );
                }
                const stepWord = () => (gran() === "day" ? "day" : perWord());

                function calories2Chart() {
                    const host = $("cal2-plot");
                    if (!host || !host.clientWidth) return;
                    const raw = (data.daily || []).filter(
                        (r) => caloriesToday === "shown" || !r.in_progress,
                    );
                    const completed = raw.filter((r) => !r.in_progress);
                    const smooth = data.days > 14;
                    const components = (r) => {
                        if (r.burn_kcal == null) return null;
                        const baseline = r.bmr_kcal || 0;
                        const workout = r.active_kcal || 0;
                        return {
                            baseline,
                            digestion: r.burn_kcal - baseline - workout,
                            workout,
                            burn: r.burn_kcal,
                        };
                    };
                    const points = raw.map((r, i) => {
                        if (!smooth) {
                            const burn = components(r);
                            return {
                                ...r,
                                ...burn,
                                eaten: r.in_progress
                                    ? caloriesToday === "shown" &&
                                      r.mealCount > 0
                                        ? r.calories
                                        : null
                                    : r.counts_in_calibration
                                      ? r.calories
                                      : null,
                                goal: r.goal_calories,
                            };
                        }
                        const window = raw.slice(Math.max(0, i - 6), i + 1);
                        const counted = window.filter(
                            (x) =>
                                !x.in_progress &&
                                x.counts_in_calibration &&
                                x.calories != null,
                        );
                        // Eaten, burn and goal must average the SAME days:
                        // burn over every day (partial today, half-logged
                        // days) against eaten over complete days only drew a
                        // surplus that the daily view does not show. With
                        // too few complete days there is no eaten line, so
                        // the reference lines fall back to the whole window.
                        const basis = counted.length >= 4 ? counted : window;
                        const burns = basis.map(components).filter(Boolean);
                        const goals = basis.filter(
                            (x) => x.goal_calories != null,
                        );
                        const mean = (arr, key) =>
                            arr.length
                                ? arr.reduce((sum, x) => sum + x[key], 0) /
                                  arr.length
                                : null;
                        const vals = {};
                        ["baseline", "digestion", "workout", "burn"].forEach(
                            (key) => (vals[key] = mean(burns, key)),
                        );
                        return {
                            ...r,
                            ...vals,
                            eaten:
                                counted.length >= 4
                                    ? mean(counted, "calories")
                                    : null,
                            goal: mean(goals, "goal_calories"),
                        };
                    });
                    const vals = points
                        .flatMap((p) => [
                            p.baseline,
                            p.baseline + (p.digestion || 0),
                            p.burn,
                            p.eaten,
                            p.goal,
                        ])
                        .filter((v) => v != null);
                    if (!vals.length) return;
                    // The axis starts a little below the lowest baseline (the
                    // baseline band is cut, marked with a break), so the part
                    // that changes day to day — eaten, digestion, workout —
                    // gets the height instead of a solid block from zero.
                    const maxValue = Math.max(1, ...vals);
                    const baseMin = Math.min(
                        ...points
                            .map((p) => p.baseline)
                            .filter((v) => v != null),
                        ...vals,
                    );
                    const floor0 = Math.max(0, baseMin - 300);
                    const step =
                        [100, 200, 250, 500].find(
                            (x) =>
                                Math.ceil(maxValue / x) -
                                    Math.floor(floor0 / x) <=
                                6,
                        ) || 1000;
                    const lo = Math.floor(floor0 / step) * step;
                    const hi = Math.ceil(maxValue / step) * step;
                    const ticks = Math.round((hi - lo) / step);
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 240 : 280,
                        "Eaten, baseline, digestion, workout, estimated burn and calorie goal, kcal per day.",
                    );
                    const base = c.h - PAD.b,
                        L = gutter(yLabels(hi, 4)),
                        W = c.w - L - PAD.r,
                        H = base - PAD.t,
                        yAt = (v) =>
                            base - ((Math.max(v, lo) - lo) / (hi - lo)) * H,
                        svg = c.svg;
                    for (let i = 0; i <= ticks; i++) {
                        const v = lo + i * step,
                            y = yAt(v);
                        if (i)
                            svg.appendChild(
                                svgEl("line", {
                                    x1: L,
                                    x2: L + W,
                                    y1: y,
                                    y2: y,
                                    class: "gridline",
                                }),
                            );
                        svgText(svg, L - 8, y + 4, fmt(v), "lbl", "end");
                    }
                    const xAt = (i) =>
                        L +
                        (points.length < 2
                            ? W / 2
                            : (W * i) / (points.length - 1));
                    const area = (lower, upper, cls) => {
                        let seg = [];
                        const flush = () => {
                            if (!seg.length) return;
                            let d = "M" + xAt(seg[0][0]) + "," + yAt(seg[0][1]);
                            seg.forEach(
                                (q) => (d += "L" + xAt(q[0]) + "," + yAt(q[2])),
                            );

                                svgEl("path", { d: d + "Z", class: cls }),
                            );
                            seg = [];

                            seg.push([i, lower(p), upper(p)]);

                    area(
                        () => lo,

                        (p) => p.baseline,
                        (p) => p.baseline + p.digestion,

                        (p) => p.baseline + p.digestion,
                        (p) => p.burn,
                        "cal2-area-workout",
                    );
                    const line = (key) => {
                        let d = "",
                            prev = false;
                        points.forEach((p, i) => {
                            if (p[key] == null) {
                                prev = false;
                                return;
                            }
                            d +=
                                (prev ? "L" : "M") + xAt(i) + "," + yAt(p[key]);
                            prev = true;
                        });

                    };
                    svg.appendChild(
                        svgEl("path", {
                            d: line("burn"),
                            class: "cal2-burn-top",

                        svg.appendChild(
                            svgEl("path", {

                                    "M" +
                                    coords

                        )

                        const d0 = a.eaten - a.burn,
                            d1 = b.eaten - b.burn;
                        if (d0 <= 0 && d1 <= 0) continue;
                        const A = [xAt(i), yAt(a.eaten)],
                            B = [xAt(i + 1), yAt(b.eaten)],
                            C = [xAt(i + 1), yAt(b.burn)],
                            D = [xAt(i), yAt(a.burn)];
                        if (d0 * d1 < 0) {
                            const t = d0 / (d0 - d1),
                                x = xAt(i) + (xAt(i + 1) - xAt(i)) * t,
                                eaten = a.eaten + (b.eaten - a.eaten) * t,
                                burn = a.burn + (b.burn - a.burn) * t,
                                X = [x, yAt(eaten)],
                                Y = [x, yAt(burn)];
                            if (d0 > 0) polygon([A, X, Y, D]);
                            else polygon([X, B, C, Y]);

                    }
                    svg.appendChild(
                        svgEl("path", {
                            d: line("eaten"),

                    svg.appendChild(

                    const last = points

                            "end",
                        );
                    }
                    inspect(
                        svg,
                        points.map((p) => {
                            const delta =
                                p.eaten == null || p.burn == null

                            const rows = [
                                [
                                    "cal2-eaten-dot",
                                    "Eaten",
                                    p.eaten == null
                                        ? p.counts_in_calibration
                                            ? "not logged"
                                            : "not counted"
                                        : fmt(p.eaten) + " kcal",
                                ],
                                [
                                    "cal2-area-base",
                                    "Baseline",
                                    p.baseline == null
                                        ? "—"
                                        : fmt(p.baseline) + " kcal",
                                ],
                                [
                                    "cal2-area-workout",
                                    "Workout / active",
                                    p.workout == null
                                        ? "—"
                                        : fmt(p.workout) + " kcal",
                                ],
                                [
                                    "cal2-area-digestion",
                                    "Digestion",
                                    p.digestion == null
                                        ? "—"
                                        : fmt(p.digestion) + " kcal",
                                ],
                                [
                                    "cal2-burn-top",
                                    "Est. burn",
                                    p.burn == null
                                        ? "—"
                                        : fmt(p.burn) + " kcal",
                                    1,
                                ],
                            ].concat(
                                !(data.goals && data.goals.calories > 0)
                                    ? []
                                    : [
                                          [
                                              "cal2-goal",
                                              "Goal",
                                              p.goal == null
                                                  ? "—"
                                                  : fmt(p.goal) + " kcal",
                                          ],
                                      ],
                            );
                            if (delta != null)
                                rows.push([
                                    null,
                                    delta < 0 ? "Deficit" : "Surplus",
                                    fmt(Math.abs(delta)) + " kcal",
                                    1,
                                ]);
                            const t = tipContent(
                                shortDay(p.date) +
                                    (p.in_progress ? " · so far" : "") +
                                    (smooth ? " · 7-day avg" : ""),
                                rows,
                            );
                            return {
                                x: xAt(points.indexOf(p)),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                    const logged = completed.filter(
                            (r) =>
                                r.counts_in_calibration &&
                                r.calories != null &&
                                r.burn_kcal != null,
                        ),
                        avg = (key) =>
                            logged.length
                                ? logged.reduce(
                                      (sum, r) =>
                                          sum +
                                          (key === "eaten"
                                              ? r.calories
                                              : key === "workout"
                                                ? r.active_kcal || 0
                                                : key === "burn"
                                                  ? r.burn_kcal
                                                  : r[key]),
                                      0,
                                  ) / logged.length
                                : null,
                        avgE = avg("eaten"),
                        avgB = avg("burn"),
                        avgW = avg("workout"),
                        avgBal =

                    $("cal2-stats").innerHTML =
                        stat(
                            "Avg eaten",
                            avgE == null ? "—" : fmt(avgE),
                            "kcal/day",
                        ) +
                        stat(
                            "Avg est. burn",
                            avgB == null ? "—" : fmt(avgB),
                            "kcal/day",
                            "of which workout " +
                                (avgW == null ? "—" : fmt(avgW)) +
                                " kcal/day",
                        ) +
                        stat(
                            "Avg workout",
                            avgW == null ? "—" : fmt(avgW),
                            "kcal/day",
                        ) +
                        stat(
                            "Avg balance",
                            avgBal == null ? "—" : fmtSigned(avgBal),
                            "kcal/day",
                        );
                    const n = logged.length,
                        weekly =
                            avgBal == null ? 0 : (Math.abs(avgBal) * 7) / 6;
                    $("cal2-today").textContent =

                                " fully logged days you ate ~" +
                                fmt(Math.abs(avgBal)) +
                                " kcal/day " +
                                (avgBal < 0 ? "under" : "over") +
                                " your burn — about " +
                                wDelta(weekly, data.weightUnit).replace(

                function caloriesChart() {

                    if (!host || !host.clientWidth) return;
                    const rows = chartRows().filter(
                        (r) => caloriesToday !== "hidden" || !r.in_progress,
                    );
                    const note = $("cal-axis-note");
                    const s = trendsStats(data.daily);
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 240 : 280,
                        "Calories, " +
                            rangeText() +
                            (gran() === "day"
                                ? ", per day"
                                : ", average per logged day by " + perWord()) +

                            fmt(s.avgKcal) +
                            " kcal over " +
                            plural(s.logged.length, "logged day") +
                            ". Use the arrow keys to read each " +
                            stepWord() +
                            ".",

                    const svg = c.svg;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const peak = Math.max.apply(
                        null,
                        rows
                            .map((r) =>
                                Math.max(
                                    r.calories || 0,
                                    r.goal_calories || 0,
                                    r.burn_kcal || 0,
                                ),
                            )
                            .concat(
                                data.calibration && data.calibration.applied
                                    ? [data.calibration.bmr_kcal]
                                    : [],
                            ),
                    );
                    const eaten = rows
                        .filter((r) => r.calories > 0)
                        .map((r) => r.calories);
                    const minEaten = eaten.length
                        ? Math.min.apply(null, eaten)
                        : 0;
                    const minY =
                        caloriesAxis === "collapsed"
                            ? Math.max(
                                  0,
                                  Math.floor((minEaten - 300) / 100) * 100,
                              )
                            : 0;
                    const maxY =
                        caloriesAxis === "collapsed"
                            ? Math.max(minY + 100, peak * 1.03)
                            : tickMax(peak * 1.05, 4);
                    if (note)
                        note.textContent =
                            caloriesAxis === "collapsed"
                                ? "Axis starts at " +
                                  minY +
                                  " kcal, so bar heights are not proportional to zero."
                                : "";
                    const L = gutter(
                        caloriesAxis === "collapsed" ? [""] : yLabels(maxY, 4),
                    );
                    const plotW = c.w - L - PAD.r;
                    const yAt = (v) =>
                        base - ((v - minY) / (maxY - minY)) * plotH;
                    if (caloriesAxis !== "collapsed")
                        yAxis(svg, maxY, L, L + plotW, yAt, 4);
                    const lay = bandLayout(rows.length, plotW);
                    calBars(svg, rows, L, plotW, yAt, base, lay);
                    baseline(svg, L, L + plotW, base);
                    if (caloriesAxis === "collapsed") {
                        svg.appendChild(
                            svgEl("path", {
                                d:
                                    "M" +
                                    L +
                                    "," +
                                    (base - 3) +
                                    "l4,-5 4,5 4,-5 4,5",
                                class: "gridline",
                            }),
                        );
                        rows.forEach(function (r, i) {
                            const h = base - yAt(r.calories || 0);
                            if (r.calories > 0 && h >= 18)
                                svgText(
                                    svg,
                                    L + lay.bw * (i + 0.5),
                                    yAt(r.calories) + 13,
                                    fmt(r.calories),
                                    "chart-value",
                                    "middle",
                                );
                        });
                    }
                    // Goal as a step line: each bar's own target across its
                    // column, joined vertically where it changes.
                    let d = "";
                    rows.forEach(function (r, i) {
                        if (!r.goal_calories) return;
                        const y = yAt(r.goal_calories);
                        const x0 = L + lay.bw * i;
                        const prev = rows[i - 1];
                        d +=
                            (prev && prev.goal_calories ? "L" : "M") +
                            x0 +
                            "," +
                            y +
                            "L" +
                            (x0 + lay.bw) +
                            "," +
                            y;
                    });
                    if (d)
                        svg.appendChild(
                            svgEl("path", { d: d, class: "goal-line" }),
                        );
                    // Burn as resting base + workout: a dashed resting line
                    // (it moves as weight does), and the active kcal as a
                    // segment from it up to the total ring.
                    let rest = "";
                    rows.forEach(function (r, i) {
                        if (r.bmr_kcal == null) return;
                        const prev = rows[i - 1];
                        rest +=
                            (prev && prev.bmr_kcal != null ? "L" : "M") +
                            (L + lay.bw * (i + 0.5)) +
                            "," +
                            yAt(r.bmr_kcal);

                    if (data.calibration && data.calibration.applied) {

                        rows.forEach(function (r, i) {
                            if (r.bmr_kcal == null || !r.active_kcal) return;

                                x1: x,
                                x2: x,

                            ? 4
                            : lay.bw >= 8
                              ? 3
                              : lay.bw >= 3
                                ? 2.5
                                : 1.5;
                    rows.forEach(function (r, i) {
                        if (!r.burn_kcal) return;
                        const ci = svgEl("circle", {
                            cx: L + lay.bw * (i + 0.5),
                            cy: yAt(r.burn_kcal),
                            r: rr,
                            class: "m-burn" + (r.dim ? " dim" : ""),

                        svg.appendChild(ci);
                    });
                    // Drawn last, with a surface halo, so no mark covers it.

                    if (lastGoal)

                            svg,
                            L + plotW,

                            "end",

                }

                // Estimated change per bar, up in --gain or down in --loss,

                function balanceChart() {
                    const host = $("bal-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = chartRows();
                    const plotted = (r) => r.band_g != null;
                    const known = rows.filter(plotted);
                    const netG = known.reduce((a, r) => a + r.band_g, 0);
                    const netK = known.reduce(
                        (a, r) => a + (r.band_kcal || 0),

                            stepWord() +

                    const top = PAD.t + 6;
                    const bottom = c.h - PAD.b - 6;

                    const peak = Math.max.apply(
                        null,
                        known.map((r) => Math.abs(r.band_g)),
                    );
                    // Direct labels (grams over kcal) only where a column is
                    // ≥ 64px wide; they need headroom past the bar end.
                    const L0 = gutter([fmtSigned(niceMax(peak)), "0 g"]);
                    const labelled = (c.w - L0 - PAD.r) / rows.length >= 64;
                    const maxAbs = niceMax(
                        Math.max(peak, 20) * (labelled ? 1.7 : 1.15),
                    );
                    const L = gutter([
                        fmtSigned(maxAbs),
                        fmtSigned(-maxAbs),
                        "0 g",
                    ]);
                    const plotW = c.w - L - PAD.r;
                    const yAt = (v) =>
                        zeroY - (v / maxAbs) * ((bottom - top) / 2);
                    [maxAbs, -maxAbs].forEach(function (v) {
                        svg.appendChild(
                            svgEl("line", {

                            "end",

                                    (r.dim ? " dim" : "") +
                                    " grow" +

                                style: growDelay(i),
                            }),

                        if (lay.bw >= 64) {
                            const cx = x + lay.barW / 2;
                            const gy = v >= 0 ? y - 19 : y + h + 14;
                            svgText(svg, cx, gy, fmtSigned(v) + " g", "lbl");
                            svgText(
                                svg,
                                cx,
                                gy + 14,
                                fmtSigned(r.band_kcal || 0) + " kcal",
                                "lbl sub",
                            );
                        }
                    });
                    svg.appendChild(
                        svgEl("line", {
                            x1: L,
                            x2: L + plotW,
                            y1: zeroY,
                            y2: zeroY,
                            class: "zero",

                    svgText(svg, L - 8, zeroY + 4, "0 g", "ax", "end");
                    xAxis(svg, rows, lay, L, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {

                                x: L + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,

                            " g, fat " +
                            fmt(avg("fat_g")) +
                            " g. Use the arrow keys to read each " +
                            stepWord() +
                            ".",
                    );
                    const svg = c.svg;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const total = (r) =>
                        (r.protein_g || 0) + (r.carbs_g || 0) + (r.fat_g || 0);
                    const maxY = tickMax(
                        Math.max.apply(null, rows.map(total)) * 1.05,
                        4,
                    );
                    const L = gutter(yLabels(maxY, 4));
                    const plotW = c.w - L - PAD.r;
                    const yAt = (v) => base - (v / maxY) * plotH;
                    yAxis(svg, maxY, L, L + plotW, yAt, 4);
                    const lay = bandLayout(rows.length, plotW);
                    const gapPx = lay.barW >= 4 ? 2 : 0;
                    rows.forEach(function (r, i) {
                        if (r.calories == null) return; // no logged days
                        const x = L + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const w = lay.barW;
                        let acc = 0;
                        // Fat at the bottom, protein on top. Each segment
                        // above another leaves a 2px gap; only the segment
                        // that finishes the stack is rounded.
                        for (let s = MACROS.length - 1; s >= 0; s--) {
                            const val = r[MACROS[s].key] || 0;
                            if (val <= 0) continue;
                            const yTop = yAt(acc + val);
                            const segH = Math.max(
                                0,
                                yAt(acc) - yTop - (acc > 0 ? gapPx : 0),
                            );
                            svg.appendChild(
                                svgEl("path", {
                                    d: rectPath(x, yTop, w, segH),
                                    class:
                                        MACROS[s].cls +
                                        (r.dim ? " dim" : "") +
                                        " grow",
                                    style: growDelay(i),
                                }),
                            );
                            if (macroSegments && segH >= 16 && lay.barW >= 14) {
                                svgText(
                                    svg,
                                    x + w / 2,
                                    yTop + segH / 2 + 3,
                                    fmt(val) + "g",
                                    "chart-value" + (r.dim ? " dim" : ""),
                                    "middle",
                                );
                            }
                            acc += val;
                        }
                        if (macroTotals && lay.barW >= 16)

                                x + w / 2,
                                yAt(total(r)) - 5,
                                fmt(total(r)) + "g",

                                "middle",
                            );

                            return {

                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,

                                c.calibration.window.tdee_kcal,
                            "",
                        ],
                        [
                            "Average digestion kcal/day",
                            d.calibration.window &&
                                d.calibration.window.tef_kcal,
                            c.calibration.window &&
                                c.calibration.window.tef_kcal,
                            "",
                        ],
                        [
                            "Baseline (lookback average) kcal/day",
                            d.calibration.window &&
                                d.calibration.window.baseline_kcal,
                            c.calibration.window &&
                                c.calibration.window.baseline_kcal,
                            "",
                        ],
                        [
                            "Offset vs formula kcal/day",
                            d.calibration.window &&
                                d.calibration.window.offset_kcal,
                            c.calibration.window &&
                                c.calibration.window.offset_kcal,
                            "",
                        ],
                        [
                            "Uncertainty ±kcal/day",
                            d.calibration.window &&
                                d.calibration.window.uncertainty_kcal,
                            c.calibration.window &&
                                c.calibration.window.uncertainty_kcal,
                            "",

                        [
                            "Today's baseline kcal/day",

                        ],
                    ];
                    const cell = (x) =>
                        x == null

                                : fmt(x);
                    const tableRows = rows
                        .map(

                                "</td><td>" +
                                cell(r[2]) +
                                "</td><td>" +
                                (typeof r[1] !== "number" ||

                                r[1] === r[2]

                                "</td></tr>",
                        )
                        .join("");
                    // Reliable = passes the checks; whether the user has
                    // switched calibration on in Body details is separate.
                    const reliable = c.calibration.status === "ok";
                    const dBase = d.calibration.resting_kcal,

                                c.calibration.window &&
                                    c.calibration.window.uncertainty_kcal,

                            "), " +
                            fmt(Math.abs(cBase - dBase)) +

                    host.innerHTML =
                        '<div class="lab-table-wrap calc-table-wrap"><table class="calc-table lab-table"><thead><tr><th></th><th>Default</th><th>What-if</th><th>Change</th></tr></thead><tbody>' +
                        tableRows +
                        "<tr><td>Reliability</td><td>" +
                        (d.calibration.status === "ok" && d.calibration.applied
                            ? "✓ reliable"
                            : "✗ " +

                            : "✗ " +
                              (labReasons[c.calibration.status] ||

                }
                function fetchLab() {
                    const mine = ++labSequence;
                    labResult = null;
                    renderLabResults();
                    clearTimeout(labTimer);
                    labTimer = setTimeout(function () {
                        fetch(
                            "/api/dashboard/whatif?window=" +
                                labWindow +
                                "&k=" +
                                labK.toFixed(1) +
                                "&tef=" +
                                encodeURIComponent(labTef),
                            { headers: { Authorization: "Bearer " + token } },
                        )
                            .then(function (r) {
                                if (r.status === 401) {
                                    signOut();
                                    throw new Error("unauthorized");
                                }
                                if (!r.ok) throw new Error("request failed");
                                return r.json();
                            })
                            .then(function (result) {
                                if (mine !== labSequence) return;
                                labResult = result;
                                renderLabResults();
                            })
                            .catch(function (e) {
                                if (
                                    mine !== labSequence ||
                                    e.message === "unauthorized"
                                )
                                    return;
                                const host = $("lab-results");
                                if (host)
                                    host.innerHTML =
                                        '<p class="lab-status" role="status">Could not calculate.</p>';
                            });
                    }, 250);
                }
                function wireLab() {
                    const box = $("lab-box");
                    box.addEventListener("toggle", function () {
                        labOpen = box.open;
                        if (box.open) fetchLab();
                    });
                    box.addEventListener("click", function (ev) {
                        const w = ev.target.closest("[data-lab-window]"),
                            t = ev.target.closest("[data-lab-tef]");
                        if (w) {
                            labWindow = Number(w.dataset.labWindow);
                            box.querySelectorAll("[data-lab-window]").forEach(
                                (b) =>
                                    b.setAttribute(
                                        "aria-pressed",
                                        String(
                                            Number(b.dataset.labWindow) ===
                                                labWindow,
                                        ),
                                    ),
                            );
                            fetchLab();
                        }
                        if (t) {
                            labTef = t.dataset.labTef;
                            box.querySelectorAll("[data-lab-tef]").forEach(
                                (b) =>
                                    b.setAttribute(
                                        "aria-pressed",
                                        String(b.dataset.labTef === labTef),
                                    ),
                            );
                            fetchLab();
                        }
                        if (ev.target.id === "lab-reset") {
                            labWindow = 42;
                            labK = 6;
                            labTef = "macros";
                            $("lab-k").value = "6";
                            $("lab-k-out").textContent = "6.0";
                            box.querySelectorAll("[data-lab-window]").forEach(
                                (b) =>
                                    b.setAttribute(
                                        "aria-pressed",
                                        String(
                                            Number(b.dataset.labWindow) === 42,
                                        ),
                                    ),
                            );
                            box.querySelectorAll("[data-lab-tef]").forEach(
                                (b) =>
                                    b.setAttribute(
                                        "aria-pressed",
                                        String(b.dataset.labTef === "macros"),
                                    ),
                            );
                            fetchLab();
                        }
                    });
                    $("lab-k").addEventListener("input", function () {
                        labK = Number(this.value);
                        $("lab-k-out").textContent = labK.toFixed(1);
                        fetchLab();
                    });
                    if (labOpen) fetchLab();
                }
                function fillBodyForm() {

                    $("b-unit").value = unit;
                    $("b-height").value = d
                        ? d.height

                    $("b-birth").value = d ? d.birth : body.birth_date || "";
                    $("b-sex").value = d ? d.sex : body.sex || "";

                        (data.calibration && data.calibration.basis) ||

                    // Open it when something is missing, so the ask is

                        // The toggle event fires async; its handler
                        // consumes this flag, so it is set only when a

                            .then(function (res) {
                                if ($("b-save")) $("b-save").disabled = false;
                                if (res.status === 401) return signOut();

                            .catch(function () {

                                    "Could not reach the server.",

                RENDER.body = function () {

                // Time-scaled, not index-scaled: weigh-ins are irregular, and
                // even spacing would make a two-week gap look like a day.
                CHARTS.body = function () {
                    const host = $("weight-plot");
                    if (!host || !host.clientWidth) return;
                    const unit = data.weightUnit;
                    const s = data.weightStats;
                    const pts = data.weights
                        .map((w) => ({
                            date: w.date,
                            v: toUnit(w.weight_g, unit),
                        }))
                        .sort((a, b) => (a.date < b.date ? -1 : 1));
                    const first = pts[0];
                    const last = pts[pts.length - 1];
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 220 : 280,
                        "Body weight since " +
                            shortDay(data.weightWindowStart) +
                            ": " +
                            first.v.toFixed(1) +
                            " " +
                            unit +
                            " on " +
                            shortDay(first.date) +
                            " to " +
                            last.v.toFixed(1) +
                            " " +
                            unit +
                            " on " +
                            shortDay(last.date) +
                            (s.target_g != null
                                ? ", target " +
                                  wfmt(s.target_g, unit) +
                                  " " +
                                  unit
                                : "") +
                            ". Use the arrow keys to read each weigh-in.",
                    );
                    const svg = c.svg;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const vals = pts.map((p) => p.v);
                    if (s.target_g != null) vals.push(toUnit(s.target_g, unit));
                    let lo = Math.min.apply(null, vals);
                    let hi = Math.max.apply(null, vals);
                    const padY = (hi - lo) * 0.2 || 1;
                    lo -= padY;
                    hi += padY;
                    const L = gutter([hi.toFixed(1), lo.toFixed(1)]);
                    const plotW = c.w - L - PAD.r;
                    const t0 = parseDay(data.weightWindowStart).getTime();
                    const t1 = parseDay(data.endDate).getTime();
                    const xAt = (iso) =>
                        L +
                        (t1 === t0
                            ? plotW / 2
                            : ((parseDay(iso).getTime() - t0) / (t1 - t0)) *
                              plotW);
                    const yAt = (v) => base - ((v - lo) / (hi - lo)) * plotH;
                    if (s.healthy_min_g != null) {
                        const a = Math.max(lo, toUnit(s.healthy_min_g, unit));
                        const b = Math.min(hi, toUnit(s.healthy_max_g, unit));
                        if (b > a)
                            svg.appendChild(
                                svgEl("rect", {
                                    x: L,
                                    y: yAt(b),
                                    width: plotW,
                                    height: yAt(a) - yAt(b),
                                    class: "m-band",
                                }),
                            );
                    }
                    baseline(svg, L, L + plotW, base);
                    for (let i = 0; i <= 3; i++) {
                        const v = lo + ((hi - lo) / 3) * i;
                        if (i)
                            svg.appendChild(
                                svgEl("line", {
                                    x1: L,
                                    x2: L + plotW,
                                    y1: yAt(v),
                                    y2: yAt(v),
                                    class: "gridline",
                                }),
                            );
                        svgText(
                            svg,
                            L - 8,
                            yAt(v) + 4,
                            v.toFixed(1),
                            "ax",
                            "end",
                        );
                    }
                    if (s.target_g != null) {
                        const ty = yAt(toUnit(s.target_g, unit));
                        svg.appendChild(
                            svgEl("line", {
                                x1: L,
                                x2: L + plotW,
                                y1: ty,
                                y2: ty,
                                class: "m-target",
                            }),
                        );
                        svgText(
                            svg,
                            L + plotW,
                            ty - 7,
                            "Target " + wfmt(s.target_g, unit),
                            "goal-lbl",
                            "end",
                        );
                    }
                    svg.appendChild(
                        svgEl("path", {
                            d: pts
                                .map(
                                    (p, i) =>
                                        (i ? "L" : "M") +
                                        xAt(p.date) +
                                        "," +
                                        yAt(p.v),
                                )
                                .join(" "),
                            class: "m-wline",
                        }),
                    );
                    const r = pts.length > 60 ? 2.5 : 3.5;
                    pts.forEach(function (p) {
                        svg.appendChild(
                            svgEl("circle", {
                                cx: xAt(p.date),
                                cy: yAt(p.v),
                                r: r,
                                class: "m-wdot",
                            }),
                        );
                    });
                    [data.weightWindowStart, data.endDate].forEach(
                        function (iso, k) {
                            svgText(
                                svg,
                                k ? L + plotW : L,
                                c.h - 8,
                                shortDay(iso),
                                "xl",
                                k ? "end" : "start",
                            );
                        },
                    );
                    inspect(
                        svg,
                        pts.map(function (p) {
                            const rows = [
                                [
                                    "s-accent",
                                    "Weight",
                                    p.v.toFixed(1) + " " + unit,
                                    1,
                                ],
                            ];
                            if (s.height_cm)
                                rows.push([
                                    null,
                                    "BMI",
                                    (
                                        (unit === "lb"
                                            ? p.v * 0.45359237
                                            : p.v) /
                                        Math.pow(s.height_cm / 100, 2)
                                    ).toFixed(1),
                                ]);
                            const t = tipContent(longDay(p.date), rows);
                            return {
                                x: xAt(p.date),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                };

                /* ================= MEALS ================= */

                const MEAL_NUMS = [

                const numStr = (v) => (v == null ? "" : String(v));

                function readMealForm() {
                    const v = {
                        description: $("me-description").value,
                        meal_type: $("me-type").value,
                        logged_at: $("me-at").value,
                    };
                    MEAL_NUMS.forEach(function (n) {
                        v[n[0]] = $("me-" + n[0]).value;
                    });
                    return v;
                }
                // Only what differs from the meal as listed. A number left
                // as it was is not sent even if it was blank; a value the
                // user blanks IS sent, and the server says it can't clear.
                function mealChanges(m, v) {
                    const was = mealValues(m);
                    const out = {};
                    if (v.description.trim() !== was.description.trim())
                        out.description = v.description;
                    if (v.meal_type && v.meal_type !== was.meal_type)
                        out.meal_type = v.meal_type;
                    if (v.logged_at && v.logged_at !== was.logged_at)
                        out.logged_at = v.logged_at;
                    MEAL_NUMS.forEach(function (n) {
                        const now = v[n[0]].trim();
                        const before = was[n[0]];
                        if (now === before) return;
                        if (
                            now !== "" &&
                            before !== "" &&
                            Number(now) === Number(before)
                        )
                            return;
                        out[n[0]] = now === "" ? "" : Number(now);
                    });
                    return out;
                }
                function closeMealEdit(focusId) {
                    mealEditId = null;

                            '#meals-body [data-edit="' + focusId + '"]',

                        if (b) b.focus();

                $("meals-body").addEventListener("click", function (ev) {
                    const ed = ev.target.closest("[data-edit]");
                    if (ed) {

                        if (mealEditId === id) return closeMealEdit(id);
                        mealEditId = id;
                        mealDraft = null;
                        contentDirty.meals = true;
                        paint();
                        const d = $("me-description");
                        if (d) d.focus();

                    if (ev.target.closest("#me-cancel"))
                        closeMealEdit(mealEditId);

                    if (ev.target.closest("#me-form"))
