<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <script>
            // Pre-paint theme: runs before any CSS parses, so a dark-mode
            // visitor never sees a light flash. localStorage can throw
            // (private window, blocked site data); the page works without it.
            (function () {
                try {
                    var t = localStorage.getItem("nutrition-dash-theme");
                    if (t === "light" || t === "dark")
                        document.documentElement.setAttribute("data-theme", t);
                } catch (e) {}
            })();
        </script>
        <link
            rel="preload"
            href="/dashboard-fonts/instrument-sans-latin-v4.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/dashboard-fonts/bricolage-grotesque-latin-v9.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Your nutrition dashboard</title>
        <style>
            /* =============================================================
               Personal dashboard — round 3 ("Nutrition Facts").
               The public site's grammar (public/styles.css) adapted to dense
               data: Facts panels as each tab's hero, a 3px ink rule above every
               section, hairlines between rows, ruled 1px-gap grids instead of
               floating cards. Rule hierarchy 10 / 5 / 3 / 1px is the whole
               visual hierarchy, together with type size.
               Fonts are self-hosted (/dashboard-fonts/, OFL texts alongside):
               the page makes no third-party request.
               ============================================================= */
            @font-face {
                font-family: "Bricolage Grotesque";
                src: url("/dashboard-fonts/bricolage-grotesque-latin-v9.woff2")
                    format("woff2");
                font-weight: 400 800;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "Instrument Sans";
                src: url("/dashboard-fonts/instrument-sans-latin-v4.woff2")
                    format("woff2");
                font-weight: 400 700;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "Geist Mono";
                src: url("/dashboard-fonts/geist-mono-latin-v6.woff2")
                    format("woff2");
                font-weight: 400 500;
                font-style: normal;
                font-display: swap;
            }

            /* ---------- tokens (light) ---------- */
            :root,
            :root[data-theme="light"] {
                --bg: #fbfbf9;
                --bg-alt: #f2f4f0;
                --surface: #ffffff;
                --surface-2: #f4f6f2;
                --ink: #111a15;
                --ink-2: #56635b;
                --ink-3: #68736b;
                --line: #dfe5e0;
                --line-2: #eceeea;
                --rule: var(--ink);
                --control: #7c8a81;
                --accent: #3b7a4f;
                --accent-text: #2f6440;
                --accent-ink: #ffffff;
                --accent-soft: #e4efe6;
                --focus-ring: #2f6440;
                --kcal: #4a6a8f;
                --protein: #6d4fc2;
                --carbs: #2f7d3a;
                --fat: #c2405e;
                --fiber: #1a7a72;
                --sugar: #6b7a12;
                --water: #1f6fa8;
                --burn: #4d5d7a;
                --over: #a8432a;
                --over-tint: #f2dcd5;
                --gain: #a35a0b;
                --loss: #2563a6;
                --warn: #8a5a00;
                --cal2-eaten: #4d5d7a;
                --shadow-card:
                    0 1px 2px rgba(17, 26, 21, 0.04),
                    0 12px 32px -12px rgba(17, 26, 21, 0.12);
                --shadow-float:
                    0 2px 4px rgba(17, 26, 21, 0.06),
                    0 30px 60px -20px rgba(17, 26, 21, 0.25);
                color-scheme: light;
            }
            /* ---------- tokens (dark: forest, not grey) ---------- */
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #0d1210;
                    --bg-alt: #111916;
                    --surface: #141c18;
                    --surface-2: #1a2420;
                    --ink: #edf1ee;
                    --ink-2: #9eaaa2;
                    --ink-3: #86918a;
                    --line: #25312a;
                    --line-2: #1d2722;
                    --rule: var(--ink);
                    --control: #66736b;
                    --accent: #79c28c;
                    --accent-text: #9ad6a8;
                    --accent-ink: #0d1210;
                    --accent-soft: #18291f;
                    --focus-ring: #9ad6a8;
                    --kcal: #9db7d6;
                    --protein: #b6a1f2;
                    --carbs: #8acb7f;
                    --fat: #f08aa0;
                    --fiber: #5cc8bc;
                    --sugar: #c4d46a;
                    --water: #6fb6e8;
                    --burn: #a3b1cc;
                    --over: #e08a74;
                    --over-tint: #3a221c;
                    --gain: #f2b25c;
                    --loss: #7fb0f0;
                    --warn: #e8b45a;
                    --cal2-eaten: #a3b1cc;
                    --shadow-card:
                        0 1px 2px rgba(0, 0, 0, 0.3),
                        0 12px 32px -12px rgba(0, 0, 0, 0.6);
                    --shadow-float:
                        0 2px 4px rgba(0, 0, 0, 0.4),
                        0 30px 60px -20px rgba(0, 0, 0, 0.7);
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --bg: #0d1210;
                --bg-alt: #111916;
                --surface: #141c18;
                --surface-2: #1a2420;
                --ink: #edf1ee;
                --ink-2: #9eaaa2;
                --ink-3: #86918a;
                --line: #25312a;
                --line-2: #1d2722;
                --rule: var(--ink);
                --control: #66736b;
                --accent: #79c28c;
                --accent-text: #9ad6a8;
                --accent-ink: #0d1210;
                --accent-soft: #18291f;
                --focus-ring: #9ad6a8;
                --kcal: #9db7d6;
                --protein: #b6a1f2;
                --carbs: #8acb7f;
                --fat: #f08aa0;
                --fiber: #5cc8bc;
                --sugar: #c4d46a;
                --water: #6fb6e8;
                --burn: #a3b1cc;
                --over: #e08a74;
                --over-tint: #3a221c;
                --gain: #f2b25c;
                --loss: #7fb0f0;
                --warn: #e8b45a;
                --cal2-eaten: #a3b1cc;
                --shadow-card:
                    0 1px 2px rgba(0, 0, 0, 0.3),
                    0 12px 32px -12px rgba(0, 0, 0, 0.6);
                --shadow-float:
                    0 2px 4px rgba(0, 0, 0, 0.4),
                    0 30px 60px -20px rgba(0, 0, 0, 0.7);
                color-scheme: dark;
            }

            /* ---------- scale ---------- */
            :root {
                --cal2-c-eaten: var(--ink);
                --cal2-c-base: color-mix(in srgb, var(--burn) 16%, var(--bg));
                --cal2-c-digestion: color-mix(
                    in srgb,
                    var(--accent) 35%,
                    var(--bg)
                );
                --cal2-c-workout: color-mix(
                    in srgb,
                    var(--burn) 60%,
                    var(--bg)
                );
                --cal2-c-surplus: color-mix(
                    in srgb,
                    var(--over) 45%,
                    var(--bg)
                );
                --font-display:
                    "Bricolage Grotesque", -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
                --font-body:
                    "Instrument Sans", -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
                --font-mono:
                    "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
                --fs-hero: clamp(3rem, 2rem + 4.5vw, 4.6rem);
                --fs-display: clamp(2rem, 1.5rem + 2.4vw, 2.9rem);
                --fs-h2: clamp(1.35rem, 1.1rem + 1vw, 1.75rem);
                --fs-figure: clamp(1.5rem, 1.25rem + 1vw, 2rem);
                --fs-row: 1.15rem;
                --fs-label: 1.05rem;
                --fs-body: 1rem;
                --fs-small: 0.875rem;
                --fs-foot: 0.8125rem;
                --fs-eyebrow: 0.75rem;
                --fs-mono: 0.8125rem;
                --s1: 4px;
                --s2: 8px;
                --s3: 12px;
                --s4: 16px;
                --s5: 20px;
                --s6: 24px;
                --s8: 32px;
                --s10: 40px;
                --s12: 48px;
                --gutter: clamp(1rem, 4vw, 2.5rem);
                --gap-section: clamp(2.25rem, 5vw, 3.5rem);
                --gap-block: clamp(1rem, 2.5vw, 1.5rem);
                --r-panel: 22px;
                --r-input: 12px;
                --r-pill: 999px;
                --r-tip: 12px;
                --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
                --head-h: 64px;
            }

            /* ---------- base ---------- */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html {
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font-body);
                font-size: var(--fs-body);
                line-height: 1.55;
                font-synthesis: none;
                font-variant-numeric: tabular-nums;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                -webkit-tap-highlight-color: transparent;
            }
            ::selection {
                background: color-mix(in srgb, var(--accent) 28%, transparent);
            }
            [hidden] {
                display: none !important;
            }
            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            h1,
            h2,
            h3,
            p {
                margin: 0;
            }
            :focus-visible {
                outline: 2px solid var(--focus-ring);
                outline-offset: 3px;
                border-radius: 6px;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
            .eyebrow,
            .micro {
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                line-height: 1.3;
                text-transform: uppercase;
                color: var(--ink-2);
            }
            .eyebrow {
                color: var(--accent-text);
            }
            .note {
                font-size: var(--fs-small);
                line-height: 1.5;
                color: var(--ink-2);
                max-width: 68ch;
                text-wrap: pretty;
            }
            .note b {
                color: var(--ink);
                font-weight: 600;
            }
            .empty {
                font-size: var(--fs-small);
                color: var(--ink-2);
                max-width: 60ch;
                text-wrap: pretty;
            }
            .est {
                font-family: var(--font-body);
                font-weight: 400;
                font-size: 0.6em;
                letter-spacing: 0;
                color: var(--ink-2);
                white-space: nowrap;
            }
            .ico-up {
                width: 0.7em;
                height: 0.7em;
                fill: currentColor;
                vertical-align: 0.02em;
                margin-right: 0.25em;
            }

            /* ---------- buttons ---------- */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--s2);
                min-height: 44px;
                padding: 0 var(--s5);
                border: 1px solid var(--control);
                border-radius: var(--r-pill);
                background: transparent;
                color: var(--ink);
                font-weight: 600;
                font-size: var(--fs-body);
                letter-spacing: -0.01em;
                white-space: nowrap;
                transition:
                    background 0.2s ease,
                    color 0.2s ease,
                    border-color 0.2s ease,
                    transform 0.2s var(--ease-out);
            }
            .btn:hover {
                border-color: var(--ink);
            }
            .btn:active {
                transform: translateY(1px);
            }
            .btn.primary {
                background: var(--ink);
                border-color: var(--ink);
                color: var(--bg);
            }
            .btn.primary:hover {
                background: var(--accent-text);
                border-color: var(--accent-text);
                color: var(--bg);
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: default;
                transform: none;
            }
            /* A 32–36px visual pill inside a 44px hit area. */
            .btn-sm,
            .btn-edit {
                position: relative;
                min-height: 34px;
                padding: 0 var(--s4);
                font-size: 0.875rem;
            }
            .btn-sm::before,
            .btn-edit::before {
                content: "";
                position: absolute;
                inset: -5px -2px;
            }
            .btn-edit {
                display: inline-flex;
                align-items: center;
                min-height: 32px;
                padding: 0 var(--s3);
                border: 1px solid var(--control);
                border-radius: var(--r-pill);
                background: transparent;
                color: var(--ink);
                font-weight: 600;
                font-size: 0.85rem;
                transition:
                    border-color 0.2s ease,
                    background 0.2s ease,
                    transform 0.2s var(--ease-out);
            }
            .btn-edit::before {
                inset: -6px -4px;
            }
            .btn-edit:hover {
                border-color: var(--ink);
            }
            .btn-edit:active {
                transform: translateY(1px);
            }
            .btn-edit[aria-expanded="true"] {
                background: var(--ink);
                border-color: var(--ink);
                color: var(--bg);
            }
            @media (pointer: coarse) {
                .btn-edit,
                .btn-sm {
                    min-height: 44px;
                }
            }
            .icon-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--s2);
                min-width: 44px;
                min-height: 44px;
                padding: 0;
                border: 0;
                border-radius: var(--r-pill);
                background: transparent;
                color: var(--ink-2);
                transition:
                    color 0.2s ease,
                    background 0.2s ease;
            }
            .icon-btn:hover {
                color: var(--ink);
                background: var(--surface-2);
            }
            .icon-btn:active {
                transform: translateY(1px);
            }
            .icon-btn svg {
                width: 20px;
                height: 20px;
                stroke-width: 1.75;
            }
            .icon-btn .txt {
                display: none;
            }
            /* Sign out: an icon on a phone, a secondary pill above. */
            @media (min-width: 481px) {
                #signout {
                    position: relative;
                    min-height: 36px;
                    margin: 4px 0 4px var(--s2);
                    padding: 0 var(--s4);
                    border: 1px solid var(--control);
                    color: var(--ink);
                    font-weight: 600;
                    font-size: 0.875rem;
                }
                #signout::before {
                    content: "";
                    position: absolute;
                    inset: -4px -2px;
                }
                #signout:hover {
                    background: transparent;
                    border-color: var(--ink);
                }
                #signout svg {
                    display: none;
                }
                #signout .txt {
                    display: inline;
                }
            }
            .link-btn {
                display: inline-flex;
                align-items: center;
                min-height: 32px;
                padding: 0;
                border: 0;
                background: none;
                color: var(--accent-text);
                font-weight: 600;
                font-size: var(--fs-small);
                text-decoration: none;
                text-underline-offset: 3px;
                white-space: nowrap;
            }
            .link-btn:hover,
            .link-btn:focus-visible {
                text-decoration: underline;
                text-decoration-thickness: 1px;
            }
            .link-btn .chev {
                display: inline-block;
                margin-left: 0.3em;
                transition: transform 0.2s var(--ease-out);
            }
            .link-btn:hover .chev {
                transform: translateX(3px);
            }

            /* ---------- chips, swatches ---------- */
            .chip {
                display: inline-flex;
                align-items: center;
                padding: 1px 7px;
                border: 1px solid var(--line);
                border-radius: var(--r-pill);
                font-family: var(--font-mono);
                font-weight: 500;
                font-size: 0.6875rem;
                line-height: 1.5;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--ink-2);
                white-space: nowrap;
            }
            .chip.over {
                color: var(--over);
                border-color: var(--over);
                background: var(--over-tint);
            }
            .sw {
                display: inline-block;
                flex: none;
                width: 10px;
                height: 10px;
                margin-right: 6px;
                vertical-align: 0;
                background: var(--ink-3);
            }
            .sw.dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 6px;
                vertical-align: 0.12em;
            }
            .s-kcal {
                background: var(--kcal);
            }
            .s-protein {
                background: var(--protein);
            }
            .s-carbs {
                background: var(--carbs);
            }
            .s-fat {
                background: var(--fat);
            }
            .s-fiber {
                background: var(--fiber);
            }
            .s-sugar {
                background: var(--sugar);
            }
            .s-gain {
                background: var(--gain);
            }
            .s-loss {
                background: var(--loss);
            }
            .s-accent {
                background: var(--accent);
            }
            .s-muted {
                background: var(--ink-3);
            }
            .s-over {
                background: repeating-linear-gradient(
                    45deg,
                    var(--over) 0 1.5px,
                    var(--over-tint) 1.5px 3px
                );
            }
            .s-burn {
                background: transparent;
                border: 2px solid var(--burn);
                border-radius: 50%;
            }
            .s-rest {
                background: transparent;
                height: 0;
                border-top: 2px dashed var(--burn);
                vertical-align: 0.25em;
            }
            .s-active {
                width: 3px;
                background: var(--burn);
                margin-left: 3px;
                margin-right: 9px;
            }

            /* ================= login ================= */
            .login-wrap {
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: var(--s6);
                padding: max(var(--s8), env(safe-area-inset-top))
                    max(var(--gutter), env(safe-area-inset-right))
                    max(var(--s8), env(safe-area-inset-bottom))
                    max(var(--gutter), env(safe-area-inset-left));
            }
            .login {
                width: 100%;
                max-width: 400px;
            }
            .login-help {
                margin: var(--s4) 0 var(--s2);
                font-size: var(--fs-small);
                color: var(--ink-2);
                text-wrap: pretty;
            }
            .field {
                display: grid;
                gap: 6px;
                margin-top: var(--s4);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-2);
                min-width: 0;
            }
            .field label {
                display: block;
            }
            .input {
                width: 100%;
                min-width: 0;
                height: 48px;
                padding: 0 var(--s3);
                border: 1px solid var(--control);
                border-radius: var(--r-input);
                background: var(--surface);
                color: var(--ink);
                font-family: var(--font-body);
                font-size: 16px;
                letter-spacing: 0;
                text-transform: none;
                font-weight: 400;
                transition: border-color 0.2s ease;
            }
            .input:hover {
                border-color: var(--ink-2);
            }
            .input:focus-visible {
                border-color: var(--control);
                border-radius: var(--r-input);
            }
            select.input {
                padding-right: var(--s2);
            }
            textarea.input {
                height: auto;
                min-height: 72px;
                padding: var(--s3);
                line-height: 1.45;
                resize: vertical;
            }
            .login .btn.primary {
                width: 100%;
                margin-top: var(--s6);
            }
            .err {
                min-height: 1.5em;
                margin: var(--s3) 0 var(--s1);
                color: var(--over);
                font-weight: 600;
                font-size: var(--fs-small);
            }

            /* ================= app chrome ================= */
            .app {
                max-width: 1120px;
                margin: 0 auto;
                padding: 0 max(var(--gutter), env(safe-area-inset-right))
                    max(var(--s12), env(safe-area-inset-bottom))
                    max(var(--gutter), env(safe-area-inset-left));
            }
            /* Phone/tablet: the header scrolls away and only the tab bar
               sticks; display:contents lets the nav stick to the page. At
               ≥1024 the wrapper becomes the one sticky row. */
            .chrome {
                display: contents;
            }
            .top {
                display: flex;
                align-items: center;
                gap: var(--s2);
                padding: max(var(--s4), env(safe-area-inset-top)) 0 var(--s3);
            }
            .brand {
                flex: 1;
                min-width: 0;
            }
            .brand h1,
            .login-brand {
                display: flex;
                align-items: center;
                gap: 10px;
                font-family: var(--font-display);
                font-weight: 800;
                font-size: 1.25rem;
                letter-spacing: -0.03em;
                line-height: 1.2;
                color: var(--ink);
            }
            .mark {
                flex: none;
                width: 22px;
                height: 22px;
                color: var(--ink);
            }
            .brand .sub {
                margin-top: 3px;
                padding-left: 32px;
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--ink-2);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .brand .sub.is-error {
                color: var(--over);
                white-space: normal;
            }
            .actions {
                display: flex;
                align-items: center;
                flex: none;
            }
            .tabs-wrap {
                position: sticky;
                top: 0;
                z-index: 20;
                margin: 0 calc(-1 * var(--gutter));
                padding: 0 var(--gutter);
                background: var(--bg);
                border-bottom: 1px solid var(--line);
            }
            @supports (backdrop-filter: blur(14px)) or
                (-webkit-backdrop-filter: blur(14px)) {
                .tabs-wrap {
                    background: color-mix(in srgb, var(--bg) 84%, transparent);
                    -webkit-backdrop-filter: saturate(160%) blur(14px);
                    backdrop-filter: saturate(160%) blur(14px);
                }
            }
            /* Reading-progress hairline on the sticky bar's bottom edge. */
            .tabs-wrap::after,
            .chrome::after {
                content: "";
                position: absolute;
                left: 0;
                bottom: -1px;
                width: 100%;
                height: 2px;
                background: var(--accent);
                transform: scaleX(var(--progress, 0));
                transform-origin: left;
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none;
            }
            body.scrolled .tabs-wrap::after {
                opacity: 1;
            }
            [role="tablist"] {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
            }
            [role="tab"] {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                min-height: 56px;
                padding: 6px 2px 9px;
                border: 0;
                border-radius: 8px;
                background: transparent;
                color: var(--ink-2);
                font-family: var(--font-body);
                font-size: 12px;
                font-weight: 500;
                line-height: 1.2;
                transition: color 0.2s ease;
            }
            [role="tab"] svg {
                width: 22px;
                height: 22px;
                stroke-width: 1.75;
            }
            [role="tab"]:hover {
                color: var(--ink);
            }
            [role="tab"]:focus-visible {
                outline-offset: -2px;
            }
            [role="tab"][aria-selected="true"] {
                color: var(--ink);
                font-weight: 600;
            }
            [role="tab"][aria-selected="true"] svg {
                stroke-width: 2.1;
            }
            /* The non-colour cue: weight plus a 2px bar under the label. */
            [role="tab"]::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 3px;
                width: 24px;
                height: 2px;
                margin-left: -12px;
                background: var(--accent-text);
                transform: scaleX(0);
                transition: transform 0.25s var(--ease-out);
            }
            [role="tab"][aria-selected="true"]::after {
                transform: scaleX(1);
            }
            @media (min-width: 481px) {
                .tabs-wrap {
                    border-bottom-color: transparent;
                }
                body.scrolled .tabs-wrap {
                    border-bottom-color: var(--line);
                }
                [role="tablist"] {
                    display: flex;
                    gap: var(--s6);
                    border-bottom: 1px solid var(--line);
                }
                body.scrolled [role="tablist"] {
                    border-bottom-color: transparent;
                }
                [role="tab"] {
                    flex-direction: row;
                    gap: var(--s2);
                    min-height: 48px;
                    padding: 0 2px;
                    font-size: 0.95rem;
                }
                [role="tab"] svg {
                    width: 18px;
                    height: 18px;
                }
                [role="tab"]::after {
                    left: 0;
                    right: 0;
                    bottom: -1px;
                    width: auto;
                    margin: 0;
                    transform-origin: left;
                }
            }
            @media (min-width: 1024px) {
                .chrome {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                    align-items: center;
                    gap: var(--s6);
                    position: sticky;
                    top: 0;
                    z-index: 20;
                    height: var(--head-h);
                    margin: 0 calc(-1 * var(--gutter));
                    padding: 0 var(--gutter);
                    background: var(--bg);
                    border-bottom: 1px solid transparent;
                    transition:
                        height 0.3s var(--ease-out),
                        border-color 0.3s ease,
                        background 0.3s ease;
                }
                @supports (backdrop-filter: blur(14px)) or
                    (-webkit-backdrop-filter: blur(14px)) {
                    .chrome {
                        background: color-mix(
                            in srgb,
                            var(--bg) 72%,
                            transparent
                        );
                        -webkit-backdrop-filter: saturate(160%) blur(14px);
                        backdrop-filter: saturate(160%) blur(14px);
                    }
                    body.scrolled .chrome {
                        background: color-mix(
                            in srgb,
                            var(--bg) 84%,
                            transparent
                        );
                    }
                }
                body.scrolled .chrome {
                    --head-h: 56px;
                    border-bottom-color: var(--line);
                }
                body.scrolled .chrome::after {
                    opacity: 1;
                }
                .top {
                    display: contents;
                }
                .brand {
                    grid-column: 1;
                    grid-row: 1;
                }
                .brand .sub {
                    margin-top: 1px;
                }
                .actions {
                    grid-column: 3;
                    grid-row: 1;
                    justify-self: end;
                }
                .tabs-wrap,
                body.scrolled .tabs-wrap {
                    position: static;
                    grid-column: 2;
                    grid-row: 1;
                    margin: 0;
                    padding: 0;
                    background: none;
                    border: 0;
                    -webkit-backdrop-filter: none;
                    backdrop-filter: none;
                }
                .tabs-wrap::after {
                    display: none;
                }
                [role="tablist"],
                body.scrolled [role="tablist"] {
                    gap: var(--s8);
                    border-bottom: 0;
                }
                [role="tab"] svg {
                    display: none;
                }
                [role="tab"] {
                    min-height: 44px;
                }
                [role="tab"]::after {
                    bottom: 4px;
                }
            }

            /* ================= panels ================= */
            main {
                padding-top: var(--s6);
            }
            @media (min-width: 1024px) {
                main {
                    padding-top: var(--s10);
                }
            }
            [role="tabpanel"] {
                outline-offset: 6px;
            }
            .panel-body {
                transition: opacity 0.12s linear;
            }
            .refreshing .panel-body {
                opacity: 0.55;
            }
            .stack {
                display: grid;
                gap: var(--gap-section);
                min-width: 0;
            }
            .stack > * {
                min-width: 0;
            }
            /* First render / tab switch: blocks rise into place. Opacity
               completes in 180ms (axe and screenshots read the panel ~250ms
               after a switch); the rise is what is staggered. */
            .reveal .rv {
                animation:
                    rv-fade 180ms linear both,
                    rv-rise 320ms var(--ease-out) both;
                animation-delay: 0ms, calc(var(--rv, 0) * 50ms);
            }
            @keyframes rv-fade {
                from {
                    opacity: 0;
                }
            }
            @keyframes rv-rise {
                from {
                    transform: translateY(10px);
                }
            }
            .reveal .facts-serving::after,
            .reveal .facts-cal::after,
            .reveal .facts-nut::before {
                animation: rule-draw 500ms 80ms var(--ease-out) both;
            }
            @keyframes rule-draw {
                from {
                    transform: scaleX(0);
                }
            }
            .reveal svg.chart .grow {
                transform-box: fill-box;
                transform-origin: 50% 100%;
                animation: bar-grow 400ms var(--ease-out) both;
                animation-delay: var(--d, 0ms);
            }
            .reveal svg.chart .grow.down {
                transform-origin: 50% 0;
            }
            @keyframes bar-grow {
                from {
                    transform: scaleY(0);
                }
            }

            /* ---------- range head (Trends, Meals) ---------- */
            .panel-head {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-end;
                justify-content: space-between;
                gap: var(--s4) var(--s6);
                margin-bottom: var(--gap-block);
            }
            .range-label {
                font-family: var(--font-display);
                font-weight: 700;
                font-variation-settings: "opsz" 96;
                font-size: var(--fs-h2);
                letter-spacing: -0.025em;
                line-height: 1.1;
                text-wrap: balance;
            }
            .range-label small {
                display: block;
                margin-top: 6px;
                font-family: var(--font-mono);
                font-variation-settings: normal;
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--accent-text);
                line-height: 1.3;
            }
            .seg {
                display: inline-flex;
                gap: 2px;
                padding: 2px;
                background: var(--surface-2);
                border: 1px solid var(--line);
                border-radius: var(--r-pill);
            }
            .seg button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-width: 76px;
                min-height: 40px;
                padding: 0 var(--s3);
                border: 0;
                border-radius: var(--r-pill);
                background: transparent;
                color: var(--ink-2);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                transition:
                    background 0.2s ease,
                    color 0.2s ease;
            }
            .seg button:hover {
                color: var(--ink);
            }
            .seg button[aria-pressed="true"] {
                background: var(--accent);
                color: var(--accent-ink);
            }
            .seg[aria-disabled="true"] button {
                cursor: progress;
            }
            .spin {
                width: 12px;
                height: 12px;
                border: 2px solid currentColor;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (max-width: 699px) {
                .panel-head .seg {
                    display: flex;
                    width: 100%;
                }
                .panel-head .seg button {
                    flex: 1;
                    min-width: 0;
                }
            }

            /* ---------- section head: the 3px rule ---------- */
            .sec-head {
                display: grid;
                gap: var(--s2) var(--s6);
                padding-top: var(--s4);
                border-top: 3px solid var(--rule);
                margin-bottom: var(--gap-block);
            }
            .sec-title {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: var(--s1) var(--s4);
            }
            .sec-title h3 {
                font-family: var(--font-display);
                font-weight: 700;
                font-variation-settings: "opsz" 96;
                font-size: var(--fs-h2);
                letter-spacing: -0.025em;
                line-height: 1.1;
                text-wrap: balance;
            }
            .sec-title .aside {
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                color: var(--ink-2);
                white-space: nowrap;
            }
            .chart-prefs {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .chart-prefs .seg button {
                min-width: 0;
                min-height: 30px;
                padding: 0 9px;
                font-size: 10px;
            }
            .chart-note {
                margin: -12px 0 16px;
                color: var(--ink-2);
                font-size: var(--fs-small);
            }
            .met-line {
                fill: none;
                stroke-width: 2.5;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            .met-est {
                stroke: var(--burn);
            }
            .met-scale {
                stroke: var(--accent);
            }
            .cal2-deficit {
                fill: var(--accent);
                opacity: 0.18;
                stroke: none;
            }
            .cal2-goal {
                fill: none;
                stroke: var(--ink-2);
                stroke-dasharray: 4 4;
                stroke-width: 1.5;
            }
            .cal2-break {
                fill: none;
                stroke: var(--ink-2);
                stroke-width: 1.5;
            }
            .cal2-eaten-line {
                fill: none;
                stroke: var(--cal2-c-eaten);
                stroke-width: 2.5;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            .cal2-eaten-dot {
                fill: var(--cal2-c-eaten);
                stroke: var(--bg);
                stroke-width: 1.5;
            }
            .cal2-eaten-dot.over {
                fill: url(#hatch-over);
            }
            .cal2-area-base {
                fill: var(--cal2-c-base);
                stroke: none;
            }
            .cal2-area-digestion {
                fill: var(--cal2-c-digestion);
                stroke: none;
            }
            .cal2-area-workout {
                fill: var(--cal2-c-workout);
                stroke: none;
            }
            .cal2-burn-top {
                fill: none;
                stroke: var(--burn);
                stroke-width: 1.5;
            }
            .cal2-surplus {
                fill: var(--cal2-c-surplus);
            }
            .cal2-why {
                margin: -8px 0 16px;
                color: var(--ink-2);
                font-size: var(--fs-small);
            }
            .cal2-legend-base {
                fill: var(--cal2-c-base);
            }
            .cal2-legend-digestion {
                fill: var(--cal2-c-digestion);
            }
            .cal2-legend-workout {
                fill: var(--cal2-c-workout);
            }
            .sw.cal2-eaten-line,
            .sw.cal2-eaten-dot {
                background: var(--cal2-c-eaten);
                border-radius: 50%;
            }
            .sw.cal2-area-base {
                background: var(--cal2-c-base);
            }
            .sw.cal2-area-digestion {
                background: var(--cal2-c-digestion);
            }
            .sw.cal2-area-workout {
                background: var(--cal2-c-workout);
            }
            .sw.cal2-surplus {
                background: var(--cal2-c-surplus);
            }
            .sw.cal2-burn-top {
                background: var(--burn);
                height: 2px;
                vertical-align: 0.3em;
            }
            .sw.cal2-goal {
                background: none;
                border-top: 2px dashed var(--ink-2);
                height: 0;
                vertical-align: 0.3em;
            }
            .cal2-legend-surplus {
                fill: var(--cal2-c-surplus);
            }
            .met-band {
                fill: var(--accent);
                opacity: 0.12;
                stroke: none;
            }
            .muted {
                color: var(--ink-2);
                font-weight: 400;
                margin-left: 6px;
            }
            .linkish {
                border: 0;
                background: none;
                padding: 0;
                font: inherit;
                color: var(--accent);
                text-decoration: underline;
                cursor: pointer;
            }
            .met-gap {
                fill: var(--over);
                opacity: 0.15;
            }
            .met-label {
                fill: var(--ink);
                font: 600 11px var(--font-mono);
            }
            .met-highlight {
                padding: var(--s3);
                border-left: 3px solid var(--accent);
                background: var(--surface-2);
                font-weight: 600;
            }
            .chart-value {
                fill: #fff;
                font: 600 10px var(--font-mono);
            }
            .chart-value.dim {
                fill: var(--ink);
            }
            .sec-head .legend {
                margin-top: var(--s1);
            }
            @media (min-width: 1024px) {
                .sec-head.wide {
                    grid-template-columns: 180px minmax(0, 1fr);
                }
                .sec-head.wide > .eyebrow {
                    grid-row: 1 / span 4;
                    padding-top: 0.55rem;
                }
                .sec-head.wide > :not(.eyebrow) {
                    grid-column: 2;
                }
            }

            /* ---------- Facts panel ---------- */
            .facts {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--r-panel);
                box-shadow: var(--shadow-card);
                padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 3vw, 1.5rem)
                    var(--s2);
                min-width: 0;
            }
            .facts-title {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: var(--s4);
                padding-bottom: 0.35rem;
                border-bottom: 1px solid var(--rule);
            }
            .facts-title h3,
            p.facts-title {
                font-family: var(--font-display);
                font-weight: 800;
                font-variation-settings: "opsz" 96;
                font-size: var(--fs-display);
                letter-spacing: -0.035em;
                line-height: 1;
                text-wrap: balance;
            }
            .facts-title .tag,
            .facts-serving .tag {
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-2);
                white-space: nowrap;
            }
            .facts-title .tag {
                margin-bottom: 0.3rem;
            }
            .facts-title .btn {
                margin-bottom: 0.15rem;
            }
            .facts-serving {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 2px var(--s4);
                padding: 0.45rem 0 calc(0.45rem + 10px);
                font-size: 0.9rem;
                color: var(--ink-2);
            }
            .facts-serving b {
                color: var(--ink);
                font-weight: 600;
            }
            /* The 10px ink bar: a pseudo-element, so it can draw in. */
            .facts-serving::after,
            .facts-cal::after,
            .facts-nut::before {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                background: var(--rule);
                transform-origin: left;
            }
            .facts-serving::after {
                bottom: 0;
                height: 10px;
            }
            .facts-live {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
            }
            .facts-live::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--accent);
                animation: livepulse 2.4s ease-in-out infinite;
            }
            @keyframes livepulse {
                0%,
                100% {
                    box-shadow: 0 0 0 0
                        color-mix(in srgb, var(--accent) 45%, transparent);
                }
                50% {
                    box-shadow: 0 0 0 5px
                        color-mix(in srgb, var(--accent) 0%, transparent);
                }
            }
            /* Headline row: label left, the big figure right, a 5px rule. */
            .facts-cal {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                align-items: flex-end;
                justify-content: flex-end;
                gap: var(--s2) var(--s4);
                padding: 0.7rem 0 calc(0.5rem + 5px);
            }
            .facts-cal::after {
                bottom: 0;
                height: 5px;
            }
            .facts-cal .label {
                margin-right: auto;
                padding-bottom: 0.35rem;
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-label);
                letter-spacing: -0.01em;
                line-height: 1.2;
            }
            .facts-cal .label small {
                display: block;
                font-family: var(--font-body);
                font-weight: 400;
                font-size: 0.82rem;
                letter-spacing: 0;
                color: var(--ink-2);
            }
            .fig-hero {
                font-family: var(--font-display);
                font-weight: 800;
                font-size: var(--fs-hero);
                letter-spacing: -0.045em;
                line-height: 0.92;
                color: var(--ink);
                white-space: nowrap;
            }
            .fig-hero b {
                font-weight: 800;
            }
            .fig-hero small,
            .figure small,
            .unit {
                margin-left: 0.15em;
                font-family: var(--font-body);
                font-weight: 500;
                font-size: 0.42em;
                letter-spacing: 0;
                color: var(--ink-2);
            }
            .facts-cal .fig-hero.missing {
                color: var(--ink-3);
            }
            /* Label rows: a <dl>, bold label left / figure right. */
            .facts-rows {
                margin: 0;
            }
            .facts-row {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 2px var(--s4);
                padding: 0.55rem 0;
                border-bottom: 1px solid var(--line);
            }
            .facts-row:last-child {
                border-bottom: 0;
            }
            .facts-row dt {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-label);
                letter-spacing: -0.01em;
                line-height: 1.2;
            }
            .facts-row dd {
                margin: 0 0 0 auto;
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-row);
                letter-spacing: -0.02em;
                line-height: 1.2;
                text-align: right;
            }
            .facts-row dd small {
                margin-left: 0.2em;
                font-family: var(--font-body);
                font-weight: 500;
                font-size: var(--fs-small);
                letter-spacing: 0;
                color: var(--ink-2);
            }
            .facts-row dd .cat {
                margin-left: var(--s2);
                font-family: var(--font-body);
                font-weight: 500;
                font-size: var(--fs-small);
                letter-spacing: 0;
                color: var(--ink-2);
            }
            .facts-row dd.missing {
                color: var(--ink-3);
            }
            .facts-row dd .chip,
            .facts-row dd .sw.hatch {
                margin-left: var(--s2);
                vertical-align: 0.15em;
            }
            .facts-row.over dt {
                color: var(--over);
            }
            /* A row's explanation, indented under it (same <dl> group). */
            .facts-row.sub {
                padding: 0 0 0.55rem 1.25rem;
                margin-top: -0.3rem;
            }
            .facts-row.sub dt {
                font-family: var(--font-body);
                font-weight: 400;
                font-size: var(--fs-small);
                letter-spacing: 0;
                color: var(--ink-2);
                line-height: 1.45;
            }
            .facts-row.sub dd {
                font-family: var(--font-body);
                font-weight: 600;
                font-size: var(--fs-small);
                letter-spacing: 0;
            }
            /* A row that is followed by its .sub loses its hairline: the
               sub belongs to it. */
            .facts-row.has-sub {
                border-bottom: 0;
            }
            /* Nutrients: the FDA "% Daily Value" block, after a 10px bar. */
            .facts-nut {
                position: relative;
                margin: 0.15rem 0 0;
                padding: calc(10px + 0.5rem) 0 0;
                list-style: none;
            }
            .facts-nut::before {
                top: 0;
                height: 10px;
            }
            .facts-nut .nut-head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding-bottom: 0.4rem;
                border-bottom: 1px solid var(--line);
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-label);
            }
            .facts-nut .nut-head span:last-child {
                font-family: var(--font-mono);
                font-weight: 500;
                font-size: var(--fs-eyebrow);
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-2);
            }
            .facts-nut li.nut {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: baseline;
                column-gap: var(--s3);
                padding: 0.55rem 0 0.6rem;
                border-bottom: 1px solid var(--line);
            }
            .facts-nut li.nut:last-child {
                border-bottom: 0;
            }
            .nut .name {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-label);
                letter-spacing: -0.01em;
            }
            .nut .amt {
                margin-left: var(--s2);
                font-weight: 500;
                font-size: var(--fs-small);
                color: var(--ink-2);
                white-space: nowrap;
            }
            .nut .amt b {
                color: var(--ink);
                font-weight: 600;
            }
            .nut .pct {
                display: inline-flex;
                align-items: baseline;
                gap: var(--s2);
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-row);
                letter-spacing: -0.02em;
                white-space: nowrap;
            }
            .nut .pct .chip {
                align-self: center;
            }
            .track {
                grid-column: 1 / -1;
                display: block;
                height: 4px;
                margin-top: 6px;
                background: var(--surface-2);
                overflow: hidden;
            }
            .track i {
                display: block;
                height: 100%;
                width: 0;
                transition: width 500ms var(--ease-out);
            }
            .track i.s-protein {
                background: var(--protein);
            }
            .track i.s-carbs {
                background: var(--carbs);
            }
            .track i.s-fat {
                background: var(--fat);
            }
            .track i.s-fiber {
                background: var(--fiber);
            }
            .facts-nut li:nth-child(3) .track i {
                transition-delay: 40ms;
            }
            .facts-nut li:nth-child(4) .track i {
                transition-delay: 80ms;
            }
            .facts-nut li:nth-child(5) .track i {
                transition-delay: 120ms;
            }
            .facts-foot {
                position: relative;
                margin-top: var(--s1);
                padding: calc(5px + 0.55rem) 0 0.5rem;
                font-size: var(--fs-foot);
                line-height: 1.45;
                color: var(--ink-3);
                text-wrap: pretty;
            }
            .facts-foot::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 5px;
                background: var(--rule);
            }
            .facts-foot .link-btn {
                min-height: 0;
                font-size: inherit;
            }

            /* ---------- the calorie ring (Today) ---------- */
            .ring {
                position: relative;
                flex: none;
                width: 112px;
                height: 112px;
                align-self: center;
            }
            .ring svg {
                display: block;
                width: 100%;
                height: 100%;
            }
            .ring circle {
                fill: none;
                stroke-width: 9px;
            }
            .ring-track {
                stroke: var(--surface-2);
            }
            .ring-arc {
                stroke: var(--kcal);
                stroke-linecap: round;
                transition: stroke-dashoffset 700ms var(--ease-out);
            }
            .ring-over {
                stroke: url(#hatch-over);
                stroke-linecap: round;
                transition: stroke-dashoffset 700ms var(--ease-out) 300ms;
            }
            .ring-c {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                font-family: var(--font-mono);
                font-weight: 500;
                font-size: 0.8rem;
                color: var(--ink);
            }

            /* ---------- ruled strip (exactly the reference .features-grid) */
            .strip {
                display: grid;
                gap: 1px;
                background: var(--line);
                border: 1px solid var(--line);
                border-radius: var(--r-panel);
                overflow: hidden;
            }
            .strip > div {
                min-width: 0;
                padding: var(--s4) var(--s5);
                background: var(--surface);
            }
            .strip .micro {
                color: var(--ink-2);
            }
            .strip .figure {
                margin-top: var(--s2);
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-figure);
                letter-spacing: -0.03em;
                line-height: 1.05;
                white-space: nowrap;
            }
            .strip .figure small {
                font-size: 0.5em;
            }
            .strip .figure.missing {
                color: var(--ink-3);
            }
            .strip .figure .sw.dot {
                vertical-align: 0.3em;
            }
            .strip .foot {
                margin-top: 6px;
                font-size: var(--fs-small);
                line-height: 1.45;
                color: var(--ink-2);
                text-wrap: pretty;
            }
            .strip .foot .link-btn {
                min-height: 28px;
                white-space: normal;
                text-align: left;
            }
            .strip + .empty,
            .strip + .plot {
                margin-top: var(--gap-block);
            }
            .strip.three {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .strip.two {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .strip.four {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            @media (min-width: 700px) {
                .strip.four {
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                }
            }
            @media (max-width: 480px) {
                .strip > div {
                    padding: var(--s3) 10px;
                }
                .strip .figure {
                    font-size: 1.35rem;
                }
                .strip .figure small {
                    font-size: 0.75rem;
                }
                .strip .foot {
                    font-size: 0.8125rem;
                }
            }
            @media (max-width: 380px) {
                .strip.three {
                    grid-template-columns: minmax(0, 1fr);
                }
                .strip.three > div {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) auto;
                    align-items: baseline;
                    column-gap: var(--s3);
                }
                .strip.three .figure {
                    margin-top: 0;
                    text-align: right;
                }
                .strip.three .foot {
                    grid-column: 1 / -1;
                }
            }

            /* ---------- legend ---------- */
            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: var(--s1) var(--s4);
                margin: 0;
                padding: 0;
                list-style: none;
                font-size: var(--fs-foot);
                font-weight: 500;
                color: var(--ink-2);
            }
            .legend li {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
            }
            .legend svg {
                width: 14px;
                height: 14px;
                flex: none;
                overflow: visible;
            }

            /* ---------- charts (printed on the paper, not boxed) ---------- */
            .plot {
                position: relative;
                min-width: 0;
                margin-top: var(--gap-block);
            }
            .plot svg.chart {
                display: block;
                overflow: visible;
                touch-action: pan-y;
                border-radius: 4px;
            }
            /* A tap focuses the chart (it pins the tooltip); Chrome then
               paints its blue UA ring although this is not :focus-visible.
               Keyboard focus keeps the brand ring. */
            svg.chart:focus:not(:focus-visible) {
                outline: none;
            }
            .chart text {
                font-family: var(--font-mono);
                font-size: 12px;
            }
            .ax {
                fill: var(--ink-3);
            }
            .xl {
                fill: var(--ink-3);
                text-transform: uppercase;
                letter-spacing: 0.02em;
            }
            .xl.now {
                fill: var(--ink);
                font-weight: 500;
            }
            .gridline {
                stroke: var(--line-2);
                stroke-width: 1;
                shape-rendering: crispEdges;
            }
            .baseline,
            .zero {
                stroke: var(--rule);
                stroke-width: 1;
                shape-rendering: crispEdges;
            }
            .goal-line {
                fill: none;
                stroke: var(--rule);
                stroke-width: 2;
                stroke-linejoin: miter;
            }
            .goal-lbl {
                fill: var(--ink);
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                paint-order: stroke;
                stroke: var(--bg);
                stroke-width: 4px;
                stroke-linejoin: round;
            }
            .lbl {
                font-family: var(--font-body) !important;
                font-weight: 600;
                fill: var(--ink);
            }
            .lbl.sub {
                font-weight: 500;
                fill: var(--ink-2);
            }
            .m-kcal {
                fill: var(--kcal);
            }
            .m-over {
                fill: url(#hatch-over);
            }
            .hatch-bg {
                fill: var(--over-tint);
            }
            .hatch-fg {
                fill: var(--over);
            }
            .m-protein {
                fill: var(--protein);
            }
            .m-carbs {
                fill: var(--carbs);
            }
            .m-fat {
                fill: var(--fat);
            }
            .m-fiber {
                fill: var(--fiber);
            }
            .m-gain {
                fill: var(--gain);
            }
            .m-loss {
                fill: var(--loss);
            }
            .m-burn {
                fill: var(--bg);
                stroke: var(--burn);
                stroke-width: 2;
            }
            .m-rest {
                fill: none;
                stroke: var(--burn);
                stroke-width: 1.5;
                stroke-dasharray: 4 3;
            }
            .m-active {
                stroke: var(--burn);
                stroke-width: 3;
            }
            .m-halo {
                stroke: var(--bg);
            }
            .m-band {
                fill: var(--accent-soft);
            }
            .m-wline {
                fill: none;
                stroke: var(--accent);
                stroke-width: 2;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            .m-wdot {
                fill: var(--accent);
                stroke: var(--bg);
                stroke-width: 1.5;
            }
            .m-target {
                fill: none;
                stroke: var(--ink-2);
                stroke-width: 1.5;
                stroke-dasharray: 5 4;
            }
            .m-tick {
                stroke: var(--rule);
                stroke-width: 2;
            }
            .dim {
                opacity: 0.55;
            }
            .guide {
                stroke: var(--ink);
                stroke-width: 1;
                stroke-dasharray: 2 3;
                pointer-events: none;
            }

            /* ---------- tooltip ---------- */
            #tip {
                position: fixed;
                z-index: 50;
                max-width: 260px;
                padding: 10px 12px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-top: 3px solid var(--rule);
                border-radius: var(--r-tip);
                box-shadow: var(--shadow-float);
                font-size: var(--fs-foot);
                line-height: 1.4;
                pointer-events: none;
                opacity: 0;
                transition: opacity 100ms linear;
            }
            #tip.on {
                opacity: 1;
            }
            #tip .t-date {
                margin-bottom: 6px;
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink);
            }
            #tip .row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: var(--s4);
                padding: 2px 0;
            }
            #tip .row span {
                display: inline-flex;
                align-items: baseline;
                color: var(--ink-2);
            }
            #tip .row .sw {
                align-self: center;
            }
            #tip .row b {
                font-weight: 600;
                color: var(--ink);
                white-space: nowrap;
            }
            #tip .row.strong span {
                color: var(--ink);
                font-weight: 600;
            }
            /* The total-like rows (Over by, Est. burn total) sit under a
               1px ink rule. */
            #tip .row.strong + .row:not(.strong) {
                margin-top: 4px;
                padding-top: 6px;
                border-top: 1px solid var(--rule);
            }

            /* ---------- banners, notices, status ---------- */
            .banner {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--s2) var(--s3);
                margin-bottom: var(--gap-block);
                padding: var(--s3) var(--s3) var(--s3) var(--s4);
                background: var(--surface);
                border: 1px solid var(--over);
                border-radius: var(--r-input);
            }
            .banner p {
                flex: 1 1 14rem;
                font-weight: 600;
            }
            .notice {
                padding: var(--s1) 0 var(--s1) var(--s4);
                border-left: 3px solid var(--warn);
                font-size: var(--fs-small);
                color: var(--ink);
                max-width: 68ch;
            }
            .notice b {
                color: var(--warn);
                font-weight: 600;
            }
            .b-status {
                font-size: var(--fs-small);
                color: var(--ink-2);
                transition: opacity 0.4s ease;
            }
            .b-status:empty {
                display: none;
            }
            .b-status.ok {
                color: var(--accent-text);
                font-weight: 600;
            }
            .b-status.ok::before {
                content: "";
                display: inline-block;
                width: 7px;
                height: 7px;
                margin-right: 6px;
                border-radius: 50%;
                background: var(--accent);
                vertical-align: 0.1em;
            }
            .b-status.err {
                color: var(--over);
                font-weight: 600;
            }
            .b-status.fade {
                opacity: 0;
            }
            .lw-flash {
                display: flex;
                align-items: baseline;
                gap: var(--s2);
                margin: var(--s3) 0 0;
                font-size: var(--fs-small);
                color: var(--ink);
                animation: flash-out 6s linear both;
            }
            .lw-flash::before {
                content: "Saved";
                flex: none;
                padding: 1px 7px;
                border: 1px solid var(--accent-text);
                border-radius: var(--r-pill);
                font-family: var(--font-mono);
                font-size: 0.6875rem;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--accent-text);
            }
            .meal-flash {
                margin: 0 0 var(--gap-block);
            }

            /* ---------- log a meal: quick-add strip + form ---------- */
            .lm {
                margin: 0 0 var(--gap-block);
            }
            .lm.compact {
                margin-bottom: var(--s5);
            }
            .lm.compact .facts-title h3 {
                font-size: 1.25rem;
            }
            .lm .lw-flash {
                margin-top: var(--s3);
                animation-duration: 9s;
            }
            .lm .lw-flash .link-btn {
                min-height: 24px;
            }
            .lm .lw-flash.lm-err {
                color: var(--over);
                animation: none;
            }
            .lm .lw-flash.lm-err::before {
                content: "Not saved";
                border-color: var(--over);
                color: var(--over);
            }
            .quick {
                display: flex;
                flex-wrap: wrap;
                gap: var(--s2);
                margin-top: var(--s3);
            }
            .qa {
                display: inline-flex;
                align-items: baseline;
                gap: var(--s2);
                min-height: 44px;
                padding: 0 var(--s4);
                border: 1px solid var(--control);
                border-radius: var(--r-pill);
                background: var(--surface);
                color: var(--ink);
                font-weight: 600;
                font-size: 0.9375rem;
                letter-spacing: -0.01em;
                line-height: 44px;
                transition:
                    border-color 0.2s ease,
                    background 0.2s ease,
                    transform 0.2s var(--ease-out);
            }
            .qa small {
                font-family: var(--font-mono);
                font-size: 0.6875rem;
                font-weight: 500;
                letter-spacing: 0.04em;
                color: var(--ink-3);
            }
            .qa:hover {
                border-color: var(--ink);
                background: var(--accent-soft);
            }
            .qa:active {
                transform: translateY(1px);
            }
            .qa:disabled {
                opacity: 0.5;
                pointer-events: none;
            }
            .qa-hint {
                margin-top: var(--s3);
            }
            .qa-label {
                margin: var(--s4) 0 0;
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-2);
            }
            .qa-label + .quick {
                margin-top: var(--s2);
            }
            .lm-hint:empty {
                display: none;
            }
            .lm-hint {
                color: var(--accent-text);
            }
            .lm .lw-flash.lm-del::before {
                content: "Deleted";
                border-color: var(--ink-2);
                color: var(--ink-2);
            }
            .btn.danger {
                margin-left: auto;
                border-color: var(--over);
                color: var(--over);
            }
            .btn.danger:hover {
                border-color: var(--over);
                background: color-mix(in srgb, var(--over) 12%, transparent);
            }
            .btn.danger.armed {
                background: var(--over);
                color: var(--bg);
            }
            .lm-form {
                margin-top: var(--s4);
            }
            .lm-item {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: var(--s2);
            }
            .lm-item .input {
                flex: 1 1 160px;
                width: auto;
                min-width: 0;
            }
            .lm-item #lm-count,
            .lm-item #lm-custom {
                flex: 0 0 88px;
            }
            .lm-item #lm-unit {
                flex: 0 0 110px;
            }
            .lm-x {
                font-family: var(--font-mono);
                font-size: var(--fs-small);
                color: var(--ink-3);
            }
            @keyframes flash-out {
                0%,
                85% {
                    opacity: 1;
                }
                100% {
                    opacity: 0.35;
                }
            }

            /* ---------- forms ---------- */
            .form-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 1px;
                background: var(--line);
                border: 1px solid var(--line);
                border-radius: var(--r-input);
                overflow: hidden;
            }
            .form-grid > .field {
                margin: 0;
                padding: var(--s3);
                background: var(--surface);
            }
            .form-grid > .wide {
                grid-column: 1 / -1;
            }
            @media (min-width: 481px) {
                .form-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }
            .pair {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 84px;
                gap: var(--s2);
            }
            .form-foot {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: var(--s2) var(--s3);
                margin-top: var(--s4);
            }
            .form-hint {
                margin-top: var(--s2);
                font-size: var(--fs-foot);
                color: var(--ink-3);
            }
            .lw-form {
                margin: 0 0 var(--s2);
                padding: var(--s4) 0 var(--s4);
                border-bottom: 1px solid var(--line);
            }

            /* ---------- skeleton ---------- */
            .skel {
                display: grid;
                gap: var(--gap-section);
            }
            .sk {
                background: var(--bg-alt);
                border-radius: 4px;
                position: relative;
                overflow: hidden;
            }
            .sk::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    90deg,
                    transparent,
