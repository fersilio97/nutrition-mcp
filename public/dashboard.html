                    const rows = data.daily;
                    const s = trendsStats(rows);
                    const any = anyLogged(rows);
                    const hasGoal = rows.some((r) => r.goal_calories);
                    const g = gran();
                    const emptyMsg =
                        '<p class="empty">Nothing logged in these ' +
                        rows.length +
                        " days.</p>";
                    const calLegend = legend(
                        [
                            [
                                LG.bar("m-kcal"),
                                g === "day"
                                    ? "Eaten"
                                    : "Eaten (avg per logged day)",
                            ],
                        ]
                            .concat(
                                hasGoal
                                    ? [
                                          [LG.hatch(), "Over goal"],
                                          [LG.line(), "Goal = your target"],
                                      ]
                                    : [],
                            )
                            .concat(
                                hasBurn()
                                    ? [
                                          [
                                              LG.rest(),
                                              "Resting burn (changes with weight)",
                                          ],
                                      ]
                                          .concat(
                                              splitBurn(chartRows())
                                                  ? [
                                                        [
                                                            LG.active(),
                                                            "Workout / active",
                                                        ],
                                                    ]
                                                  : [],
                                          )
                                          .concat([
                                              [
                                                  LG.ring(),
                                                  "Est. burn = break-even",
                                              ],
                                          ])
                                    : [],
                            ),
                    );
                    const done = s.done;
                    const grouped =
                        g === "day"
                            ? ""
                            : " Each bar is one " +
                              perWord() +
                              ": the average per logged day, so unlogged days don’t pull it toward zero; the current " +
                              perWord() +
                              " is dimmed and counts today once it ends.";
                    const balNote = !hasBurn()
                        ? ""
                        : "Eaten − estimated burn, in kcal and in grams (÷ 7.7 kcal per gram). An estimate for spotting the trend — daily scale weight swings far more with water and salt. Today is left out until it ends." +
                          (g === "day"
                              ? ""
                              : " Each bar is the " +
                                perWord() +
                                "’s total over its complete logged days.") +
                          (done.length > 1
                              ? " Net over " +
                                done.length +
                                " complete logged days: " +
                                fmtSigned(
                                    done.reduce(
                                        (a, r) => a + (r.balance_kcal || 0),
                                        0,
                                    ),
                                ) +
                                " kcal · " +
                                fmtSigned(s.net) +
                                " g."
                              : "");
                    const calTitle =
                        g === "day"
                            ? "Calories per day"
                            : "Calories · " +
                              (g === "week" ? "weekly" : "monthly") +
                              " average per logged day";
                    const calNote =
                        (hasGoal && hasBurn()
                            ? "<b>Goal = your target; Est. burn = break-even (0 change). The gap is your planned deficit.</b> "
                            : "") +
                        (hasGoal
                            ? "The goal is your " +
                              fmt(data.goals.calories) +
                              " kcal baseline plus that day’s active calories from your watch; the part of a bar above it is hatched."
                            : "No calorie goal set.") +
                        (hasBurn()
                            ? " Est. burn is your resting burn (dashed) plus workout / active kcal (the slate segment up to the ring)."
                            : "") +
                        grouped;
                    $("trends-body").innerHTML =
                        '<div class="stack">' +
                        tilesHtml(rows, s) +
                        '<section class="rv" aria-labelledby="h-cal">' +
                        secHead({
                            wide: true,
                            eyebrow: "Energy",
                            id: "h-cal",
                            title: calTitle,
                            note: calNote,
                            legend: any ? calLegend : "",
                        }) +
                        (any
                            ? '<div class="plot" id="cal-plot"></div>'
                            : emptyMsg) +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-bal">' +
                        secHead({
                            wide: true,
                            eyebrow: "Balance",
                            id: "h-bal",
                            title: 'Estimated body change <span class="est">(estimate)</span>',
                            note: balNote,
                            legend:
                                hasBurn() && done.length
                                    ? legend([
                                          [
                                              LG.bar("m-gain"),
                                              "Est. gain (+, up)",
                                          ],
                                          [
                                              LG.bar("m-loss"),
                                              "Est. loss (−, down)",
                                          ],
                                      ])
                                    : "",
                        }) +
                        (!hasBurn()
                            ? '<p class="empty">Add your height, birth date and sex under Body › Body details to estimate this.<br>' +
                              ADD_BODY +
                              "</p>"
                            : done.length
                              ? '<div class="plot" id="bal-plot"></div>'
                              : '<p class="empty">No complete logged days in this range.</p>') +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-evs">' +
                        evsHtml() +
                        "</section>" +
                        '<section class="rv" aria-labelledby="h-mac">' +
                        secHead({
                            wide: true,
                            eyebrow: "Macros",
                            id: "h-mac",
                            title:
                                g === "day"
                                    ? "Macros per day"
                                    : "Macros · " +
                                      (g === "week" ? "weekly" : "monthly") +
                                      " average per logged day",
                            note: "Stacked grams of protein, carbs and fat.",
                            legend: any
                                ? legend([
                                      [LG.bar("m-protein"), "Protein"],
                                      [LG.bar("m-carbs"), "Carbs"],
                                      [LG.bar("m-fat"), "Fat"],
                                  ])
                                : "",
                        }) +
                        (any
                            ? '<div class="plot" id="macro-plot"></div>'
                            : emptyMsg) +
                        "</section></div>";
                };

                // Gridlines in --line-2 with mono ticks; no gridline at 0,
                // where the 1px ink baseline sits instead.
                function yAxis(svg, maxY, x0, x1, yAt, ticks, f) {
                    for (let i = 0; i <= ticks; i++) {
                        const v = (maxY / ticks) * i;
                        const y = yAt(v);
                        if (i)
                            svg.appendChild(
                                svgEl("line", {
                                    x1: x0,
                                    x2: x1,
                                    y1: y,
                                    y2: y,
                                    class: "gridline",
                                }),
                            );
                        svgText(
                            svg,
                            x0 - 8,
                            y + 4,
                            f ? f(v) : fmt(v),
                            "ax",
                            "end",
                        );
                    }
                }
                const yLabels = (maxY, ticks, f) =>
                    [...Array(ticks + 1).keys()].map((i) =>
                        f ? f((maxY / ticks) * i) : fmt((maxY / ticks) * i),
                    );
                function baseline(svg, x0, x1, y) {
                    svg.appendChild(
                        svgEl("line", {
                            x1: x0,
                            x2: x1,
                            y1: y + 0.5,
                            y2: y + 0.5,
                            class: "baseline",
                        }),
                    );
                }
                // §4.4.6: one label format per granularity and column width;
                // uppercase comes from CSS (.xl), the text stays mixed case.
                function xLabel(r, bw) {
                    const g = gran();
                    if (g === "week")
                        return bw >= 80
                            ? spanLabel(r.start, r.end)
                            : shortDay(r.start);
                    if (g === "month") {
                        const d = parseDay(r.start);
                        const yr = parseDay(data.endDate).getFullYear();
                        return (
                            d.toLocaleDateString(undefined, {
                                month: "short",
                            }) +
                            (d.getFullYear() !== yr
                                ? " ’" + String(d.getFullYear()).slice(2)
                                : "") +
                            (r.in_progress ? "*" : "")
                        );
                    }
                    const d = parseDay(r.date);
                    return bw >= 64
                        ? d.toLocaleDateString(undefined, {
                              weekday: "short",
                          }) +
                              " " +
                              d.getDate()
                        : d.toLocaleDateString(undefined, {
                              weekday: "narrow",
                          });
                }
                function xAxis(svg, rows, lay, x0, y) {
                    const labels = rows.map((r) => xLabel(r, lay.bw));
                    const chars = Math.max.apply(
                        null,
                        labels.map((l) => l.length),
                    );
                    xLabelIdx(rows.length, lay.bw * rows.length, chars).forEach(
                        function (i) {
                            svgText(
                                svg,
                                x0 + lay.bw * (i + 0.5),
                                y,
                                labels[i],
                                "xl" + (rows[i].in_progress ? " now" : ""),
                                "middle",
                            );
                        },
                    );
                }
                function rangeText() {
                    return (
                        shortDay(data.startDate) +
                        " to " +
                        shortDay(data.endDate)
                    );
                }
                const stepWord = () => (gran() === "day" ? "day" : perWord());

                function caloriesChart() {
                    const host = $("cal-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = chartRows();
                    const s = trendsStats(data.daily);
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 240 : 280,
                        "Calories, " +
                            rangeText() +
                            (gran() === "day"
                                ? ", per day"
                                : ", average per logged day by " + perWord()) +
                            ": average " +
                            fmt(s.avgKcal) +
                            " kcal over " +
                            plural(s.logged.length, "logged day") +
                            ". Use the arrow keys to read each " +
                            stepWord() +
                            ".",
                    );
                    const svg = c.svg;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const peak = Math.max.apply(
                        null,
                        rows.map((r) =>
                            Math.max(
                                r.calories || 0,
                                r.goal_calories || 0,
                                r.burn_kcal || 0,
                            ),
                        ),
                    );
                    const maxY = tickMax(peak * 1.05, 4);
                    const L = gutter(yLabels(maxY, 4));
                    const plotW = c.w - L - PAD.r;
                    const yAt = (v) => base - (v / maxY) * plotH;
                    yAxis(svg, maxY, L, L + plotW, yAt, 4);
                    const lay = bandLayout(rows.length, plotW);
                    calBars(svg, rows, L, plotW, yAt, base, lay);
                    baseline(svg, L, L + plotW, base);
                    // Goal as a step line: each bar's own target across its
                    // column, joined vertically where it changes.
                    let d = "";
                    rows.forEach(function (r, i) {
                        if (!r.goal_calories) return;
                        const y = yAt(r.goal_calories);
                        const x0 = L + lay.bw * i;
                        const prev = rows[i - 1];
                        d +=
                            (prev && prev.goal_calories ? "L" : "M") +
                            x0 +
                            "," +
                            y +
                            "L" +
                            (x0 + lay.bw) +
                            "," +
                            y;
                    });
                    if (d)
                        svg.appendChild(
                            svgEl("path", { d: d, class: "goal-line" }),
                        );
                    // Burn as resting base + workout: a dashed resting line
                    // (it moves as weight does), and the active kcal as a
                    // segment from it up to the total ring.
                    let rest = "";
                    rows.forEach(function (r, i) {
                        if (r.bmr_kcal == null) return;
                        const prev = rows[i - 1];
                        rest +=
                            (prev && prev.bmr_kcal != null ? "L" : "M") +
                            (L + lay.bw * (i + 0.5)) +
                            "," +
                            yAt(r.bmr_kcal);
                    });
                    if (rest && rows.length > 1)
                        svg.appendChild(
                            svgEl("path", { d: rest, class: "m-rest" }),
                        );
                    if (splitBurn(rows) && lay.bw >= 3) {
                        const w = Math.max(1.5, Math.min(4, lay.barW * 0.3));
                        rows.forEach(function (r, i) {
                            if (r.bmr_kcal == null || !r.active_kcal) return;
                            const x = L + lay.bw * (i + 0.5);
                            const seg = {
                                x1: x,
                                x2: x,
                                y1: yAt(r.bmr_kcal),
                                y2: yAt(r.burn_kcal),
                            };
                            const halo = svgEl("line", seg);
                            halo.setAttribute("class", "m-halo");
                            halo.style.strokeWidth = w + 3 + "px";
                            svg.appendChild(halo);
                            const a = svgEl("line", seg);
                            a.setAttribute(
                                "class",
                                "m-active" + (r.dim ? " dim" : ""),
                            );
                            a.style.strokeWidth = w + "px";
                            svg.appendChild(a);
                        });
                    }
                    // Sized by the real column width, so a phone gets
                    // smaller rings and the active segment stays visible.
                    const rr =
                        lay.bw >= 16
                            ? 4
                            : lay.bw >= 8
                              ? 3
                              : lay.bw >= 3
                                ? 2.5
                                : 1.5;
                    rows.forEach(function (r, i) {
                        if (!r.burn_kcal) return;
                        const ci = svgEl("circle", {
                            cx: L + lay.bw * (i + 0.5),
                            cy: yAt(r.burn_kcal),
                            r: rr,
                            class: "m-burn" + (r.dim ? " dim" : ""),
                        });
                        if (rr < 3) ci.style.strokeWidth = "1.5";
                        svg.appendChild(ci);
                    });
                    // Drawn last, with a surface halo, so no mark covers it.
                    const lastGoal = rows[rows.length - 1].goal_calories;
                    if (lastGoal)
                        svgText(
                            svg,
                            L + plotW,
                            Math.max(PAD.t + 4, yAt(lastGoal) - 9),
                            "Goal " + fmt(lastGoal),
                            "goal-lbl",
                            "end",
                        );
                    xAxis(svg, rows, lay, L, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {
                            const t = calTip(r);
                            return {
                                x: L + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                }

                // Estimated change per bar, up in --gain or down in --loss,
                // in grams with the kcal beside it. Bars are per-period sums
                // over complete logged days; today is never counted while it
                // runs (a half-eaten day reads as a huge deficit).
                function balanceChart() {
                    const host = $("bal-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = chartRows();
                    const plotted = (r) => r.band_g != null;
                    const known = rows.filter(plotted);
                    const netG = known.reduce((a, r) => a + r.band_g, 0);
                    const netK = known.reduce(
                        (a, r) => a + (r.band_kcal || 0),
                        0,
                    );
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 160 : 180,
                        "Estimated change per " +
                            stepWord() +
                            ", " +
                            rangeText() +
                            ": net " +
                            kcalG(netK, netG) +
                            ". Use the arrow keys to read each " +
                            stepWord() +
                            ".",
                    );
                    const svg = c.svg;
                    const top = PAD.t + 6;
                    const bottom = c.h - PAD.b - 6;
                    const zeroY = (top + bottom) / 2;
                    const peak = Math.max.apply(
                        null,
                        known.map((r) => Math.abs(r.band_g)),
                    );
                    // Direct labels (grams over kcal) only where a column is
                    // ≥ 64px wide; they need headroom past the bar end.
                    const L0 = gutter([fmtSigned(niceMax(peak)), "0 g"]);
                    const labelled = (c.w - L0 - PAD.r) / rows.length >= 64;
                    const maxAbs = niceMax(
                        Math.max(peak, 20) * (labelled ? 1.7 : 1.15),
                    );
                    const L = gutter([
                        fmtSigned(maxAbs),
                        fmtSigned(-maxAbs),
                        "0 g",
                    ]);
                    const plotW = c.w - L - PAD.r;
                    const yAt = (v) =>
                        zeroY - (v / maxAbs) * ((bottom - top) / 2);
                    [maxAbs, -maxAbs].forEach(function (v) {
                        svg.appendChild(
                            svgEl("line", {
                                x1: L,
                                x2: L + plotW,
                                y1: yAt(v),
                                y2: yAt(v),
                                class: "gridline",
                            }),
                        );
                        svgText(
                            svg,
                            L - 8,
                            yAt(v) + 4,
                            fmtSigned(v),
                            "ax",
                            "end",
                        );
                    });
                    const lay = bandLayout(rows.length, plotW);
                    rows.forEach(function (r, i) {
                        if (!plotted(r)) return;
                        const v = r.band_g;
                        const x = L + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const y = v >= 0 ? yAt(v) : zeroY;
                        const h = Math.max(1, Math.abs(yAt(v) - zeroY));
                        svg.appendChild(
                            svgEl("rect", {
                                x: x,
                                y: y,
                                width: lay.barW,
                                height: h,
                                class:
                                    (v >= 0 ? "m-gain" : "m-loss") +
                                    (r.dim ? " dim" : "") +
                                    " grow" +
                                    (v >= 0 ? "" : " down"),
                                style: growDelay(i),
                            }),
                        );
                        if (lay.bw >= 64) {
                            const cx = x + lay.barW / 2;
                            const gy = v >= 0 ? y - 19 : y + h + 14;
                            svgText(svg, cx, gy, fmtSigned(v) + " g", "lbl");
                            svgText(
                                svg,
                                cx,
                                gy + 14,
                                fmtSigned(r.band_kcal || 0) + " kcal",
                                "lbl sub",
                            );
                        }
                    });
                    svg.appendChild(
                        svgEl("line", {
                            x1: L,
                            x2: L + plotW,
                            y1: zeroY,
                            y2: zeroY,
                            class: "zero",
                        }),
                    );
                    svgText(svg, L - 8, zeroY + 4, "0 g", "ax", "end");
                    xAxis(svg, rows, lay, L, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {
                            let t;
                            if (!plotted(r))
                                t = tipContent(
                                    r.title,
                                    [
                                        [
                                            null,
                                            r.in_progress && !r.avg
                                                ? "In progress"
                                                : "No complete logged days",
                                            r.in_progress && !r.avg
                                                ? "not counted yet"
                                                : "no estimate",
                                        ],
                                    ].concat(
                                        r.avg
                                            ? [[null, "Logged", loggedText(r)]]
                                            : [],
                                    ),
                                );
                            else if (!r.avg)
                                t = tipContent(r.title, [
                                    [
                                        r.band_g >= 0 ? "s-gain" : "s-loss",
                                        "Est. change",
                                        fmtSigned(r.band_g) + " g",
                                        1,
                                    ],
                                    [
                                        null,
                                        "Balance (eaten − burn)",
                                        fmtSigned(r.band_kcal) + " kcal",
                                    ],
                                ]);
                            else
                                t = tipContent(r.title, [
                                    [
                                        r.band_g >= 0 ? "s-gain" : "s-loss",
                                        "Total est. change",
                                        kcalG(r.band_kcal, r.band_g),
                                        1,
                                    ],
                                    [
                                        null,
                                        "Per logged day",
                                        kcalG(r.balance_kcal, r.balance_g),
                                    ],
                                    [
                                        null,
                                        "Covers",
                                        plural(r.band_days, "complete day"),
                                    ],
                                    [null, "Logged", loggedText(r)],
                                ]);
                            return {
                                x: L + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        top,
                        bottom,
                    );
                }

                const MACROS = [
                    {
                        key: "protein_g",
                        name: "Protein",
                        cls: "m-protein",
                        sw: "s-protein",
                    },
                    {
                        key: "carbs_g",
                        name: "Carbs",
                        cls: "m-carbs",
                        sw: "s-carbs",
                    },
                    { key: "fat_g", name: "Fat", cls: "m-fat", sw: "s-fat" },
                ];
                function macroChart() {
                    const host = $("macro-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = chartRows();
                    const logged = data.daily.filter((r) => r.mealCount > 0);
                    const avg = (k) =>
                        logged.length
                            ? logged.reduce((a, r) => a + r[k], 0) /
                              logged.length
                            : 0;
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 240 : 280,
                        "Protein, carbs and fat in grams, " +
                            rangeText() +
                            (gran() === "day"
                                ? ", per day"
                                : ", average per logged day by " + perWord()) +
                            ". Averages per logged day: protein " +
                            fmt(avg("protein_g")) +
                            " g, carbs " +
                            fmt(avg("carbs_g")) +
                            " g, fat " +
                            fmt(avg("fat_g")) +
                            " g. Use the arrow keys to read each " +
                            stepWord() +
                            ".",
                    );
                    const svg = c.svg;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const total = (r) =>
                        (r.protein_g || 0) + (r.carbs_g || 0) + (r.fat_g || 0);
                    const maxY = tickMax(
                        Math.max.apply(null, rows.map(total)) * 1.05,
                        4,
                    );
                    const L = gutter(yLabels(maxY, 4));
                    const plotW = c.w - L - PAD.r;
                    const yAt = (v) => base - (v / maxY) * plotH;
                    yAxis(svg, maxY, L, L + plotW, yAt, 4);
                    const lay = bandLayout(rows.length, plotW);
                    const gapPx = lay.barW >= 4 ? 2 : 0;
                    rows.forEach(function (r, i) {
                        if (r.calories == null) return; // no logged days
                        const x = L + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const w = lay.barW;
                        let acc = 0;
                        // Fat at the bottom, protein on top. Each segment
                        // above another leaves a 2px gap; only the segment
                        // that finishes the stack is rounded.
                        for (let s = MACROS.length - 1; s >= 0; s--) {
                            const val = r[MACROS[s].key] || 0;
                            if (val <= 0) continue;
                            const yTop = yAt(acc + val);
                            const segH = Math.max(
                                0,
                                yAt(acc) - yTop - (acc > 0 ? gapPx : 0),
                            );
                            svg.appendChild(
                                svgEl("path", {
                                    d: rectPath(x, yTop, w, segH),
                                    class:
                                        MACROS[s].cls +
                                        (r.dim ? " dim" : "") +
                                        " grow",
                                    style: growDelay(i),
                                }),
                            );
                            acc += val;
                        }
                    });
                    baseline(svg, L, L + plotW, base);
                    xAxis(svg, rows, lay, L, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {
                            const lines =
                                r.calories == null
                                    ? [[null, "Nothing logged", ""]]
                                    : MACROS.map((m) => [
                                          m.sw,
                                          m.name + (r.avg ? " (avg/day)" : ""),
                                          fmt(r[m.key]) + " g",
                                      ]);
                            if (r.goal_protein_g)
                                lines.push([
                                    null,
                                    "Protein goal",
                                    fmt(r.goal_protein_g) + " g",
                                ]);
                            if (r.avg)
                                lines.push([null, "Logged", loggedText(r)]);
                            const t = tipContent(r.title, lines);
                            return {
                                x: L + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                }
                CHARTS.trends = function () {
                    caloriesChart();
                    balanceChart();
                    macroChart();
                };

                /* ================= BODY ================= */
                const BMI_LABEL = {
                    underweight: "Underweight",
                    healthy: "Healthy range",
                    overweight: "Overweight",
                    obese: "Obese",
                };
                // Form state that must outlive a re-render (range change,
                // refetch after save): open/closed, whether the user has
                // toggled it, unsaved input, and the status line.
                let bodyTouched = false;
                let bodyOpen = false;
                let bodyDraft = null;
                let bodyStatus = { text: "", cls: "" };
                let bodyStatusTimer = 0;
                const detailsMissing = () =>
                    data.weightStats.missing.some((m) => m !== "weight");

                function targetFoot(s, unit) {
                    if (s.to_target_g === 0) return "At target";
                    if (s.projected_date)
                        return (
                            "At this rate: " +
                            longDay(s.projected_date) +
                            " (est.)"
                        );
                    if (s.weekly_rate_g != null)
                        return "Current trend is not heading there";
                    return "Target " + wfmt(s.target_g, unit) + " " + unit;
                }
                // The Weight label's rows, each with its explanation (or the
                // action that would fill it) indented under it.
                function bodyStats(s, unit) {
                    const u = unitSm(unit);
                    const kcal = unitSm("kcal");
                    const miss = (label, foot) =>
                        factsRow(label, "—", foot, { missing: true });
                    let h = "";
                    h +=
                        s.change_g != null
                            ? factsRow(
                                  "Change",
                                  fmtSignedDec(toUnit(s.change_g, unit)) + u,
                                  "over " +
                                      s.trend_days +
                                      " days · " +
                                      fmtSignedDec(
                                          toUnit(s.weekly_rate_g, unit),
                                          2,
                                      ) +
                                      " " +
                                      unit +
                                      "/week",
                              )
                            : miss(
                                  "Change",
                                  "Needs 2+ weigh-ins on different days",
                              );
                    if (s.target_g != null)
                        h += factsRow(
                            "To target",
                            (s.to_target_g != null
                                ? fmtSignedDec(toUnit(s.to_target_g, unit))
                                : wfmt(s.target_g, unit)) + u,
                            targetFoot(s, unit),
                        );
                    h +=
                        s.bmi != null
                            ? factsRow(
                                  "BMI",
                                  s.bmi.toFixed(1) +
                                      '<span class="cat">' +
                                      BMI_LABEL[s.bmi_category] +
                                      "</span>",
                              )
                            : miss(
                                  "BMI",
                                  s.height_cm == null
                                      ? ADD_BODY
                                      : "Needs a weigh-in",
                              );
                    h +=
                        s.healthy_min_g != null
                            ? factsRow(
                                  "Healthy range",
                                  wfmt(s.healthy_min_g, unit) +
                                      "–" +
                                      wfmt(s.healthy_max_g, unit) +
                                      u,
                                  "BMI 18.5–24.9 at " +
                                      Number(s.height_cm).toFixed(0) +
                                      " cm",
                              )
                            : miss("Healthy range", ADD_BODY);
                    h +=
                        s.bmr_kcal != null
                            ? factsRow(
                                  "Resting burn (est.)",
                                  fmt(s.bmr_kcal) + kcal,
                                  "BMR · Mifflin-St Jeor" +
                                      (s.age != null ? " · age " + s.age : ""),
                              )
                            : miss("Resting burn (est.)", ADD_BODY);
                    h +=
                        s.burn_today_kcal != null
                            ? factsRow(
                                  "Est. burn today",
                                  fmt(s.burn_today_kcal) + kcal,
                                  "Resting burn + today’s active kcal",
                              )
                            : miss("Est. burn today", ADD_BODY);
                    return '<dl class="facts-rows">' + h + "</dl>";
                }
                // "+ Log weight": form state that must survive a re-render
                // (the refetch after a save, a range change).
                let lwOpen = false;
                let lwDraft = null;
                let lwFlash = "";
                let lwFlashTimer = 0;
                function logWeightHtml() {
                    const unit = data.weightUnit;
                    const d = lwDraft || {
                        weight: "",
                        unit: unit,
                        at: localInputValue(),
                        note: "",
                    };
                    const opt = (u) =>
                        '<option value="' +
                        u +
                        '"' +
                        (d.unit === u ? " selected" : "") +
                        ">" +
                        u +
                        "</option>";
                    return (
                        '<form id="lw-form" class="lw-form" novalidate aria-label="Log a weigh-in"><div class="form-grid">' +
                        '<div class="field"><label for="lw-weight">Weight</label><span class="pair"><input class="input" id="lw-weight" type="number" inputmode="decimal" step="0.1" min="0" value="' +
                        esc(d.weight) +
                        '" /><select class="input" id="lw-unit" aria-label="Weight unit">' +
                        opt("kg") +
                        opt("lb") +
                        "</select></span></div>" +
                        '<label class="field" for="lw-at">When<input class="input" id="lw-at" type="datetime-local" value="' +
                        esc(d.at) +
                        '" /></label>' +
                        '<label class="field wide" for="lw-note">Note (optional)<input class="input" id="lw-note" type="text" maxlength="1000" placeholder="e.g. morning, fasted" value="' +
                        esc(d.note) +
                        '" /></label></div>' +
                        '<div class="form-foot lw-foot"><button type="submit" class="btn primary" id="lw-save">Save weigh-in</button><button type="button" class="btn" id="lw-cancel">Cancel</button><span class="b-status" id="lw-status" role="status"></span></div>' +
                        '<p class="form-hint">Time is in ' +
                        esc(data.timezone) +
                        ". Same rules as asking Claude to log it.</p></form>"
                    );
                }
                function weightHeadHtml(title) {
                    return (
                        '<div class="facts-title"><h3 id="h-w">' +
                        title +
                        '</h3><button type="button" class="btn btn-sm" id="lw-open" aria-expanded="' +
                        lwOpen +
                        '" aria-controls="lw-form"' +
                        (lwOpen ? " hidden" : "") +
                        ">+ Log weight</button></div>" +
                        (lwFlash
                            ? '<p class="lw-flash" role="status">' +
                              esc(lwFlash) +
                              "</p>"
                            : "")
                    );
                }
                function openLogWeight() {
                    lwOpen = true;
                    selectTab("body");
                    contentDirty.body = true;
                    paint();
                    const box = $("lw-weight");
                    if (box) {
                        box.scrollIntoView({ block: "center" });
                        box.focus();
                    }
                }
                function wireLogWeight() {
                    const open = $("lw-open");
                    if (open) open.addEventListener("click", openLogWeight);
                    const form = $("lw-form");
                    if (!form) return;
                    const read = () => ({
                        weight: $("lw-weight").value,
                        unit: $("lw-unit").value,
                        at: $("lw-at").value,
                        note: $("lw-note").value,
                    });
                    form.addEventListener("input", function () {
                        lwDraft = read();
                    });
                    $("lw-cancel").addEventListener("click", function () {
                        lwOpen = false;
                        lwDraft = null;
                        contentDirty.body = true;
                        paint();
                        if ($("lw-open")) $("lw-open").focus();
                    });
                    form.addEventListener("submit", function (ev) {
                        ev.preventDefault();
                        const v = read();
                        const st = $("lw-status");
                        const btn = $("lw-save");
                        st.className = "b-status";
                        if (!v.weight.trim()) {
                            st.className = "b-status err";
                            st.textContent = "Enter a weight.";
                            $("lw-weight").focus();
                            return;
                        }
                        btn.disabled = true;
                        st.textContent = "Saving…";
                        writeJson("POST", "/api/dashboard/weight", {
                            weight: Number(v.weight),
                            unit: v.unit,
                            logged_at: v.at || undefined,
                            notes: v.note || undefined,
                        })
                            .then(function (res) {
                                if ($("lw-save")) $("lw-save").disabled = false;
                                if (!res.ok) {
                                    const s = $("lw-status");
                                    if (s) {
                                        s.className = "b-status err";
                                        s.textContent =
                                            (res.body &&
                                                res.body.error_description) ||
                                            "Could not save.";
                                    }
                                    return;
                                }
                                const e = res.body.entry;
                                lwOpen = false;
                                lwDraft = null;
                                lwFlash =
                                    "Logged " +
                                    wfmt(e.weight_g, data.weightUnit) +
                                    " " +
                                    data.weightUnit +
                                    " for " +
                                    shortDay(e.date) +
                                    ", " +
                                    localTime(e.logged_at) +
                                    (res.body.deduplicated
                                        ? " (already recorded)."
                                        : ".");
                                clearTimeout(lwFlashTimer);
                                lwFlashTimer = setTimeout(function () {
                                    lwFlash = "";
                                    const f =
                                        document.querySelector(".lw-flash");
                                    if (f) f.remove();
                                }, 6000);
                                refresh();
                            })
                            .catch(function (err) {
                                if (err && err.message === "unauthorized")
                                    return;
                                if ($("lw-save")) $("lw-save").disabled = false;
                                const s = $("lw-status");
                                if (s) {
                                    s.className = "b-status err";
                                    s.textContent =
                                        "Could not reach the server.";
                                }
                            });
                    });
                }
                // The Body tab's hero: a "Weight" Facts panel.
                function weightHero(s, unit) {
                    const has = s.latest_g != null;
                    return (
                        '<section class="facts w-facts rv" aria-labelledby="h-w">' +
                        weightHeadHtml("Weight") +
                        '<p class="facts-serving"><span>Serving size <b>you, in ' +
                        unit +
                        "</b></span>" +
                        (has
                            ? '<span class="tag">logged ' +
                              esc(shortDay(s.latest_date)) +
                              "</span>"
                            : "") +
                        "</p>" +
                        (lwOpen ? logWeightHtml() : "") +
                        (has
                            ? '<div class="facts-cal w-now"><p class="label">Current<small>logged ' +
                              esc(longDay(s.latest_date)) +
                              '</small></p><p class="fig-hero"><b>' +
                              wfmt(s.latest_g, unit) +
                              "</b>" +
                              unitSm(unit) +
                              "</p></div>"
                            : '<div class="facts-cal"><p class="label">Current<small>No weigh-ins</small></p><p class="fig-hero missing">—</p></div><p class="empty w-empty">No weigh-ins yet. Log one here, or ask Claude to log your weight.</p>') +
                        bodyStats(s, unit) +
                        '<p class="facts-foot">BMI and burn are estimates from your height, birth date and sex.</p></section>'
                    );
                }
                function bodyFormHtml() {
                    return (
                        '<section class="details-sec rv"><details class="body-box" id="body-box"' +
                        (bodyOpen ? " open" : "") +
                        '><summary>Body details</summary><p class="note">Used only for BMI, your healthy weight range and the estimated daily burn (your resting burn from Mifflin-St Jeor, plus your watch’s active calories).</p>' +
                        '<form id="body-form" class="body-form" novalidate><div class="form-grid">' +
                        '<div class="field"><label for="b-height">Height</label><span class="pair"><input class="input" id="b-height" type="number" inputmode="decimal" step="0.1" min="20" max="272" /><select class="input" id="b-unit" aria-label="Height unit"><option value="cm">cm</option><option value="in">in</option></select></span></div>' +
                        '<label class="field" for="b-birth">Birth date<input class="input" id="b-birth" type="date" /></label>' +
                        '<label class="field wide" for="b-sex">Sex<select class="input" id="b-sex"><option value="">—</option><option value="male">Male</option><option value="female">Female</option></select></label></div>' +
                        '<div class="form-foot"><button type="submit" class="btn primary" id="b-save">Save</button><span class="b-status ' +
                        bodyStatus.cls +
                        '" id="b-status" role="status">' +
                        esc(bodyStatus.text) +
                        "</span></div></form></details></section>"
                    );
                }
                function fillBodyForm() {
                    const body = data.body;
                    const d = bodyDraft;
                    const unit = d
                        ? d.unit
                        : data.weightUnit === "lb"
                          ? "in"
                          : "cm";
                    $("b-unit").value = unit;
                    $("b-height").value = d
                        ? d.height
                        : body.height_cm == null
                          ? ""
                          : unit === "in"
                            ? (body.height_cm / 2.54).toFixed(1)
                            : String(body.height_cm);
                    $("b-birth").value = d ? d.birth : body.birth_date || "";
                    $("b-sex").value = d ? d.sex : body.sex || "";
                    // Open it when something is missing, so the ask is
                    // visible — unless the user has toggled it themselves.
                    if (
                        detailsMissing() &&
                        !bodyTouched &&
                        !$("body-box").open
                    ) {
                        // The toggle event fires async; its handler
                        // consumes this flag, so it is set only when a
                        // toggle will actually follow.
                        bodyBoxProgrammatic = true;
                        $("body-box").open = true;
                        bodyOpen = true;
                    }
                }
                function setBodyStatus(text, cls) {
                    clearTimeout(bodyStatusTimer);
                    bodyStatus = { text: text, cls: cls || "" };
                    const st = $("b-status");
                    if (st) {
                        st.className = "b-status " + bodyStatus.cls;
                        st.textContent = text;
                    }
                }
                function wireBodyForm() {
                    const box = $("body-box");
                    box.addEventListener("toggle", function () {
                        bodyOpen = box.open;
                        if (bodyBoxProgrammatic) bodyBoxProgrammatic = false;
                        else bodyTouched = true;
                    });
                    $("body-form").addEventListener("input", function () {
                        bodyDraft = {
                            height: $("b-height").value,
                            unit: $("b-unit").value,
                            birth: $("b-birth").value,
                            sex: $("b-sex").value,
                        };
                    });
                    $("body-form").addEventListener("submit", function (ev) {
                        ev.preventDefault();
                        const btn = $("b-save");
                        const h = $("b-height").value.trim();
                        btn.disabled = true;
                        setBodyStatus("Saving…");
                        fetch("/api/dashboard/body", {
                            method: "POST",
                            headers: {
                                Authorization: "Bearer " + token,
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                height: h === "" ? null : Number(h),
                                height_unit: $("b-unit").value,
                                birth_date: $("b-birth").value || null,
                                sex: $("b-sex").value || null,
                            }),
                        })
                            .then(function (r) {
                                return r
                                    .json()
                                    .catch(function () {
                                        return {};
                                    })
                                    .then(function (b) {
                                        return {
                                            ok: r.ok,
                                            status: r.status,
                                            body: b,
                                        };
                                    });
                            })
                            .then(function (res) {
                                if ($("b-save")) $("b-save").disabled = false;
                                if (res.status === 401) return signOut();
                                if (!res.ok) {
                                    setBodyStatus(
                                        (res.body &&
                                            res.body.error_description) ||
                                            "Could not save.",
                                        "err",
                                    );
                                    return;
                                }
                                bodyDraft = null;
                                setBodyStatus("Saved.", "ok");
                                bodyStatusTimer = setTimeout(function () {
                                    const st = $("b-status");
                                    if (st) st.classList.add("fade");
                                    bodyStatusTimer = setTimeout(function () {
                                        setBodyStatus("");
                                    }, 450);
                                }, 4000);
                                refresh();
                            })
                            .catch(function () {
                                if ($("b-save")) $("b-save").disabled = false;
                                setBodyStatus(
                                    "Could not reach the server.",
                                    "err",
                                );
                            });
                    });
                }

                RENDER.body = function () {
                    const s = data.weightStats;
                    const unit = data.weightUnit;
                    const pts = data.weights.length;
                    const windowDays =
                        dayDiff(data.weightWindowStart, data.endDate) + 1;
                    $("body-body").innerHTML =
                        '<div class="stack">' +
                        (detailsMissing()
                            ? '<div class="notice rv"><span><b>Missing details.</b> Add your height, birth date and sex to see BMI and estimated burn.</span></div>'
                            : "") +
                        '<div class="body-grid">' +
                        weightHero(s, unit) +
                        '<section class="w-chart rv" aria-labelledby="h-wchart">' +
                        secHead({
                            eyebrow: "Trend",
                            id: "h-wchart",
                            title:
                                "Weight · since " +
                                esc(shortDay(data.weightWindowStart)),
                            note: pts
                                ? plural(pts, "weigh-in") +
                                  " since " +
                                  esc(longDay(data.weightWindowStart)) +
                                  ", in " +
                                  unit +
                                  "."
                                : "No weigh-ins in the last " +
                                  windowDays +
                                  " days.",
                            legend: pts
                                ? legend(
                                      [[LG.dotline(), "Weight"]]
                                          .concat(
                                              s.target_g != null
                                                  ? [[LG.line(true), "Target"]]
                                                  : [],
                                          )
                                          .concat(
                                              s.healthy_min_g != null
                                                  ? [
                                                        [
                                                            LG.bar("m-band"),
                                                            "Healthy BMI range",
                                                        ],
                                                    ]
                                                  : [],
                                          ),
                                  )
                                : "",
                        }) +
                        (pts
                            ? '<div class="plot" id="weight-plot"></div>'
                            : '<p class="empty">No weigh-ins yet. Ask Claude to log your weight.</p>') +
                        "</section>" +
                        bodyFormHtml() +
                        "</div></div>";
                    fillBodyForm();
                    wireBodyForm();
                    wireLogWeight();
                };

                // Time-scaled, not index-scaled: weigh-ins are irregular, and
                // even spacing would make a two-week gap look like a day.
                CHARTS.body = function () {
                    const host = $("weight-plot");
                    if (!host || !host.clientWidth) return;
                    const unit = data.weightUnit;
                    const s = data.weightStats;
                    const pts = data.weights
                        .map((w) => ({
                            date: w.date,
                            v: toUnit(w.weight_g, unit),
                        }))
                        .sort((a, b) => (a.date < b.date ? -1 : 1));
                    const first = pts[0];
                    const last = pts[pts.length - 1];
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 220 : 280,
                        "Body weight since " +
                            shortDay(data.weightWindowStart) +
                            ": " +
                            first.v.toFixed(1) +
                            " " +
                            unit +
                            " on " +
                            shortDay(first.date) +
                            " to " +
                            last.v.toFixed(1) +
                            " " +
                            unit +
                            " on " +
                            shortDay(last.date) +
                            (s.target_g != null
                                ? ", target " +
                                  wfmt(s.target_g, unit) +
                                  " " +
                                  unit
                                : "") +
                            ". Use the arrow keys to read each weigh-in.",
                    );
                    const svg = c.svg;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const vals = pts.map((p) => p.v);
                    if (s.target_g != null) vals.push(toUnit(s.target_g, unit));
                    let lo = Math.min.apply(null, vals);
                    let hi = Math.max.apply(null, vals);
                    const padY = (hi - lo) * 0.2 || 1;
                    lo -= padY;
                    hi += padY;
                    const L = gutter([hi.toFixed(1), lo.toFixed(1)]);
                    const plotW = c.w - L - PAD.r;
                    const t0 = parseDay(data.weightWindowStart).getTime();
                    const t1 = parseDay(data.endDate).getTime();
                    const xAt = (iso) =>
                        L +
                        (t1 === t0
                            ? plotW / 2
                            : ((parseDay(iso).getTime() - t0) / (t1 - t0)) *
                              plotW);
                    const yAt = (v) => base - ((v - lo) / (hi - lo)) * plotH;
                    if (s.healthy_min_g != null) {
                        const a = Math.max(lo, toUnit(s.healthy_min_g, unit));
                        const b = Math.min(hi, toUnit(s.healthy_max_g, unit));
                        if (b > a)
                            svg.appendChild(
                                svgEl("rect", {
                                    x: L,
                                    y: yAt(b),
                                    width: plotW,
                                    height: yAt(a) - yAt(b),
                                    class: "m-band",
                                }),
                            );
                    }
                    baseline(svg, L, L + plotW, base);
                    for (let i = 0; i <= 3; i++) {
                        const v = lo + ((hi - lo) / 3) * i;
                        if (i)
                            svg.appendChild(
                                svgEl("line", {
                                    x1: L,
                                    x2: L + plotW,
                                    y1: yAt(v),
                                    y2: yAt(v),
                                    class: "gridline",
                                }),
                            );
                        svgText(
                            svg,
                            L - 8,
                            yAt(v) + 4,
                            v.toFixed(1),
                            "ax",
                            "end",
                        );
                    }
                    if (s.target_g != null) {
                        const ty = yAt(toUnit(s.target_g, unit));
                        svg.appendChild(
                            svgEl("line", {
                                x1: L,
                                x2: L + plotW,
                                y1: ty,
                                y2: ty,
                                class: "m-target",
                            }),
                        );
                        svgText(
                            svg,
                            L + plotW,
                            ty - 7,
                            "Target " + wfmt(s.target_g, unit),
                            "goal-lbl",
                            "end",
                        );
                    }
                    svg.appendChild(
                        svgEl("path", {
                            d: pts
                                .map(
                                    (p, i) =>
                                        (i ? "L" : "M") +
                                        xAt(p.date) +
                                        "," +
                                        yAt(p.v),
                                )
                                .join(" "),
                            class: "m-wline",
                        }),
                    );
                    const r = pts.length > 60 ? 2.5 : 3.5;
                    pts.forEach(function (p) {
                        svg.appendChild(
                            svgEl("circle", {
                                cx: xAt(p.date),
                                cy: yAt(p.v),
                                r: r,
                                class: "m-wdot",
                            }),
                        );
                    });
                    [data.weightWindowStart, data.endDate].forEach(
                        function (iso, k) {
                            svgText(
                                svg,
                                k ? L + plotW : L,
                                c.h - 8,
                                shortDay(iso),
                                "xl",
                                k ? "end" : "start",
                            );
                        },
                    );
                    inspect(
                        svg,
                        pts.map(function (p) {
                            const rows = [
                                [
                                    "s-accent",
                                    "Weight",
                                    p.v.toFixed(1) + " " + unit,
                                    1,
                                ],
                            ];
                            if (s.height_cm)
                                rows.push([
                                    null,
                                    "BMI",
                                    (
                                        (unit === "lb"
                                            ? p.v * 0.45359237
                                            : p.v) /
                                        Math.pow(s.height_cm / 100, 2)
                                    ).toFixed(1),
                                ]);
                            const t = tipContent(longDay(p.date), rows);
                            return {
                                x: xAt(p.date),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                };

                /* ================= MEALS ================= */
                /* ---------- meal edit (Meals tab) ---------- */
                // One meal at a time. State survives re-renders (a refetch,
                // a range change) so a half-finished edit is not lost.
                let mealEditId = null;
                let mealDraft = null;
                let mealFlash = "";
                let mealFlashTimer = 0;
                const MEAL_NUMS = [
                    ["calories", "kcal", 1],
                    ["protein_g", "Protein g", 0.1],
                    ["carbs_g", "Carbs g", 0.1],
                    ["fat_g", "Fat g", 0.1],
                    ["fiber_g", "Fiber g", 0.1],
                    ["sugar_g", "Sugar g", 0.1],
                ];
                const numStr = (v) => (v == null ? "" : String(v));
                function mealValues(m) {
                    const v = {
                        description: m.description || "",
                        meal_type: m.meal_type || "",
                        logged_at: localInputValue(m.logged_at),
                    };
                    MEAL_NUMS.forEach(function (n) {
                        v[n[0]] = numStr(m[n[0]]);
                    });
                    return v;
                }
                function mealEditForm(m) {
                    const v = mealDraft || mealValues(m);
                    const types = [
                        "breakfast",
                        "lunch",
                        "dinner",
                        "snack",
                        "treat",
                    ];
                    return (
                        '<form id="me-form" class="me-form" novalidate aria-label="Edit meal"><div class="form-grid">' +
                        '<label class="field wide" for="me-description">Description<textarea class="input" id="me-description" rows="2" maxlength="2000">' +
                        esc(v.description) +
                        "</textarea></label>" +
                        '<label class="field" for="me-type">Meal<select class="input" id="me-type">' +
                        (v.meal_type ? "" : '<option value="">—</option>') +
                        types
                            .map(function (t) {
                                return (
                                    '<option value="' +
                                    t +
                                    '"' +
                                    (v.meal_type === t ? " selected" : "") +
                                    ">" +
                                    mealTypeLabel(t) +
                                    "</option>"
                                );
                            })
                            .join("") +
                        "</select></label>" +
                        '<label class="field" for="me-at">Eaten at<input class="input" id="me-at" type="datetime-local" value="' +
                        esc(v.logged_at) +
                        '" /></label>' +
                        MEAL_NUMS.map(function (n) {
                            return (
                                '<label class="field" for="me-' +
                                n[0] +
                                '">' +
                                n[1] +
                                '<input class="input" id="me-' +
                                n[0] +
                                '" type="number" inputmode="decimal" min="0" step="' +
                                n[2] +
                                '" value="' +
                                esc(v[n[0]]) +
                                '" /></label>'
                            );
                        }).join("") +
                        "</div>" +
                        '<div class="form-foot"><button type="submit" class="btn primary" id="me-save">Save changes</button><button type="button" class="btn" id="me-cancel">Cancel</button><span class="b-status" id="me-status" role="status"></span></div>' +
                        '<p class="form-hint">Times are in ' +
                        esc(data.timezone) +
                        ". Only the fields you change are saved.</p></form>"
                    );
                }
                function readMealForm() {
                    const v = {
                        description: $("me-description").value,
                        meal_type: $("me-type").value,
                        logged_at: $("me-at").value,
                    };
                    MEAL_NUMS.forEach(function (n) {
                        v[n[0]] = $("me-" + n[0]).value;
                    });
                    return v;
                }
                // Only what differs from the meal as listed. A number left
                // as it was is not sent even if it was blank; a value the
                // user blanks IS sent, and the server says it can't clear.
                function mealChanges(m, v) {
                    const was = mealValues(m);
                    const out = {};
                    if (v.description.trim() !== was.description.trim())
                        out.description = v.description;
                    if (v.meal_type && v.meal_type !== was.meal_type)
                        out.meal_type = v.meal_type;
                    if (v.logged_at && v.logged_at !== was.logged_at)
                        out.logged_at = v.logged_at;
                    MEAL_NUMS.forEach(function (n) {
                        const now = v[n[0]].trim();
                        const before = was[n[0]];
                        if (now === before) return;
                        if (
                            now !== "" &&
                            before !== "" &&
                            Number(now) === Number(before)
                        )
                            return;
                        out[n[0]] = now === "" ? "" : Number(now);
                    });
                    return out;
                }
                function closeMealEdit(focusId) {
                    mealEditId = null;
                    mealDraft = null;
                    contentDirty.meals = true;
                    paint();
                    if (focusId) {
                        const b = document.querySelector(
                            '#meals-body [data-edit="' + focusId + '"]',
                        );
                        if (b) b.focus();
                    }
                }
                $("meals-body").addEventListener("click", function (ev) {
                    const ed = ev.target.closest("[data-edit]");
                    if (ed) {
                        const id = ed.dataset.edit;
                        if (mealEditId === id) return closeMealEdit(id);
                        mealEditId = id;
                        mealDraft = null;
                        contentDirty.meals = true;
                        paint();
                        const d = $("me-description");
                        if (d) d.focus();
                        return;
                    }
                    if (ev.target.closest("#me-cancel"))
                        closeMealEdit(mealEditId);
                });
                $("meals-body").addEventListener("input", function (ev) {
                    if (ev.target.closest("#me-form"))
                        mealDraft = readMealForm();
                });
                $("meals-body").addEventListener("submit", function (ev) {
                    if (!ev.target.closest("#me-form")) return;
                    ev.preventDefault();
                    const id = mealEditId;
                    const meal = data.meals.filter((m) => m.id === id)[0];
                    if (!meal) return;
                    const changes = mealChanges(meal, readMealForm());
                    const st = $("me-status");
                    st.className = "b-status";
                    if (!Object.keys(changes).length) {
                        st.textContent = "Nothing changed.";
                        return;
                    }
                    $("me-save").disabled = true;
                    st.textContent = "Saving…";
                    writeJson(
                        "PATCH",
                        "/api/dashboard/meals/" + encodeURIComponent(id),
                        changes,
                    )
                        .then(function (res) {
                            if ($("me-save")) $("me-save").disabled = false;
                            if (!res.ok) {
                                const s = $("me-status");
                                if (s) {
                                    s.className = "b-status err";
                                    s.textContent =
                                        res.status === 404
                                            ? "This meal no longer exists."
                                            : (res.body &&
                                                  res.body.error_description) ||
                                              "Could not save.";
                                }
                                return;
                            }
                            mealEditId = null;
                            mealDraft = null;
                            mealFlash =
                                "Saved " +
                                mealTypeLabel(
                                    res.body.meal.meal_type,
                                ).toLowerCase() +
                                " · " +
                                shortDay(localDate(res.body.meal.logged_at)) +
                                ", " +
                                localTime(res.body.meal.logged_at) +
                                ".";
                            clearTimeout(mealFlashTimer);
                            mealFlashTimer = setTimeout(function () {
                                mealFlash = "";
                                const f = document.querySelector(".meal-flash");
                                if (f) f.remove();
                            }, 6000);
                            // Totals, charts and Today all move with it.
                            refresh();
                        })
                        .catch(function (err) {
