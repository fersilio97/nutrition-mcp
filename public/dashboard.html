                    grid-area: details;
                }
            }
            .w-now .fig-hero b {
                font-weight: 800;
            }
            .w-empty {
                padding: var(--s4) 0 var(--s3);
            }
            details.body-box > summary {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--s4);
                min-height: 48px;
                padding-top: var(--s4);
                border-top: 3px solid var(--rule);
                list-style: none;
                cursor: pointer;
                font-family: var(--font-display);
                font-weight: 700;
                font-variation-settings: "opsz" 96;
                font-size: var(--fs-h2);
                letter-spacing: -0.025em;
                line-height: 1.1;
            }
            details.body-box > summary::-webkit-details-marker {
                display: none;
            }
            details.body-box > summary::after {
                content: "+";
                flex: none;
                font-family: var(--font-mono);
                font-weight: 400;
                font-size: 1.5rem;
                line-height: 1;
                color: var(--ink-2);
                transition: transform 0.25s var(--ease-out);
            }
            details.body-box[open] > summary::after {
                transform: rotate(45deg);
            }
            details.body-box > summary:hover::after {
                color: var(--ink);
            }
            details.body-box > .note {
                margin: var(--s3) 0 var(--s4);
            }
            .body-form .form-foot {
                margin-top: var(--s4);
            }

            /* ================= Meals ================= */
            .meals-table {
                width: 100%;
                border-collapse: collapse;
            }
            .meals-table td,
            .meals-table th {
                text-align: left;
                vertical-align: baseline;
            }
            .meals-table .n {
                text-align: right;
            }
            .meals-table thead th {
                padding: 0 var(--s3) var(--s2);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-3);
                white-space: nowrap;
            }
            .meals-table tr.day th {
                padding: var(--s3) var(--s3) var(--s2);
                border-top: 3px solid var(--rule);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink);
            }
            .meals-table tr.day .tot {
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                letter-spacing: 0;
                text-transform: none;
                color: var(--ink-2);
                font-weight: 400;
                white-space: nowrap;
            }
            .meals-table tr.day .tot b {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-row);
                letter-spacing: -0.02em;
                color: var(--ink);
            }
            .partial {
                margin-left: var(--s2);
                color: var(--warn);
            }
            .meals-table td.t {
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                color: var(--ink-3);
                white-space: nowrap;
            }
            .meals-table td.ty {
                font-weight: 600;
                white-space: nowrap;
            }
            .meals-table td.d {
                overflow-wrap: anywhere;
                text-wrap: pretty;
            }
            .meals-table td.k {
                font-weight: 600;
            }
            .meals-table td.mac {
                color: var(--ink-2);
            }
            .meals-table td.mac b {
                font-weight: 400;
            }
            .meals-foot {
                margin-top: var(--s4);
                font-size: var(--fs-foot);
                color: var(--ink-3);
            }
            .me-form {
                display: grid;
                gap: var(--s4);
            }
            .me-form .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .me-form .form-foot {
                margin-top: 0;
            }
            @media (min-width: 481px) {
                .me-form .form-grid {

        <script>
            (function () {
                "use strict";

                const KEY = "nutrition-dash-token";
                const THEME_KEY = "nutrition-dash-theme";
                const RANGE_KEY = "nutrition-dash-range";
                const TABS = ["today", "trends", "body", "meals"];
                // 7 days → daily bars, 30 → weekly, a year → monthly (the
                // server's groupDays). 90 was dropped (§0c).
                const RANGES = [
                    [7, "7 days"],
                    [30, "30 days"],
                    [365, "1 year"],
                ];

                let token = null;
                let data = null;
                let loading = false;
                let loadError = false;
                let active = "today";
                let range = 30;
                // Content is rebuilt when data changes; charts also redraw
                // on resize. Only the visible panel is ever painted.
                const contentDirty = {};
                const chartsDirty = {};
                // Set while the page (not the user) opens Body details, so
                // the auto-open does not count as the user's own toggle.
                let bodyBoxProgrammatic = false;

                /* ---------- storage (try/catch: private windows) ---------- */
                function store(k, v) {
                    try {
                        if (v === null) localStorage.removeItem(k);
                        else localStorage.setItem(k, v);
                    } catch (e) {}
                }
                function load(k) {
                    try {
                        return localStorage.getItem(k);
                    } catch (e) {
                        return null;
                    }
                }

                const $ = (id) => document.getElementById(id);

                /* ---------- formatting ---------- */
                const round = (n) => Math.round(n || 0);
                const fmt = (n) => round(n).toLocaleString();
                const MINUS = "−";
                function fmtSigned(n) {
                    const r = round(n);
                    return (
                        (r > 0 ? "+" : r < 0 ? MINUS : "") +
                        Math.abs(r).toLocaleString()
                    );
                }
                function fmtSignedDec(n, dp) {
                    const d = dp == null ? 1 : dp;
                    const v = Number(n.toFixed(d));
                    return (
                        (v > 0 ? "+" : v < 0 ? MINUS : "") +
                        Math.abs(v).toFixed(d)
                    );
                }
                // Parse YYYY-MM-DD as a local date. new Date("2026-09-16")
                // parses as UTC and can display as the previous day west of
                // Greenwich — which is exactly where this user is.
                function parseDay(iso) {
                    const p = iso.split("-");
                    return new Date(+p[0], +p[1] - 1, +p[2]);
                }
                const shortDay = (iso) =>
                    parseDay(iso).toLocaleDateString(undefined, {
                        month: "short",
                        day: "numeric",
                    });
                const longDay = (iso) =>
                    parseDay(iso).toLocaleDateString(undefined, {
                        weekday: "short",
                        month: "short",
                        day: "numeric",
                    });
                const dayDiff = (a, b) =>
                    Math.round((parseDay(b) - parseDay(a)) / 864e5);
                function esc(s) {
                    return String(s == null ? "" : s).replace(
                        /[&<>"']/g,
                        (c) =>
                            ({
                                "&": "&amp;",
                                "<": "&lt;",
                                ">": "&gt;",
                                '"': "&quot;",
                                "'": "&#39;",
                            })[c],
                    );
                }
                const toUnit = (g, unit) =>
                    unit === "lb" ? g / 453.59237 : g / 1000;
                const wfmt = (g, unit) => toUnit(g, unit).toFixed(1);

                /* Profile-timezone dates and times. An invalid zone falls
                   back to the browser's, rather than throwing mid-render. */
                function tzOpts(o) {
                    const tz = data && data.timezone;
                    if (!tz) return o;
                    try {
                        new Intl.DateTimeFormat(undefined, { timeZone: tz });
                        return Object.assign({ timeZone: tz }, o);
                    } catch (e) {
                        return o;
                    }
                }
                function localDate(iso) {
                    return new Intl.DateTimeFormat(
                        "en-CA",
                        tzOpts({
                            year: "numeric",
                            month: "2-digit",
                            day: "2-digit",
                        }),
                    ).format(new Date(iso));
                }
                function localTime(iso) {
                    return new Intl.DateTimeFormat(
                        undefined,
                        tzOpts({ hour: "2-digit", minute: "2-digit" }),
                    ).format(new Date(iso));
                }
                // "YYYY-MM-DDTHH:MM" in the PROFILE timezone, for a
                // datetime-local input. The server reads the same offset-less
                // string back in that zone (resolveWriteLoggedAt), so the
                // round trip never depends on the browser's own zone.
                function localInputValue(iso) {
                    const p = {};
                    new Intl.DateTimeFormat(
                        "en-CA",
                        tzOpts({
                            year: "numeric",
                            month: "2-digit",
                            day: "2-digit",
                            hour: "2-digit",
                            minute: "2-digit",
                            hourCycle: "h23",
                        }),
                    )
                        .formatToParts(iso ? new Date(iso) : new Date())
                        .forEach(function (x) {
                            p[x.type] = x.value;
                        });
                    return (
                        p.year +
                        "-" +
                        p.month +
                        "-" +
                        p.day +
                        "T" +
                        p.hour +
                        ":" +
                        p.minute
                    );
                }
                // A failed write's message: the server's sentence, else ours.
                function writeJson(method, url, body) {
                    return fetch(url, {
                        method: method,
                        headers: {
                            Authorization: "Bearer " + token,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(body),
                    }).then(function (r) {
                        return r
                            .json()
                            .catch(function () {
                                return {};
                            })
                            .then(function (b) {
                                if (r.status === 401) {
                                    signOut();
                                    throw new Error("unauthorized");
                                }
                                return { ok: r.ok, status: r.status, body: b };
                            });
                    });
                }

                /* ---------- svg ---------- */
                function svgEl(tag, attrs) {
                    const e = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        tag,
                    );
                    for (const k in attrs)
                        if (attrs[k] !== null && attrs[k] !== undefined)
                            e.setAttribute(k, attrs[k]);
                    return e;
                }
                function svgText(svg, x, y, txt, cls, anchor) {
                    const t = svgEl("text", {
                        x: x,
                        y: y,
                        class: cls || "ax",
                        "text-anchor": anchor || "middle",
                    });
                    t.textContent = txt;
                    svg.appendChild(t);
                    return t;
                }
                // Bar with only its top corners rounded, so the mark stays
                // anchored to the baseline instead of floating on a pill.
                function barPath(x, y, w, h, r) {
                    if (h <= 0) return "";
                    r = Math.max(0, Math.min(r, w / 2, h));
                    return (
                        "M" +
                        x +
                        "," +
                        (y + h) +
                        "V" +
                        (y + r) +
                        "a" +
                        r +
                        "," +
                        r +
                        " 0 0 1 " +
                        r +
                        "," +
                        -r +
                        "h" +
                        (w - 2 * r) +
                        "a" +
                        r +
                        "," +
                        r +
                        " 0 0 1 " +
                        r +
                        "," +
                        r +
                        "V" +
                        (y + h) +
                        "Z"
                    );
                }
                const rectPath = (x, y, w, h) =>
                    h <= 0
                        ? ""
                        : "M" +
                          x +
                          "," +
                          y +
                          "h" +
                          w +
                          "v" +
                          h +
                          "h" +
                          -w +
                          "Z";
                // Axis max as `ticks` steps of a round size (1, 1.5, 2, …
                // × 10ⁿ), so every gridline label is a number people use
                // and the headroom stays under ~30%.
                function tickMax(peak, ticks) {
                    const raw = Math.max(peak, 1) / ticks;
                    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
                    for (const s of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10])
                        if (s * mag >= raw) return s * mag * ticks;
                    return 10 * mag * ticks;
                }
                function niceMax(v) {
                    if (v <= 0) return 10;
                    const mag = Math.pow(10, Math.floor(Math.log10(v)));
                    const steps = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10];
                    for (const s of steps) if (s * mag >= v) return s * mag;
                    return 10 * mag;
                }
                function legend(items) {
                    // items: [shape, swatch class / svg, label]
                    return (
                        '<ul class="legend">' +
                        items
                            .map(function (it) {
                                return "<li>" + it[0] + esc(it[1]) + "</li>";
                            })
                            .join("") +
                        "</ul>"
                    );
                }
                const LG = {
                    bar: (cls) =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" class="' +
                        cls +
                        '"/></svg>',
                    hatch: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" class="m-over"/></svg>',
                    line: (dashed) =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="' +
                        (dashed ? "m-target" : "goal-line") +
                        '"/></svg>',
                    ring: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" class="m-burn"/></svg>',
                    rest: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="m-rest"/></svg>',
                    active: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12" class="m-active"/></svg>',
                    dotline: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="m-wline"/><circle cx="7" cy="7" r="3.5" class="m-wdot"/></svg>',
                };

                /* ---------- axis layout ---------- */
                // Geist Mono at 12px is 7.2px per character.
                const MONO_CH = 7.2;
                const PAD = { t: 16, r: 12, b: 28, l: 44 };
                // Y gutter sized to the widest tick label.
                const gutter = (labels) =>
                    Math.ceil(
                        Math.max.apply(
                            null,
                            labels.map((l) => String(l).length),
                        ) *
                            MONO_CH +
                            8,
                    );
                // floor(plotW / (chars × 7.2 + 16)) labels at most, evenly
                // picked, always the first and the last.
                function xLabelIdx(n, plotW, chars) {
                    const max = Math.max(
                        2,
                        Math.floor(plotW / ((chars || 6) * MONO_CH + 16)),
                    );
                    if (n <= max) return [...Array(n).keys()];
                    const out = [];
                    for (let k = 0; k < max; k++)
                        out.push(Math.round((k * (n - 1)) / (max - 1)));
                    return out.filter((v, i) => out.indexOf(v) === i);
                }
                function bandLayout(n, plotW) {
                    const bw = plotW / n;
                    const gap = bw >= 5 ? Math.min(2, bw * 0.18) : 0;
                    const barW = Math.max(1, Math.min(bw - gap, 48));
                    return { bw: bw, barW: barW };
                }

                /* ---------- tooltip / inspect ---------- */
                const tip = $("tip");
                const live = $("live");
                let current = null; // { svg, clear }

                function tipContent(title, rows) {
                    // rows: [swatchClass|null, label, value, strong?]
                    const html =
                        '<div class="t-date">' +
                        esc(title) +
                        "</div>" +
                        rows
                            .map(function (r) {
                                return (
                                    '<div class="row' +
                                    (r[3] ? " strong" : "") +
                                    '"><span>' +
                                    (r[0]
                                        ? '<i class="sw ' + r[0] + '"></i>'
                                        : "") +
                                    esc(r[1]) +
                                    "</span><b>" +
                                    esc(r[2]) +
                                    "</b></div>"
                                );
                            })
                            .join("");
                    const text =
                        title +
                        ". " +
                        rows
                            .map(function (r) {
                                return r[1] + " " + r[2];
                            })
                            .join(", ") +
                        ".";
                    return { html: html, text: text };
                }
                function placeTip(html, x, y) {
                    tip.innerHTML = html;
                    tip.hidden = false;
                    const r = tip.getBoundingClientRect();
                    let left = x - r.width / 2;
                    left = Math.max(
                        8,
                        Math.min(innerWidth - r.width - 8, left),
                    );
                    let top = y - r.height - 12;
                    if (top < 8) top = y + 16;
                    if (top + r.height > innerHeight - 8)
                        top = Math.max(8, innerHeight - r.height - 8);
                    tip.style.left = left + "px";
                    tip.style.top = top + "px";
                    requestAnimationFrame(function () {
                        tip.classList.add("on");
                    });
                }
                function hideTip() {
                    tip.classList.remove("on");
                    tip.hidden = true;
                }
                function clearInspect() {
                    if (current) current.clear();
                    current = null;
                    hideTip();
                }

                /**
                 * Pointer + keyboard inspection for one chart. cols:
                 * [{x, html, text}] in svg pixels; top/bottom bound the
                 * guide. Mouse hovers; touch/pen pins the column with a
                 * guide; arrows step it, mirrored to the live region.
                 */
                function inspect(svg, cols, top, bottom) {
                    if (!cols.length) return;
                    let idx = -1;
                    let pinned = false;
                    const guide = svgEl("line", {
                        class: "guide",
                        x1: -10,
                        x2: -10,
                        y1: top,
                        y2: bottom,
                    });
                    guide.style.display = "none";
                    svg.appendChild(guide);
                    function colAt(clientX) {
                        const x = clientX - svg.getBoundingClientRect().left;
                        let best = 0;
                        let bd = Infinity;
                        cols.forEach(function (c, i) {
                            const d = Math.abs(c.x - x);
                            if (d < bd) {
                                bd = d;
                                best = i;
                            }
                        });
                        return best;
                    }
                    const self = {
                        svg: svg,
                        clear: function () {
                            idx = -1;
                            pinned = false;
                            guide.style.display = "none";
                        },
                    };
                    function anchorShow(i) {
                        idx = i;
                        const c = cols[i];
                        guide.setAttribute("x1", c.x);
                        guide.setAttribute("x2", c.x);
                        guide.style.display = "";
                        const r = svg.getBoundingClientRect();
                        if (current && current !== self) current.clear();
                        current = self;
                        placeTip(c.html, r.left + c.x, r.top + top);
                    }
                    svg.addEventListener("pointermove", function (ev) {
                        if (ev.pointerType !== "mouse" || pinned) return;
                        const i = colAt(ev.clientX);
                        idx = i;
                        if (current && current !== self) current.clear();
                        current = self;
                        guide.style.display = "none";
                        placeTip(cols[i].html, ev.clientX, ev.clientY - 4);
                    });
                    svg.addEventListener("pointerleave", function (ev) {
                        if (
                            ev.pointerType === "mouse" &&
                            !pinned &&
                            current === self
                        )
                            clearInspect();
                    });
                    svg.addEventListener("pointerdown", function (ev) {
                        if (ev.pointerType === "mouse") return;
                        ev.stopPropagation();
                        pinned = true;
                        anchorShow(colAt(ev.clientX));
                    });
                    svg.addEventListener("keydown", function (ev) {
                        let i = idx;
                        if (ev.key === "ArrowRight")
                            i = i < 0 ? 0 : Math.min(cols.length - 1, i + 1);
                        else if (ev.key === "ArrowLeft")
                            i = i < 0 ? cols.length - 1 : Math.max(0, i - 1);
                        else if (ev.key === "Home") i = 0;
                        else if (ev.key === "End") i = cols.length - 1;
                        else if (ev.key === "Escape") {
                            if (current === self) clearInspect();
                            return;
                        } else return;
                        ev.preventDefault();
                        pinned = true;
                        anchorShow(i);
                        live.textContent = cols[i].text;
                    });
                    svg.addEventListener("blur", function () {
                        if (current === self) clearInspect();
                    });
                }
                document.addEventListener("pointerdown", function (ev) {
                    if (current && !current.svg.contains(ev.target))
                        clearInspect();
                });
                document.addEventListener("keydown", function (ev) {
                    if (ev.key === "Escape" && current) clearInspect();
                });
                addEventListener(
                    "scroll",
                    function () {
                        if (current) clearInspect();
                        document.body.classList.toggle("scrolled", scrollY > 4);
                        const room =
                            document.documentElement.scrollHeight - innerHeight;
                        document.body.style.setProperty(
                            "--progress",
                            room > 0 ? Math.min(1, scrollY / room) : 0,
                        );
                    },
                    { passive: true },
                );

                function chartSvg(host, h, label) {
                    const w = Math.floor(host.clientWidth);
                    host.textContent = "";
                    const svg = svgEl("svg", {
                        class: "chart",
                        width: w,
                        height: h,
                        viewBox: "0 0 " + w + " " + h,
                        role: "img",
                        tabindex: 0,
                        "aria-label": label,
                    });

                    return { svg: svg, w: w, h: h };
                }
                const isDesktop = () => innerWidth >= 1024;

                /* ---------- theme ---------- */
                const mq = matchMedia("(prefers-color-scheme: dark)");
                function isDark() {
                    const cur =
                        document.documentElement.getAttribute("data-theme");
                    return cur === "dark" || (!cur && mq.matches);
                }
                function syncThemeBtn() {
                    const dark = isDark();
                    $("theme-btn").setAttribute(

                        dark ? "Switch to light theme" : "Switch to dark theme",

                    // would only set an expando, so toggle the attribute.
                    $("theme-btn")
                        .querySelector(".i-moon")
                        .toggleAttribute("hidden", dark);

                        .querySelector(".i-sun")

                $("theme-btn").addEventListener("click", function () {
                    const next = isDark() ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", next);

                    mq.addEventListener("change", syncThemeBtn);
                syncThemeBtn();

                /* ---------- tabs ---------- */
                const tabBtns = TABS.map((t) => $("tab-" + t));
                function selectTab(name, opts) {
                    opts = opts || {};
                    if (TABS.indexOf(name) < 0) name = "today";
                    const changed = name !== active;
                    active = name;
                    clearInspect();
                    TABS.forEach(function (t) {
                        const on = t === name;
                        const b = $("tab-" + t);
                        b.setAttribute("aria-selected", on ? "true" : "false");
                        b.tabIndex = on ? 0 : -1;

                    });

                            $("main").getBoundingClientRect().top +

                tabBtns.forEach(function (b, i) {
                    b.addEventListener("click", function () {

                    });
                    b.addEventListener("keydown", function (ev) {
                        let j = -1;
                        if (ev.key === "ArrowRight") j = (i + 1) % TABS.length;

                            j = (i - 1 + TABS.length) % TABS.length;

                        else if (ev.key === "End") j = TABS.length - 1;

                    selectTab(location.hash.slice(1), { fromHash: true });
                });
                addEventListener("popstate", function () {
                    selectTab(location.hash.slice(1) || "today", {
                        fromHash: true,
                    });
                });

                /* ---------- range control (Trends + Meals) ---------- */
                function renderRangeHeads() {
                    const label = data
                        ? esc(shortDay(data.startDate)) +
                          " – " +
                          esc(shortDay(data.endDate)) +
                          "<small>" +
                          esc(
                              RANGES.filter((r) => r[0] === range)[0][1] +
                                  " · " +
                                  data.timezone,
                          ) +
                          "</small>"
                        : "&nbsp;<small>&nbsp;</small>";

                    const fe = document.activeElement;
                    const focusDays =
                        fe && fe.closest && fe.closest(".seg") ? range : null;

                        .querySelectorAll("[data-range-head]")
                        .forEach(function (h) {
                            h.innerHTML =
                                '<p class="range-label">' +
                                label +
                                '</p><div class="seg" role="group" aria-label="Date range"' +
                                (loading ? ' aria-disabled="true"' : "") +
                                ">" +
                                RANGES.map(function (r) {
                                    const on = r[0] === range;

                                        '<button type="button" data-days="' +
                                        r[0] +
                                        '" aria-pressed="' +
                                        on +
                                        '">' +
                                        r[1] +

                                            ? '<span class="spin" aria-hidden="true"></span>'

                                        "</button>"

                }
                document.addEventListener("click", function (ev) {
                    const b =
                        ev.target.closest && ev.target.closest(".seg button");
                    if (!b || loading) return;
                    const n = +b.dataset.days;
                    if (n === range) return;
                    range = n;
                    store(RANGE_KEY, String(n));
                    refresh();
                });

                /* ---------- painting ---------- */
                function markDirty() {
                    TABS.forEach(function (t) {
                        contentDirty[t] = true;
                        chartsDirty[t] = true;
                    });
                }
                const RENDER = {};
                const CHARTS = {};
                // Skeletons mirror the new layout: a Facts panel outline
                // with its ruled bars, then rule + title + chart blocks.
                const SK_FACTS =
                    '<div class="sk-facts"><div class="sk" style="height:40px;width:55%"></div><div class="sk-bar10"></div><div class="sk" style="height:64px"></div><div class="sk-bar5"></div><div class="sk" style="height:18px"></div><div class="sk" style="height:18px"></div><div class="sk" style="height:18px"></div><div class="sk-bar10"></div><div class="sk" style="height:18px"></div><div class="sk" style="height:18px"></div></div>';
                const SK_SEC = (h) =>
                    '<div class="sk-sec"><div class="sk-rule"></div><div class="sk" style="height:12px;width:90px"></div><div class="sk" style="height:26px;width:45%"></div><div class="sk" style="height:' +
                    h +
                    'px"></div></div>';
                const SKELETON = {
                    today:
                        '<div class="skel today-grid"><div class="col">' +
                        SK_FACTS +
                        '</div><div class="col">' +
                        SK_SEC(220) +
                        SK_SEC(160) +
                        "</div></div>",
                    trends:
                        '<div class="skel"><div class="sk" style="height:112px;border-radius:22px"></div>' +
                        SK_SEC(280) +
                        SK_SEC(180) +
                        "</div>",
                    body:
                        '<div class="skel body-grid">' +
                        SK_FACTS +
                        SK_SEC(260) +
                        "</div>",
                    meals:
                        '<div class="skel">' +
                        SK_SEC(120) +
                        SK_SEC(120) +
                        "</div>",
                };
                // First render after data, and every tab switch, plays the
                // reveal (blocks rise, rules draw, bars grow). A refetch (a
                // save, a range change) never does.
                const revealNext = {};
                let revealTimer = 0;
                const reducedMotion = matchMedia(
                    "(prefers-reduced-motion: reduce)",
                );
                function reveal(body) {
                    body.querySelectorAll(".rv").forEach(function (el, i) {
                        el.style.setProperty("--rv", Math.min(i, 5));
                    });
                    body.classList.remove("reveal");
                    void body.offsetWidth;
                    body.classList.add("reveal");
                    clearTimeout(revealTimer);
                    revealTimer = setTimeout(function () {
                        body.classList.remove("reveal");
                    }, 900);
                    countUp(body);
                }
                // The hero figure counts up from 0 (Today only; never the
                // weight, which the page also reads back as text).
                function countUp(body) {
                    const el = body.querySelector("[data-count]");
                    if (!el || reducedMotion.matches) return;
                    const to = +el.dataset.count;
                    const t0 = performance.now();
                    (function step(now) {
                        const k = Math.min(1, (now - t0) / 600);
                        const e = 1 - Math.pow(1 - k, 3);
                        el.firstChild.nodeValue = fmt(to * e);
                        if (k < 1) requestAnimationFrame(step);
                    })(t0);
                }
                function paint() {
                    const t = active;

                    panel.classList.toggle("refreshing", loading && !!data);
                    if (!data) {
                        const b = $(t + "-body");
                        if (!b.querySelector(".skel") && !loadError)
                            b.innerHTML = SKELETON[t];
                        if (loadError) b.innerHTML = "";
                        return;
                    }
                    if (contentDirty[t]) {
                        RENDER[t]();
                        contentDirty[t] = false;
                        chartsDirty[t] = true;
                    }
                    if (chartsDirty[t] && CHARTS[t]) {
                        CHARTS[t]();
                        chartsDirty[t] = false;
                    }
                    if (revealNext[t]) {
                        revealNext[t] = false;
                        reveal($(t + "-body"));

                let rafId = 0;

                    const w = Math.round(entries[0].contentRect.width);
                    if (w === lastW) return;

                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(function () {
                        TABS.forEach(function (t) {
                            chartsDirty[t] = true;
                        });

                        if (data) paint();
                    });
                }).observe($("main"));

                /* ---------- error banner ---------- */
                function renderBanners() {
                    document
                        .querySelectorAll(".banner-slot")
                        .forEach(function (s) {
                            s.innerHTML = loadError
                                ? '<div class="banner" role="alert"><p>Could not load data. Is the server running?</p><button type="button" class="btn" data-retry>Retry</button><button type="button" class="icon-btn" data-dismiss aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
                                : "";
                        });

                document.addEventListener("click", function (ev) {
                    if (ev.target.closest("[data-retry]")) refresh();
                    else if (ev.target.closest("[data-dismiss]")) {
                        ev.target.closest(".banner").remove();
                    }
                });

                /* ================= shared pieces ================= */
                const isOver = (r) =>
                    !!r.goal_calories && r.calories > r.goal_calories;
                const anyLogged = (rows) => rows.some((r) => r.mealCount > 0);
                const hasBurn = () => data.daily.some((r) => r.burn_kcal);
                // Whether the Calories chart draws the active kcal as its own
                // segment. With weekly/monthly bars there are at most 12 per
                // chart, so the split always has room.
                const splitBurn = (rows) =>
                    rows.some((r) => r.bmr_kcal != null && r.active_kcal);
                function plural(n, one, many) {
                    return n + " " + (n === 1 ? one : many || one + "s");
                }
                // The calories tooltip, for a day or a weekly/monthly bar (the
                // normalized rows of dayRow / bucketRow). Every field of the
                // old tooltip, plus Over by, the planned deficit and the kcal
                // balance; a bar says it is a per-logged-day average and how
                // many days it covers.
                function calTip(r) {
                    const per = r.avg ? " (avg/day)" : "";
                    const rows = [
                        r.calories == null
                            ? ["s-kcal", "Eaten", "nothing logged", 1]
                            : [
                                  "s-kcal",
                                  "Eaten" + per,
                                  fmt(r.calories) + " kcal",
                                  1,
                              ],
                    ];
                    if (r.goal_calories)
                        rows.push([null, "Goal" + per, fmt(r.goal_calories)]);
                    if (r.active_kcal)
                        rows.push([
                            null,
                            "incl. active",
                            "+" + fmt(r.active_kcal),
                        ]);
                    if (isOver(r))
                        rows.push([
                            null,
                            "Over by",
                            fmt(r.calories - r.goal_calories) + " kcal",
                            1,
                        ]);
                    if (r.burn_kcal) {
                        if (r.bmr_kcal != null) {
                            rows.push(["s-rest", "Resting", fmt(r.bmr_kcal)]);
                            rows.push([
                                "s-active",
                                "Active",
                                "+" + fmt(r.active_kcal || 0),
                            ]);
                        }
                        rows.push([
                            "s-burn",
                            "Est. burn total",
                            fmt(r.burn_kcal),
                        ]);
                        // Burn = break-even, goal = target: the difference
                        // is the deficit the goal plans for.
                        if (r.goal_calories) {
                            const gap = r.burn_kcal - r.goal_calories;
                            rows.push([
                                null,
                                "Planned deficit: burn − goal",
                                fmtSigned(gap) + " kcal",
                            ]);
                        }
                    }
                    if (r.balance_kcal != null)
                        rows.push([
                            r.balance_kcal >= 0 ? "s-gain" : "s-loss",
                            "Balance" + per,
                            fmtSigned(r.balance_kcal) + " kcal",
                        ]);
                    if (r.balance_g != null)
                        rows.push([
                            null,
                            "Est. change" + per,
                            fmtSigned(r.balance_g) + " g",
                        ]);
                    rows.push(
                        r.avg
                            ? [null, "Logged", loggedText(r)]
                            : [null, "Meals", String(r.mealCount)],
                    );
                    if (r.burn_kcal && r.goal_calories)
                        rows.push([
                            null,
                            "Goal = your target; Est. burn = break-even (0 change). The gap is your planned deficit.",
                            "",
                        ]);
                    return tipContent(r.title, rows);
                }
                function mealTypeLabel(t) {
                    if (!t) return "Meal";
                    return t.charAt(0).toUpperCase() + t.slice(1);
                }
                const nz = (v) => (v == null ? "—" : fmt(v));
                function mealItem(m) {
                    return (
                        '<li><div class="m1"><span class="m-time">' +
                        esc(localTime(m.logged_at)) +
                        '</span><span class="m-type">' +
                        esc(mealTypeLabel(m.meal_type)) +
                        '</span><span class="m-kcal">' +
                        nz(m.calories) +
                        '<small>kcal</small></span></div><p class="m-desc">' +
                        esc(m.description) +
                        '</p><p class="m-mac"><span>P <b>' +
                        nz(m.protein_g) +
                        "</b></span><span>C <b>" +
                        nz(m.carbs_g) +
                        "</b></span><span>F <b>" +
                        nz(m.fat_g) +
                        "</b></span><span>Fib <b>" +
                        nz(m.fiber_g) +
                        "</b></span><span>Sug <b>" +
                        nz(m.sugar_g) +
                        "</b></span></p></li>"
                    );
                }
                // Calorie bars against each day's goal: --kcal up to the
                // goal, a hatched segment above it. Square, as printed; the
                // bars grow from the baseline on a panel's first render.
                const growDelay = (i) => "--d:" + Math.min(i * 12, 240) + "ms";
                function calBars(svg, rows, x0, plotW, yAt, base, lay) {
                    rows.forEach(function (r, i) {
                        if (r.calories <= 0) return;
                        const x = x0 + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const w = lay.barW;
                        const g = isOver(r) ? r.goal_calories : null;
                        const cls = (r.in_progress ? " dim" : "") + " grow";
                        const top = g == null ? r.calories : g;
                        svg.appendChild(
                            svgEl("path", {

                function goBodyDetails() {

                const ADD_BODY =
                    '<button type="button" class="link-btn" data-go="body-details">Add body details</button>';
                const ICO_UP =
                    '<svg class="ico-up" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9.5 9h-9z"/></svg>';
                // A section head: the 3px rule, a mono eyebrow, the title
                // (with an optional right slot), then the note and legend.
                function secHead(o) {
                    return (
                        '<div class="sec-head' +

                }
                // One label row of a Facts panel (inside a <dl>), with its
                // optional indented explanation as its own dt/dd group.
                function factsRow(label, value, sub, opts) {
                    opts = opts || {};
                    return (
                        '<div class="facts-row' +
                        (sub ? " has-sub" : "") +
                        (opts.cls ? " " + opts.cls : "") +

                }
                const unitSm = (u) => "<small>" + u + "</small>";

                /* ================= TODAY ================= */
                const RING = 112;
                const RING_R = 50;
                const RING_C = 2 * Math.PI * RING_R;

                function ringHtml(t) {
                    const eaten = t.calories || 0;
                    const goal = t.goal_calories;
                    const p = goal ? Math.min(eaten / goal, 1) : 0;
                    const overP =
                        goal && eaten > goal
                            ? Math.min((eaten - goal) / goal, 1)
                            : 0;
                    const label = goal
                        ? fmt(eaten) +
                          " of " +
                          fmt(goal) +
                          " kcal eaten today, " +
                          (eaten <= goal
                              ? fmt(goal - eaten) + " left"
                              : fmt(eaten - goal) + " over")
                        : fmt(eaten) + " kcal eaten today, no calorie goal set";
                    const c = RING / 2;
                    const arc = function (cls, frac) {
                        return frac > 0
                            ? '<circle class="' +
                                  cls +
                                  '" cx="' +
                                  c +
                                  '" cy="' +
                                  c +
                                  '" r="' +
                                  RING_R +
                                  '" stroke-dasharray="' +
                                  RING_C +
                                  '" stroke-dashoffset="' +
                                  RING_C +
                                  '" data-to="' +
                                  RING_C * (1 - frac) +
                                  '" transform="rotate(-90 ' +
                                  c +
                                  " " +
                                  c +
                                  ')"/>'
                            : "";
                    };
                    return (
                        '<div class="ring" role="img" aria-label="' +
                        esc(label) +
                        '"><svg viewBox="0 0 ' +
                        RING +
                        " " +
                        RING +
                        '" aria-hidden="true"><circle class="ring-track" cx="' +
                        c +
                        '" cy="' +
                        c +
                        '" r="' +
                        RING_R +
                        '"/>' +
                        arc("ring-arc", p) +
                        arc("ring-over", overP) +
                        '</svg><div class="ring-c" aria-hidden="true">' +
                        (goal ? Math.round((eaten / goal) * 100) + "%" : "—") +
                        "</div></div>"
                    );
                }
                // The Today label's rows: Goal, Left or Over, Est. burn and
                // Est. change, each with its explanation indented under it.
                function todayRows(t) {
                    const eaten = t.calories || 0;
                    const goal = t.goal_calories;
                    const kcal = unitSm("kcal");
                    let h = "";
                    if (goal) {
                        h += factsRow(
                            "Goal",
                            fmt(goal) + kcal,
                            t.active_kcal
                                ? fmt(goal - t.active_kcal) +
                                      " base + " +
                                      fmt(t.active_kcal) +
                                      " active"
                                : "",
                        );
                        h +=
                            eaten <= goal
                                ? factsRow("Left", fmt(goal - eaten) + kcal)
                                : factsRow(
                                      '<span class="over-lbl">' +
                                          ICO_UP +
                                          "Over</span>",
                                      fmt(eaten - goal) +
                                          kcal +
                                          '<span class="chip over">over</span><i class="sw hatch s-over" aria-hidden="true"></i>',
                                      "",
                                      { cls: "over" },
                                  );
                    }
                    h +=
                        t.burn_kcal != null
                            ? factsRow(
                                  "Est. burn",
                                  fmt(t.burn_kcal) + kcal,
                                  // The model's split, so the figure
                                  // explains itself: resting + active.
                                  t.bmr_kcal != null
                                      ? fmt(t.bmr_kcal) +
                                            " resting + " +
                                            fmt(t.active_kcal || 0) +
                                            " active · est."
                                      : "full day · estimate",
                              )
                            : factsRow("Est. burn", "—", ADD_BODY, {
                                  missing: true,
                              });
                    if (t.burn_kcal == null)
                        h += factsRow("Est. change", "—", ADD_BODY, {
                            missing: true,
                        });
                    else if (!t.mealCount || t.balance_g == null)
                        h += factsRow(
                            "Est. change",
                            "—",
                            "Nothing logged yet",
                            {
                                missing: true,
                            },
                        );
                    else
                        h += factsRow(
                            "Est. change",
                            '<i class="sw dot ' +
                                (t.balance_g >= 0 ? "s-gain" : "s-loss") +
                                '" aria-hidden="true"></i>' +
                                fmtSigned(t.balance_g) +
                                unitSm("g"),
                            "so far · estimate",
                        );
                    return '<dl class="facts-rows">' + h + "</dl>";
                }
                // The FDA "% Daily Value" rows: amount left, % of goal right,
                // a 4px track beneath. No goal: the amount only.
                function nutrientRow(name, sw, value, goal, unit) {
                    const v = value || 0;
                    const over = goal && v > goal;
                    return (
                        '<li class="nut"><span><span class="name">' +
                        name +
                        '</span><span class="amt"><b>' +
                        fmt(v) +
                        "</b>" +
                        (goal ? " / " + fmt(goal) : "") +
                        " " +
                        unit +
                        "</span></span>" +
                        (goal
                            ? '<span class="pct">' +
                              Math.round((v / goal) * 100) +
                              " %" +
                              (over
                                  ? '<span class="chip over">over</span>'
                                  : "") +
                              '</span><span class="track" aria-hidden="true"><i class="' +
                              sw +
                              '" data-w="' +
                              Math.min(100, (v / goal) * 100) +
                              '"></i></span>'
                            : "") +
                        "</li>"
                    );
                }
                function trioCell(label, figure, unit, foot, opts) {
                    opts = opts || {};
                    return (
                        '<div><div class="micro">' +
                        label +
                        '</div><div class="figure' +
                        (opts.missing ? " missing" : "") +
                        '">' +
                        (opts.sw
                            ? '<i class="sw dot ' +
                              opts.sw +
                              '" aria-hidden="true"></i>'
                            : "") +
                        figure +
                        (unit ? "<small>" + unit + "</small>" : "") +
                        '</div><div class="foot">' +
                        foot +

                }
                // Fixed 7-day figures (server-side `last7`), never the Trends range.
                function weekPairHtml() {
                    const w = data.last7;
                    if (!w) return "";
                    const signedCell = function (label, g, foot) {
                        return trioCell(label, fmtSigned(g), "g", foot, {
                            sw: g > 0 ? "s-gain" : g < 0 ? "s-loss" : null,

                    };
                    const LOG_WEIGHT =
                        '<button type="button" class="link-btn" data-go="log-weight">Log weight</button>';
                    const scale =
                        w.weight_change_g != null
                            ? signedCell(
                                  "Scale",

                                  "Scale",

                    const est =

                            ? signedCell(
                                  "Net est. change",

                                  "",

                    const balance =
                        w.est_net_kcal != null
                            ? trioCell(
                                  "Net kcal balance",
                                  fmtSigned(w.est_net_kcal),

                                  fmtSigned(w.est_avg_kcal) +

                                          w.est_net_kcal > 0

                                              : w.est_net_kcal < 0

                              )
                            : trioCell(
                                  "Net kcal balance",
                                  "—",
                                  "",
                                  w.has_burn

                    return (
                        '<div class="trio strip three" data-last7>' +

                    );
                }
                function todayMeals() {
                    return data.meals

                RENDER.today = function () {

                    $("today-body").innerHTML =
                        '<div class="today-grid"><div class="col">' +
                        '<section class="facts rv" aria-labelledby="h-today"><div class="facts-title"><h3 id="h-today">Today</h3><span class="tag">' +
                        plural(t.mealCount, "meal") +
                        '</span></div><p class="facts-serving"><span>Serving size <b>' +

                        '<div class="facts-cal today-cal">' +

                        fmt(eaten) +

                        '<ul class="facts-nut"><li class="nut-head"><span>Nutrients</span><span>% of goal</span></li>' +

                        '<section class="rv" aria-labelledby="h-meals-today">' +

                    // Sweep the ring and grow the nutrient tracks from zero.

                };

                CHARTS.today = function () {
                    const host = $("strip-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = data.daily.slice(-7).map(dayRow);
                    const logged = rows.filter((r) => r.mealCount > 0).length;
                    const c = chartSvg(
                        host,
                        innerWidth <= 480 ? 120 : 140,
                        "Calories for the last 7 days: " +
                            plural(logged, "day") +

                            rows.filter(isOver).length +
                            " over goal. Use the arrow keys to read each day.",
                    );
                    const svg = c.svg;
                    const top = 8;
                    const base = c.h - 24;
                    const peak = Math.max.apply(
                        null,
                        rows.map((r) =>
                            Math.max(r.calories, r.goal_calories || 0),
                        ),
                    );
                    const maxY = niceMax(Math.max(peak, 500) * 1.05);
                    const yAt = (v) => base - (v / maxY) * (base - top);
                    const lay = bandLayout(rows.length, c.w);
                    lay.barW = Math.min(lay.barW, 44);
                    calBars(svg, rows, 0, c.w, yAt, base, lay);
                    svg.appendChild(
                        svgEl("line", {

                    );
                    const cols = [];
                    rows.forEach(function (r, i) {

                                    x2: cx + half,

                /* ================= TRENDS ================= */
                function stat(label, figure, unit, foot, missing) {
                    return (
                        '<div class="stat' +
                        (missing ? " missing" : "") +
                        '"><div class="micro">' +
                        label +
                        '</div><div class="figure">' +
                        figure +
                        (unit ? "<small>" + unit + "</small>" : "") +
                        "</div>" +
                        (foot ? '<div class="foot">' + foot + "</div>" : "") +
                        "</div>"
                    );
                }
                // Weight deltas: grams under 1 kg, else one decimal in the
                // user's unit. Pounds stay pounds at every size.
                function wDelta(g, unit) {
                    if (unit !== "lb" && Math.abs(g) < 1000)
                        return fmtSigned(g) + " g";
                    return fmtSignedDec(toUnit(g, unit)) + " " + unit;
                }
                function trendsStats(rows) {
                    const logged = rows.filter((r) => r.mealCount > 0);
                    const complete = rows.filter((r) => !r.in_progress);
                    const withGoal = complete.filter((r) => r.goal_calories);
                    const done = complete.filter((r) => r.balance_g != null);
                    return {
                        logged: logged,
                        avgKcal: logged.length
                            ? logged.reduce((a, r) => a + r.calories, 0) /
                              logged.length
                            : null,
                        avgProtein: logged.length
                            ? logged.reduce((a, r) => a + r.protein_g, 0) /
                              logged.length
                            : null,
                        withGoal: withGoal,
                        overDays: withGoal.filter(isOver).length,
                        done: done,
                        net: done.reduce((a, r) => a + r.balance_g, 0),
                    };
                }
                function tilesHtml(rows, s) {
                    const g = data.goals;
                    const evs = data.estimateVsScale;
                    let html = "";
                    html += s.logged.length
                        ? stat(
                              "Daily average",
                              fmt(s.avgKcal),
                              "kcal",
                              s.logged.length +
                                  " of " +
                                  rows.length +
                                  " days logged",
                          )
                        : stat(
                              "Daily average",
                              "—",
                              "",
                              "0 of " + rows.length + " days logged",
                              true,
                          );
                    html += s.logged.length
                        ? stat(
                              "Avg protein",
                              fmt(s.avgProtein),
                              "g",
                              g && g.protein_g
                                  ? "goal " + fmt(g.protein_g) + " g"
                                  : "per logged day",
                          )
                        : stat(
                              "Avg protein",
                              "—",
                              "",
                              "Nothing logged yet",
                              true,
                          );
                    html += s.withGoal.length
                        ? stat(
                              "Over goal",
                              String(s.overDays),
                              "of " + plural(s.withGoal.length, "day"),
                              "complete days only",
                          )
                        : stat(
                              "Over goal",
                              "—",
                              "",
                              "No calorie goal set",
                              true,
                          );
                    html += !hasBurn()
                        ? stat("Net est. change", "—", "", ADD_BODY, true)
                        : s.done.length
                          ? stat(
                                "Net est. change",
                                '<i class="sw dot ' +
                                    (s.net >= 0 ? "s-gain" : "s-loss") +
                                    '" aria-hidden="true"></i>' +
                                    fmtSigned(s.net),
                                "g",
                                "over " +
                                    plural(s.done.length, "complete day") +
                                    " · estimate" +
                                    (evs && evs.actual_g != null
                                        ? ' · <span style="white-space:nowrap">scale: ' +
                                          wDelta(
                                              evs.actual_g,
                                              data.weightUnit,
                                          ) +
                                          "</span>"
                                        : ""),
                            )
                          : stat(
                                "Net est. change",
                                "—",
                                "",
                                "No complete logged days",
                                true,
                            );
                    return '<div class="strip four rv">' + html + "</div>";
                }
                function evsHtml() {
                    const e = data.estimateVsScale;
                    const unit = data.weightUnit;
                    const head = secHead({
                        wide: true,
                        eyebrow: "Calibration",
                        id: "h-evs",
                        title: 'Estimate vs reality <span class="est">(estimate)</span>',
                        note: "What the estimate predicted from eating vs estimated burn, next to what the scale did between your first and last weigh-in in this period. Over a few days the scale mostly shows water and glycogen, so only longer spans say much about the estimate.",
                    });
                    if (!e || e.status === "no_weighins")
                        return (
                            head +
                            '<p class="empty">Log your weight at least twice in this period to compare — ask Claude to log a weigh-in.</p>'
                        );
                    const bars = [];
                    if (e.est_logged_g != null)
                        bars.push([
                            "Estimated",
                            e.covered_days < e.span_days ? "logged days" : "",
                            e.est_logged_g,
                            "",
                        ]);
                    if (e.est_scaled_g != null)
                        bars.push([
                            "Estimated",
                            "all days, if unlogged were similar",
                            e.est_scaled_g,
                            "faint",
                        ]);
                    bars.push(["Scale", "actual weigh-ins", e.actual_g, ""]);
                    const max = Math.max.apply(
                        null,
                        bars.map((b) => Math.abs(b[2])).concat([100]),
                    );
                    const row = function (b) {
                        const pct = (Math.abs(b[2]) / max) * 50;
                        const pos =
                            b[2] >= 0
                                ? "left:50%;width:" + pct + "%"
                                : "right:50%;width:" + pct + "%";
                        return (
                            '<div class="evs-row ' +
                            b[3] +
                            '"><span class="evs-name">' +
                            b[0] +
                            (b[1] ? "<small>" + b[1] + "</small>" : "") +
                            '</span><span class="evs-track" aria-hidden="true"><i class="' +
                            (b[2] >= 0 ? "s-gain" : "s-loss") +
                            '" style="' +
                            pos +
                            '"></i></span><span class="evs-val">' +
                            wDelta(b[2], unit) +
                            "</span></div>"
                        );
                    };
                    const lim = wDelta(max, unit).replace(/^\+/, "");
                    const period =
                        '<p class="evs-period">Period: ' +
                        esc(shortDay(e.first_date)) +
                        " – " +
                        esc(shortDay(e.last_date)) +
                        " · " +
                        plural(e.span_days, "day") +
                        " · " +
                        e.covered_days +
                        " logged</p>";
                    let verdict;
                    if (e.status === "no_estimate")
                        verdict = hasBurn()
                            ? "No logged days between these weigh-ins, so there is no estimate to compare yet."
                            : "No estimate for these days yet. " +
                              ADD_BODY +
                              " to estimate your burn.";
                    else if (!e.calibrated)
                        verdict =
                            "Not enough logged days yet to judge the estimate (need 2+ weeks, 70% logged).";
                    else {
                        const est =
                            e.est_scaled_g != null
                                ? e.est_scaled_g
                                : e.est_logged_g;
                        const gap = Math.abs(e.gap_g);
                        const k = Math.abs(e.implied_kcal_per_day);
                        const losing = est <= 0 && e.actual_g <= 0;
                        let first;
                        if (gap < 50)
                            first =
                                "Your scale matched the estimate almost exactly";
                        else if (losing)
                            first =
                                "Your scale lost " +
                                wDelta(gap, unit).replace(/^\+/, "") +
                                (e.gap_g > 0 ? " less" : " more") +
                                " than estimated";
                        else
                            first =
                                "Your scale came in " +
                                wDelta(gap, unit).replace(/^\+/, "") +
                                (e.gap_g > 0 ? " higher" : " lower") +
                                " than estimated";
                        verdict =
                            first +
                            (k < 50
                                ? " — the burn estimate looks about right (within ~50 kcal/day)."
                                : " — the burn estimate looks ~" +
                                  fmt(Math.round(k / 10) * 10) +
                                  " kcal/day " +
                                  (e.implied_kcal_per_day > 0
                                      ? "high"
                                      : "low") +
                                  ".") +
                            ' <span class="aside">(It assumes your resting burn + your watch’s active kcal; a “low” reading means you burn more than that.)</span>';
                    }
                    return (
                        head +
                        '<div class="evs"><div class="evs-rows" role="img" aria-label="' +
                        esc(
                            bars
                                .map(
                                    (b) =>
                                        b[0] +
                                        (b[1] ? " (" + b[1] + ")" : "") +
                                        " " +
                                        wDelta(b[2], unit),
                                )
                                .join(", "),
                        ) +
                        '">' +
                        bars.map(row).join("") +
                        '<div class="evs-axis" aria-hidden="true"><span></span><span><span>' +
                        MINUS +
                        lim +
                        "</span><span>0</span><span>+" +
                        lim +
                        "</span></span><span></span></div></div>" +
                        period +
                        '<p class="evs-verdict">' +
                        verdict +
                        "</p></div>"
                    );
                }

                /* ---------- chart rows: days, or weekly / monthly bars ---------- */
                // The Trends charts plot `trendBuckets` (server-side, averages
                // per logged day) when the range is grouped, and the daily rows
                // for 7 days — one shape for both, so every chart and tooltip
                // reads the same fields.
                const gran = () => data.granularity || "day";
                function monthName(iso, long) {
                    const d = parseDay(iso);
                    return d.toLocaleDateString(
                        undefined,
                        long
                            ? { month: "long", year: "numeric" }
                            : d.getMonth() === 0
                              ? { month: "short", year: "2-digit" }
                              : { month: "short" },
                    );
                }
                // "Oct 14–20", or "Oct 28–Nov 3" across a month boundary.
                function spanLabel(start, end) {
                    const s = parseDay(start);
                    const e = parseDay(end);
                    if (s.getMonth() === e.getMonth())
                        return (
                            s.toLocaleDateString(undefined, {
                                month: "short",
                            }) +
                            " " +
                            s.getDate() +
                            "–" +
                            e.getDate()
                        );
                    return shortDay(start) + "–" + shortDay(end);
                }
                function dayRow(r) {
                    return {
                        date: r.date,
                        title:
                            longDay(r.date) +
                            (r.in_progress ? " · so far" : ""),
                        label: shortDay(r.date),
                        calories: r.calories,
                        protein_g: r.protein_g,
                        carbs_g: r.carbs_g,
                        fat_g: r.fat_g,
                        goal_calories: r.goal_calories,
                        goal_protein_g: r.goal_protein_g,
                        bmr_kcal: r.bmr_kcal,
                        active_kcal: r.active_kcal,
                        burn_kcal: r.burn_kcal,
                        balance_g: r.balance_g,
                        balance_kcal: r.balance_kcal,
                        in_progress: r.in_progress,
                        dim: r.in_progress,
                        avg: false,
                        mealCount: r.mealCount,
                        // The body-change band: today is never counted
                        // while it runs.
                        band_g: r.in_progress ? null : r.balance_g,
                        band_kcal: r.in_progress ? null : r.balance_kcal,
                        band_days: r.in_progress || r.balance_g == null ? 0 : 1,
                    };
                }
                function bucketRow(b) {
                    const week = gran() === "week";
                    return {
                        date: b.start,
                        title:
                            (week
                                ? shortDay(b.start) + " – " + shortDay(b.end)
                                : monthName(b.start, true)) +
                            (b.partial ? " · so far" : ""),
                        label: week
                            ? spanLabel(b.start, b.end)
                            : monthName(b.start, false),
                        start: b.start,
                        end: b.end,
                        calories: b.calories,
                        protein_g: b.protein_g,
                        carbs_g: b.carbs_g,
                        fat_g: b.fat_g,
                        goal_calories: b.goal_calories,
                        goal_protein_g: null,
                        bmr_kcal: b.bmr_kcal,
                        active_kcal: b.active_kcal,
                        burn_kcal: b.burn_kcal,
                        balance_g: b.balance_g,
                        balance_kcal: b.balance_kcal,
                        in_progress: b.partial,
                        dim: b.partial,
                        avg: true,
                        logged: b.logged_days,
                        days: b.days,
                        band_g: b.balance_g_sum,
                        band_kcal: b.balance_kcal_sum,
                        band_days: b.balance_days,
                    };
                }
                function chartRows() {
                    return gran() === "day"
                        ? data.daily.map(dayRow)
                        : (data.trendBuckets || []).map(bucketRow);
                }
                const loggedText = (r) =>
                    r.avg
                        ? r.logged + " of " + plural(r.days, "day") + " logged"
                        : String(r.mealCount);
                const perWord = () =>
                    gran() === "week"
                        ? "week"
                        : gran() === "month"
                          ? "month"
                          : "day";
                // "−420 kcal · −55 g"
                const kcalG = (kcal, g) =>
                    fmtSigned(kcal) + " kcal · " + fmtSigned(g) + " g";

                RENDER.trends = function () {
