                    var(--surface-2),
                    transparent
                );
                transform: translateX(-100%);
                animation: shimmer 1.4s ease-in-out infinite;
            }
            @keyframes shimmer {
                to {
                    transform: translateX(100%);
                }
            }
            .sk-facts {
                display: grid;
                gap: var(--s3);
                padding: var(--s5);
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--r-panel);
            }
            .sk-bar10 {
                height: 10px;
                background: var(--line);
            }
            .sk-bar5 {
                height: 5px;
                background: var(--line);
            }
            .sk-rule {
                height: 3px;
                background: var(--line);
                margin-bottom: var(--s3);
            }
            .sk-sec {
                display: grid;
                gap: var(--s3);
            }

            /* ================= Today ================= */
            .today-grid {
                display: grid;
                gap: var(--gap-section);
            }
            .today-grid > .col {
                display: grid;
                gap: var(--gap-section);
                align-content: start;
                min-width: 0;
            }
            @media (min-width: 481px) and (max-width: 1023px) {
                .today-grid .facts,
                .body-grid .facts {
                    max-width: 640px;
                }
            }
            @media (min-width: 1024px) {
                .today-grid {
                    grid-template-columns: 5fr 7fr;
                    column-gap: clamp(2rem, 4vw, 3.5rem);
                    align-items: start;
                }
            }
            .facts-cal.today-cal {
                display: grid;
                grid-template-columns: 112px minmax(0, 1fr);
                column-gap: var(--s4);
                row-gap: 0;
                align-items: end;
            }
            .facts-cal.today-cal .ring {
                grid-row: 1 / span 2;
            }
            .facts-cal.today-cal .label {
                margin: 0;
                padding: 0.2rem 0 0;
                align-self: start;
                justify-self: end;
                text-align: right;
            }
            .facts-cal.today-cal .fig-hero {
                justify-self: end;
            }
            .sw.hatch {
                width: 8px;
                height: 8px;
                margin-right: 0;
            }
            .strip .missing .figure {
                color: var(--ink-3);
            }
            .over-lbl {
                display: inline-flex;
                align-items: baseline;
            }
            @media (max-width: 480px) {
                .ring {
                    width: 80px;
                    height: 80px;
                }
                .ring circle {
                    stroke-width: 11.2px;
                }
                .ring-c {
                    font-size: 0.75rem;
                }
                .facts-cal.today-cal {
                    grid-template-columns: 80px minmax(0, 1fr);
                    column-gap: var(--s3);
                }
            }
            /* Today's meals: hairline rows, no boxes. */
            .meal-list {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .meal-list > li {
                padding: var(--s3) 0;
                border-bottom: 1px solid var(--line);
            }
            .meal-list > li:first-child {
                padding-top: 0;
            }
            .meal-list > li:last-child {
                border-bottom: 0;
            }
            .m1 {
                display: flex;
                align-items: baseline;
                gap: var(--s3);
            }
            .m-time {
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                color: var(--ink-3);
            }
            .m-type {
                flex: 1;
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-label);
                letter-spacing: -0.01em;
            }
            .m-kcal {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-row);
                letter-spacing: -0.02em;
                white-space: nowrap;
            }
            .m-kcal small {
                margin-left: 0.2em;
                font-family: var(--font-body);
                font-weight: 500;
                font-size: var(--fs-small);
                letter-spacing: 0;
                color: var(--ink-2);
            }
            .m-desc {
                margin-top: 2px;
                text-wrap: pretty;
                overflow-wrap: anywhere;
            }
            .m-mac {
                display: flex;
                flex-wrap: wrap;
                gap: 0 var(--s3);
                margin-top: 4px;
                font-size: var(--fs-small);
                color: var(--ink-3);
            }
            .m-mac b {
                color: var(--ink);
                font-weight: 500;
            }

            /* ================= Trends ================= */
            .evs {
                margin-top: var(--gap-block);
                padding: var(--s4) clamp(1rem, 3vw, 1.5rem) var(--s2);
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--r-panel);
            }
            .evs-rows {
                display: grid;
            }
            .evs-row {
                display: grid;
                grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) 6.5rem;
                align-items: center;
                gap: var(--s4);
                padding: 0.6rem 0;
                border-bottom: 1px solid var(--line);
            }
            .evs-name {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-label);
                letter-spacing: -0.01em;
                line-height: 1.2;
            }
            .evs-name small {
                display: block;
                font-family: var(--font-body);
                font-weight: 400;
                font-size: var(--fs-foot);
                letter-spacing: 0;
                color: var(--ink-2);
            }
            .evs-track {
                position: relative;
                height: 6px;
                background: var(--surface-2);
            }
            .evs-track::before {
                content: "";
                position: absolute;
                left: 50%;
                top: -5px;
                bottom: -5px;
                width: 1px;
                background: var(--rule);
            }
            .evs-track i {
                position: absolute;
                top: 0;
                bottom: 0;
            }
            .evs-row.faint .evs-track i {
                opacity: 0.45;
            }
            .evs-val {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-row);
                letter-spacing: -0.02em;
                text-align: right;
                white-space: nowrap;
            }
            .evs-axis {
                display: grid;
                grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) 6.5rem;
                gap: var(--s4);
                padding: 6px 0 var(--s2);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                color: var(--ink-3);
            }
            .evs-axis > span:nth-child(2) {
                display: flex;
                justify-content: space-between;
            }
            .evs-period {
                position: relative;
                padding: calc(5px + 0.6rem) 0 0;
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-2);
            }
            .evs-period::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 5px;
                background: var(--rule);
            }
            .evs-verdict {
                padding: var(--s2) 0 var(--s3);
                font-size: var(--fs-small);
                color: var(--ink);
                max-width: 72ch;
                text-wrap: pretty;
            }
            .evs-verdict .aside {
                color: var(--ink-2);
            }
            .evs-empty {
                padding: var(--s2) 0 var(--s4);
            }
            @media (max-width: 600px) {
                .evs-row,
                .evs-axis {
                    grid-template-columns: minmax(0, 1fr) auto;
                    gap: 6px var(--s3);
                }
                .evs-track {
                    grid-column: 1 / -1;
                    grid-row: 2;
                }
                .evs-axis > span:first-child,
                .evs-axis > span:last-child {
                    display: none;
                }
                .evs-axis > span:nth-child(2) {
                    grid-column: 1 / -1;
                }

            /* ================= Body ================= */
            .body-grid {
                display: grid;
                gap: var(--gap-section);
            }
            .body-grid > * {
                min-width: 0;
            }
            @media (min-width: 1024px) {
                .body-grid {
                    grid-template-columns: 5fr 7fr;
                    grid-template-areas:
                        "panel chart"
                        "goal chart"
                        "details chart"
                        "lab lab";
                    column-gap: clamp(2rem, 4vw, 3.5rem);
                    align-items: start;
                }
                .body-grid > .w-facts {
                    grid-area: panel;
                }
                .body-grid > .w-chart {
                    grid-area: chart;
                }
                .body-grid > .goal-sec {
                    grid-area: goal;
                }
                .body-grid > .details-sec {
                    grid-area: details;
                }
                .body-grid > .lab-sec {
                    grid-area: lab;
                }
            }
            .w-now .fig-hero b {
                font-weight: 800;
            }
            .w-empty {
                padding: var(--s4) 0 var(--s3);
            }
            details.body-box > summary {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--s4);
                min-height: 48px;
                padding-top: var(--s4);

                list-style: none;
                cursor: pointer;
                font-family: var(--font-display);
                font-weight: 700;
                font-variation-settings: "opsz" 96;
                font-size: var(--fs-h2);
                letter-spacing: -0.025em;
                line-height: 1.1;
            }
            details.body-box > summary::-webkit-details-marker {
                display: none;
            }
            details.body-box > summary::after {
                content: "+";
                flex: none;
                font-family: var(--font-mono);
                font-weight: 400;
                font-size: 1.5rem;
                line-height: 1;
                color: var(--ink-2);
                transition: transform 0.25s var(--ease-out);
            }
            details.body-box[open] > summary::after {
                transform: rotate(45deg);
            }
            details.body-box > summary:hover::after {
                color: var(--ink);
            }
            details.calc-box {
                margin-top: var(--s5);
            }
            details.calc-box > summary,
            .calc-box details > summary {
                cursor: pointer;
                list-style: none;
                font-family: var(--font-mono);
                font-size: var(--fs-micro, 0.75rem);
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--ink-2);
                padding: var(--s2) 0;
            }
            details.calc-box > summary {
                border-top: 1px solid var(--line);
                padding-top: var(--s3);
                color: var(--ink);
            }
            details.calc-box > summary::-webkit-details-marker,
            .calc-box details > summary::-webkit-details-marker {
                display: none;
            }
            details.calc-box > summary::before,
            .calc-box details > summary::before {
                content: "+ ";
            }
            details.calc-box[open] > summary::before,
            .calc-box details[open] > summary::before {
                content: "− ";
            }
            .calc-step {
                margin-top: var(--s4);
            }
            .calc-step h3 {
                margin: 0 0 var(--s2);
                font-size: 1rem;
                font-weight: 600;
            }
            .calc-step p,
            .calc-step ul {
                margin: var(--s2) 0 0;
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .calc-step ul {
                padding-left: 0;
                list-style: none;
            }
            .calc-step p:last-child {
                color: var(--ink-2);
            }
            .calc-f {
                font-family: var(--font-mono);
                font-size: 0.8rem;
                background: var(--surface-2);
                padding: 6px 8px;
                border-radius: 6px;
                overflow-x: auto;
                white-space: nowrap;
            }
            .calc-table-wrap {
                overflow-x: auto;
                max-width: 100%;
            }
            .calc-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.8rem;
                font-variant-numeric: tabular-nums;
            }
            .calc-table th,
            .calc-table td {
                padding: 4px 8px;
                border-bottom: 1px solid var(--line);
                text-align: right;
                white-space: nowrap;
            }
            .calc-table th:first-child,
            .calc-table td:first-child,
            .calc-table th:last-child,
            .calc-table td:last-child {
                text-align: left;
            }
            .calc-table th {
                font-family: var(--font-mono);
                font-weight: 400;
                color: var(--ink-2);
            }
            .calc-table tr.off td {
                color: var(--ink-2);
            }
            .calc-foot {
                margin-top: var(--s4);
                font-size: 0.8rem;
                color: var(--ink-2);
            }
            details.body-box > .note {
                margin: var(--s3) 0 var(--s4);
            }
            .body-form .form-foot {
                margin-top: var(--s4);
            }
            .lab-controls {
                display: grid;
                gap: var(--s4);
                margin: var(--s4) 0;
            }
            .lab-row {
                display: grid;
                grid-template-columns: minmax(12rem, 1fr) minmax(0, 2fr);
                gap: var(--s4);
                align-items: start;
            }
            .lab-row > label,
            .lab-label {
                font-weight: 600;
            }
            .lab-control {
                min-width: 0;
            }
            .lab-control .seg {
                flex-wrap: wrap;
            }
            .lab-control .seg button {
                min-width: 0;
            }
            .lab-help {
                margin: var(--s2) 0 0;
                color: var(--ink-2);
                font-size: 0.8rem;
                line-height: 1.45;
            }
            .lab-range {
                display: flex;
                align-items: center;
                gap: var(--s3);
            }
            .lab-range input {
                width: 100%;
                accent-color: var(--accent);
            }
            .lab-range output {
                min-width: 2.5em;
                font-family: var(--font-mono);
            }
            .lab-reset {
                border: 0;
                padding: 0;
                background: none;
                color: var(--accent-text);
                text-decoration: underline;
                cursor: pointer;
            }
            .lab-status {
                min-height: 1.2em;
                color: var(--ink-2);
                font-size: 0.8rem;
            }
            .lab-table .lab-today td {
                font-weight: 700;
            }
            @media (max-width: 600px) {
                .lab-row {
                    grid-template-columns: 1fr;
                    gap: var(--s2);
                }
            }

            /* ================= Meals ================= */
            .meals-table {
                width: 100%;
                border-collapse: collapse;
            }
            .meals-table td,
            .meals-table th {
                text-align: left;
                vertical-align: baseline;
            }
            .meals-table .n {
                text-align: right;
            }
            .meals-table thead th {
                padding: 0 var(--s3) var(--s2);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-3);
                white-space: nowrap;
            }
            .meals-table tr.day th {
                padding: var(--s3) var(--s3) var(--s2);
                border-top: 3px solid var(--rule);
                font-family: var(--font-mono);
                font-size: var(--fs-eyebrow);
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink);
            }
            .meals-table tr.day .tot {
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                letter-spacing: 0;
                text-transform: none;
                color: var(--ink-2);
                font-weight: 400;
                white-space: nowrap;
            }
            .meals-table tr.day .tot b {
                font-family: var(--font-display);
                font-weight: 700;
                font-size: var(--fs-row);
                letter-spacing: -0.02em;
                color: var(--ink);
            }
            .partial {
                margin-left: var(--s2);
                color: var(--warn);
            }
            .meals-table td.t {
                font-family: var(--font-mono);
                font-size: var(--fs-mono);
                color: var(--ink-3);
                white-space: nowrap;
            }
            .meals-table td.ty {
                font-weight: 600;
                white-space: nowrap;
            }
            .meals-table td.d {
                overflow-wrap: anywhere;
                text-wrap: pretty;
            }
            .meals-table td.k {
                font-weight: 600;
            }
            .meals-table td.mac {
                color: var(--ink-2);
            }
            .meals-table td.mac b {
                font-weight: 400;
            }
            .meals-foot {
                margin-top: var(--s4);
                font-size: var(--fs-foot);
                color: var(--ink-3);
            }
            .me-form {
                display: grid;
                gap: var(--s4);
            }
            .me-form .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .me-form .form-foot {
                margin-top: 0;
            }
            @media (min-width: 481px) {
                .me-form .form-grid {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }
            @media (min-width: 1024px) {
                .me-form .form-grid {
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                }
            }
            @media (min-width: 1024px) {
                .meals-table td {
                    padding: var(--s3);
                }
                .meals-table tr.day th {
                    padding-top: var(--s4);
                    background: var(--surface-2);
                }
                .meals-table tr.day .tot {
                    float: right;
                }
                .meals-table tr.meal td {
                    border-bottom: 1px solid var(--line);
                }
                .meals-table tr.meal.last td {
                    border-bottom: 0;
                }
                .meals-table tr.meal:hover td {
                    background: var(--surface-2);
                }
                .meals-table td.d {
                    max-width: 48ch;
                }
                .meals-table td.e {
                    width: 1%;
                    padding-top: 6px;
                    padding-bottom: 6px;
                    text-align: right;
                    vertical-align: middle;
                }
                .meals-table thead th {
                    border-bottom: 1px solid var(--rule);
                }
                .meals-table thead th:first-child,
                .meals-table td.t,
                .meals-table tr.day th {
                    padding-left: var(--s3);
                }
                .meals-table tr.edit-row td {
                    padding: var(--s2) var(--s3) var(--s5) var(--s4);
                    background: var(--surface-2);
                    box-shadow: inset 2px 0 var(--accent);
                    border-bottom: 1px solid var(--line);
                }
                .meals-table tr.meal.editing td {
                    background: var(--surface-2);
                    border-bottom-color: transparent;
                }
                .meals-table tr.meal.editing td:first-child {
                    box-shadow: inset 2px 0 var(--accent);
                }
            }
            @media (max-width: 1023px) {
                .meals-table,
                .meals-table tbody,
                .meals-table tr,
                .meals-table th,
                .meals-table td {
                    display: block;
                }
                .meals-table thead {
                    position: absolute;
                    width: 1px;
                    height: 1px;
                    overflow: hidden;
                    clip: rect(0 0 0 0);
                }
                .meals-table tbody + tbody {
                    margin-top: var(--s6);
                }
                .meals-table tr.day th {
                    padding: var(--s3) 0 var(--s2);
                    border-bottom: 1px solid var(--line);
                }
                .meals-table tr.day .tot {
                    display: block;
                    margin-top: 4px;
                    white-space: normal;
                }
                .meals-table tr.meal {
                    display: flex;
                    flex-wrap: wrap;
                    align-items: baseline;
                    gap: 2px var(--s3);
                    padding: var(--s3) 0;
                    border-bottom: 1px solid var(--line);
                }
                .meals-table tr.meal.last {
                    border-bottom: 0;
                }
                .meals-table tr.meal td {
                    padding: 0;
                }
                .meals-table td.t {
                    order: 1;
                }
                .meals-table td.ty {
                    order: 2;
                    flex: 1;
                    font-family: var(--font-display);
                    font-weight: 700;
                    font-size: var(--fs-label);
                    letter-spacing: -0.01em;
                }
                .meals-table td.k {
                    order: 3;
                    font-family: var(--font-display);
                    font-weight: 700;
                    font-size: var(--fs-row);
                    letter-spacing: -0.02em;
                }
                .meals-table td.k::after {
                    content: " kcal";
                    font-family: var(--font-body);
                    font-weight: 500;
                    font-size: var(--fs-small);
                    letter-spacing: 0;
                    color: var(--ink-2);
                }
                .meals-table td.d {
                    order: 4;
                    flex-basis: 100%;
                    min-width: 0;
                    margin: 2px 0 4px;
                }
                .meals-table td.mac {
                    order: 5;
                    font-size: var(--fs-small);
                    color: var(--ink-3);
                    text-align: left;
                }
                .meals-table td.mac::before {
                    content: attr(data-l) " ";
                }
                .meals-table td.mac b {
                    color: var(--ink);
                    font-weight: 500;
                }
                .meals-table td.e {
                    order: 6;
                    margin-left: auto;
                }
                .meals-table tr.meal.editing {
                    border-bottom: 0;
                }
                .meals-table tr.edit-row {
                    margin: 0 calc(-1 * var(--s3));
                    padding: var(--s4) var(--s3);
                    background: var(--surface-2);
                    box-shadow: inset 2px 0 var(--accent);
                    border-bottom: 1px solid var(--line);
                }
                .meals-table tr.edit-row td {
                    padding: 0;
                }
            }

            /* ---------- reduced motion: everything final, instantly ---------- */
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-delay: 0ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    transition-delay: 0ms !important;
                }
                .sk::after,
                .facts-live::before {
                    animation: none !important;
                }
            }
        </style>
    </head>

                                <rect

        <script>
            (function () {
                "use strict";

                const KEY = "nutrition-dash-token";
                const THEME_KEY = "nutrition-dash-theme";
                const RANGE_KEY = "nutrition-dash-range";
                const pref = (key, fallback) =>
                    load("nutrition-dash-" + key) || fallback;
                let macroSegments = pref("macro-segments", "on") === "on";
                let macroTotals = pref("macro-totals", "on") === "on";
                let caloriesAxis = pref("calories-axis", "full");
                let caloriesToday = pref("calories-today", "hidden");
                const TABS = ["today", "trends", "body", "meals"];
                // 7 days → daily bars, 30 → weekly, a year → monthly (the
                // server's groupDays). 90 was dropped (§0c).
                const RANGES = [

                    [30, "30 days"],
                    [365, "1 year"],
                ];

                let token = null;
                let data = null;

                // chart stays reachable with ?chart=bars.
                const barsView =

                let loadError = false;
                let active = "today";
                let range = 30;
                // Content is rebuilt when data changes; charts also redraw
                // on resize. Only the visible panel is ever painted.
                const contentDirty = {};

                // the auto-open does not count as the user's own toggle.
                let bodyBoxProgrammatic = false;

                /* ---------- storage (try/catch: private windows) ---------- */
                function store(k, v) {
                    try {
                        if (v === null) localStorage.removeItem(k);
                        else localStorage.setItem(k, v);
                    } catch (e) {}
                }
                function load(k) {
                    try {
                        return localStorage.getItem(k);
                    } catch (e) {
                        return null;
                    }
                }

                const $ = (id) => document.getElementById(id);

                /* ---------- formatting ---------- */
                const round = (n) => Math.round(n || 0);
                const fmt = (n) => round(n).toLocaleString();
                const MINUS = "−";
                function fmtSigned(n) {
                    const r = round(n);
                    return (
                        (r > 0 ? "+" : r < 0 ? MINUS : "") +
                        Math.abs(r).toLocaleString()
                    );
                }
                function fmtSignedDec(n, dp) {
                    const d = dp == null ? 1 : dp;
                    const v = Number(n.toFixed(d));
                    return (
                        (v > 0 ? "+" : v < 0 ? MINUS : "") +
                        Math.abs(v).toFixed(d)
                    );
                }
                // Parse YYYY-MM-DD as a local date. new Date("2026-09-16")
                // parses as UTC and can display as the previous day west of
                // Greenwich — which is exactly where this user is.
                function parseDay(iso) {
                    const p = iso.split("-");
                    return new Date(+p[0], +p[1] - 1, +p[2]);
                }
                const shortDay = (iso) =>
                    parseDay(iso).toLocaleDateString(undefined, {
                        month: "short",
                        day: "numeric",
                    });
                const longDay = (iso) =>
                    parseDay(iso).toLocaleDateString(undefined, {
                        weekday: "short",
                        month: "short",
                        day: "numeric",
                    });
                const dayDiff = (a, b) =>
                    Math.round((parseDay(b) - parseDay(a)) / 864e5);
                function esc(s) {
                    return String(s == null ? "" : s).replace(
                        /[&<>"']/g,
                        (c) =>
                            ({
                                "&": "&amp;",
                                "<": "&lt;",
                                ">": "&gt;",
                                '"': "&quot;",
                                "'": "&#39;",
                            })[c],
                    );
                }
                const toUnit = (g, unit) =>
                    unit === "lb" ? g / 453.59237 : g / 1000;
                const wfmt = (g, unit) => toUnit(g, unit).toFixed(1);

                /* Profile-timezone dates and times. An invalid zone falls
                   back to the browser's, rather than throwing mid-render. */
                function tzOpts(o) {
                    const tz = data && data.timezone;
                    if (!tz) return o;
                    try {
                        new Intl.DateTimeFormat(undefined, { timeZone: tz });
                        return Object.assign({ timeZone: tz }, o);
                    } catch (e) {
                        return o;
                    }
                }
                function localDate(iso) {
                    return new Intl.DateTimeFormat(
                        "en-CA",
                        tzOpts({
                            year: "numeric",
                            month: "2-digit",
                            day: "2-digit",
                        }),
                    ).format(new Date(iso));
                }
                function localTime(iso) {
                    return new Intl.DateTimeFormat(
                        undefined,
                        tzOpts({ hour: "2-digit", minute: "2-digit" }),
                    ).format(new Date(iso));
                }
                // "YYYY-MM-DDTHH:MM" in the PROFILE timezone, for a
                // datetime-local input. The server reads the same offset-less
                // string back in that zone (resolveWriteLoggedAt), so the
                // round trip never depends on the browser's own zone.
                function localInputValue(iso) {
                    const p = {};
                    new Intl.DateTimeFormat(
                        "en-CA",
                        tzOpts({
                            year: "numeric",
                            month: "2-digit",
                            day: "2-digit",
                            hour: "2-digit",
                            minute: "2-digit",
                            hourCycle: "h23",
                        }),
                    )
                        .formatToParts(iso ? new Date(iso) : new Date())
                        .forEach(function (x) {
                            p[x.type] = x.value;
                        });
                    return (
                        p.year +
                        "-" +
                        p.month +
                        "-" +
                        p.day +
                        "T" +
                        p.hour +
                        ":" +
                        p.minute
                    );
                }
                // A failed write's message: the server's sentence, else ours.
                function writeJson(method, url, body) {
                    return fetch(url, {
                        method: method,
                        headers: {
                            Authorization: "Bearer " + token,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(body),
                    }).then(function (r) {
                        return r
                            .json()
                            .catch(function () {
                                return {};
                            })
                            .then(function (b) {
                                if (r.status === 401) {
                                    signOut();
                                    throw new Error("unauthorized");
                                }
                                return { ok: r.ok, status: r.status, body: b };
                            });
                    });
                }

                /* ---------- svg ---------- */
                function svgEl(tag, attrs) {
                    const e = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        tag,
                    );
                    for (const k in attrs)
                        if (attrs[k] !== null && attrs[k] !== undefined)
                            e.setAttribute(k, attrs[k]);
                    return e;
                }
                function svgText(svg, x, y, txt, cls, anchor) {
                    const t = svgEl("text", {
                        x: x,
                        y: y,
                        class: cls || "ax",
                        "text-anchor": anchor || "middle",
                    });
                    t.textContent = txt;
                    svg.appendChild(t);
                    return t;
                }
                // Bar with only its top corners rounded, so the mark stays
                // anchored to the baseline instead of floating on a pill.
                function barPath(x, y, w, h, r) {
                    if (h <= 0) return "";
                    r = Math.max(0, Math.min(r, w / 2, h));
                    return (
                        "M" +
                        x +
                        "," +
                        (y + h) +
                        "V" +
                        (y + r) +
                        "a" +
                        r +
                        "," +
                        r +
                        " 0 0 1 " +
                        r +
                        "," +
                        -r +
                        "h" +
                        (w - 2 * r) +
                        "a" +
                        r +
                        "," +
                        r +
                        " 0 0 1 " +
                        r +
                        "," +
                        r +
                        "V" +
                        (y + h) +
                        "Z"
                    );
                }
                const rectPath = (x, y, w, h) =>
                    h <= 0
                        ? ""
                        : "M" +
                          x +
                          "," +
                          y +
                          "h" +
                          w +
                          "v" +
                          h +
                          "h" +
                          -w +
                          "Z";
                // Axis max as `ticks` steps of a round size (1, 1.5, 2, …
                // × 10ⁿ), so every gridline label is a number people use
                // and the headroom stays under ~30%.
                function tickMax(peak, ticks) {
                    const raw = Math.max(peak, 1) / ticks;
                    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
                    for (const s of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10])
                        if (s * mag >= raw) return s * mag * ticks;
                    return 10 * mag * ticks;
                }
                function niceMax(v) {
                    if (v <= 0) return 10;
                    const mag = Math.pow(10, Math.floor(Math.log10(v)));
                    const steps = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10];
                    for (const s of steps) if (s * mag >= v) return s * mag;
                    return 10 * mag;
                }
                function legend(items) {
                    // items: [shape, swatch class / svg, label]
                    return (
                        '<ul class="legend">' +
                        items
                            .map(function (it) {
                                return "<li>" + it[0] + esc(it[1]) + "</li>";
                            })
                            .join("") +
                        "</ul>"
                    );
                }
                const LG = {
                    bar: (cls) =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" class="' +
                        cls +
                        '"/></svg>',
                    hatch: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" class="m-over"/></svg>',
                    line: (dashed) =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="' +
                        (dashed ? "m-target" : "goal-line") +
                        '"/></svg>',
                    ring: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" class="m-burn"/></svg>',
                    rest: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="m-rest"/></svg>',
                    active: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12" class="m-active"/></svg>',
                    dotline: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="m-wline"/><circle cx="7" cy="7" r="3.5" class="m-wdot"/></svg>',
                };

                /* ---------- axis layout ---------- */
                // Geist Mono at 12px is 7.2px per character.
                const MONO_CH = 7.2;
                const PAD = { t: 16, r: 12, b: 28, l: 44 };
                // Y gutter sized to the widest tick label.
                const gutter = (labels) =>
                    Math.ceil(
                        Math.max.apply(
                            null,
                            labels.map((l) => String(l).length),
                        ) *
                            MONO_CH +
                            8,
                    );
                // floor(plotW / (chars × 7.2 + 16)) labels at most, evenly
                // picked, always the first and the last.
                function xLabelIdx(n, plotW, chars) {
                    const max = Math.max(
                        2,
                        Math.floor(plotW / ((chars || 6) * MONO_CH + 16)),
                    );
                    if (n <= max) return [...Array(n).keys()];
                    const out = [];
                    for (let k = 0; k < max; k++)
                        out.push(Math.round((k * (n - 1)) / (max - 1)));
                    return out.filter((v, i) => out.indexOf(v) === i);
                }
                function bandLayout(n, plotW) {
                    const bw = plotW / n;
                    const gap = bw >= 5 ? Math.min(2, bw * 0.18) : 0;
                    const barW = Math.max(1, Math.min(bw - gap, 48));
                    return { bw: bw, barW: barW };
                }

                /* ---------- tooltip / inspect ---------- */
                const tip = $("tip");
                const live = $("live");
                let current = null; // { svg, clear }

                function tipContent(title, rows) {
                    // rows: [swatchClass|null, label, value, strong?]
                    const html =
                        '<div class="t-date">' +
                        esc(title) +
                        "</div>" +
                        rows
                            .map(function (r) {
                                return (
                                    '<div class="row' +
                                    (r[3] ? " strong" : "") +
                                    '"><span>' +
                                    (r[0]
                                        ? '<i class="sw ' + r[0] + '"></i>'
                                        : "") +
                                    esc(r[1]) +
                                    "</span><b>" +
                                    esc(r[2]) +
                                    "</b></div>"
                                );
                            })
                            .join("");
                    const text =
                        title +
                        ". " +
                        rows
                            .map(function (r) {
                                return r[1] + " " + r[2];
                            })
                            .join(", ") +
                        ".";
                    return { html: html, text: text };
                }
                function placeTip(html, x, y) {
                    tip.innerHTML = html;
                    tip.hidden = false;
                    const r = tip.getBoundingClientRect();
                    let left = x - r.width / 2;
                    left = Math.max(
                        8,
                        Math.min(innerWidth - r.width - 8, left),
                    );
                    let top = y - r.height - 12;
                    if (top < 8) top = y + 16;
                    if (top + r.height > innerHeight - 8)
                        top = Math.max(8, innerHeight - r.height - 8);
                    tip.style.left = left + "px";
                    tip.style.top = top + "px";
                    requestAnimationFrame(function () {
                        tip.classList.add("on");
                    });
                }
                function hideTip() {
                    tip.classList.remove("on");
                    tip.hidden = true;
                }
                function clearInspect() {
                    if (current) current.clear();
                    current = null;
                    hideTip();
                }

                /**
                 * Pointer + keyboard inspection for one chart. cols:
                 * [{x, html, text}] in svg pixels; top/bottom bound the
                 * guide. Mouse hovers; touch/pen pins the column with a
                 * guide; arrows step it, mirrored to the live region.
                 */
                function inspect(svg, cols, top, bottom) {
                    if (!cols.length) return;
                    let idx = -1;
                    let pinned = false;
                    const guide = svgEl("line", {
                        class: "guide",
                        x1: -10,
                        x2: -10,
                        y1: top,
                        y2: bottom,
                    });
                    guide.style.display = "none";
                    svg.appendChild(guide);
                    function colAt(clientX) {
                        const x = clientX - svg.getBoundingClientRect().left;
                        let best = 0;
                        let bd = Infinity;
                        cols.forEach(function (c, i) {
                            const d = Math.abs(c.x - x);
                            if (d < bd) {
                                bd = d;
                                best = i;
                            }
                        });
                        return best;
                    }
                    const self = {
                        svg: svg,
                        clear: function () {
                            idx = -1;
                            pinned = false;
                            guide.style.display = "none";
                        },
                    };
                    function anchorShow(i) {
                        idx = i;
                        const c = cols[i];
                        guide.setAttribute("x1", c.x);
                        guide.setAttribute("x2", c.x);
                        guide.style.display = "";
                        const r = svg.getBoundingClientRect();
                        if (current && current !== self) current.clear();
                        current = self;
                        placeTip(c.html, r.left + c.x, r.top + top);
                    }
                    svg.addEventListener("pointermove", function (ev) {
                        if (ev.pointerType !== "mouse" || pinned) return;
                        const i = colAt(ev.clientX);
                        idx = i;
                        if (current && current !== self) current.clear();
                        current = self;
                        guide.style.display = "none";
                        placeTip(cols[i].html, ev.clientX, ev.clientY - 4);
                    });
                    svg.addEventListener("pointerleave", function (ev) {
                        if (
                            ev.pointerType === "mouse" &&
                            !pinned &&
                            current === self
                        )
                            clearInspect();
                    });
                    svg.addEventListener("pointerdown", function (ev) {
                        if (ev.pointerType === "mouse") return;
                        ev.stopPropagation();
                        pinned = true;
                        anchorShow(colAt(ev.clientX));
                    });
                    svg.addEventListener("keydown", function (ev) {
                        let i = idx;
                        if (ev.key === "ArrowRight")
                            i = i < 0 ? 0 : Math.min(cols.length - 1, i + 1);
                        else if (ev.key === "ArrowLeft")
                            i = i < 0 ? cols.length - 1 : Math.max(0, i - 1);
                        else if (ev.key === "Home") i = 0;
                        else if (ev.key === "End") i = cols.length - 1;
                        else if (ev.key === "Escape") {
                            if (current === self) clearInspect();
                            return;
                        } else return;
                        ev.preventDefault();
                        pinned = true;
                        anchorShow(i);
                        live.textContent = cols[i].text;
                    });
                    svg.addEventListener("blur", function () {
                        if (current === self) clearInspect();
                    });
                }
                document.addEventListener("pointerdown", function (ev) {
                    if (current && !current.svg.contains(ev.target))
                        clearInspect();
                });
                document.addEventListener("keydown", function (ev) {
                    if (ev.key === "Escape" && current) clearInspect();
                });
                addEventListener(
                    "scroll",
                    function () {
                        if (current) clearInspect();
                        document.body.classList.toggle("scrolled", scrollY > 4);
                        const room =
                            document.documentElement.scrollHeight - innerHeight;
                        document.body.style.setProperty(
                            "--progress",
                            room > 0 ? Math.min(1, scrollY / room) : 0,
                        );
                    },
                    { passive: true },
                );

                function chartSvg(host, h, label) {
                    const w = Math.floor(host.clientWidth);
                    host.textContent = "";
                    const svg = svgEl("svg", {
                        class: "chart",
                        width: w,
                        height: h,
                        viewBox: "0 0 " + w + " " + h,
                        role: "img",
                        tabindex: 0,
                        "aria-label": label,
                    });
                    host.appendChild(svg);
                    return { svg: svg, w: w, h: h };
                }
                const isDesktop = () => innerWidth >= 1024;

                /* ---------- theme ---------- */
                const mq = matchMedia("(prefers-color-scheme: dark)");
                function isDark() {
                    const cur =
                        document.documentElement.getAttribute("data-theme");
                    return cur === "dark" || (!cur && mq.matches);
                }
                function syncThemeBtn() {
                    const dark = isDark();
                    $("theme-btn").setAttribute(
                        "aria-label",
                        dark ? "Switch to light theme" : "Switch to dark theme",
                    );
                    // SVGElement has no `hidden` property; assigning one
                    // would only set an expando, so toggle the attribute.
                    $("theme-btn")
                        .querySelector(".i-moon")
                        .toggleAttribute("hidden", dark);
                    $("theme-btn")
                        .querySelector(".i-sun")
                        .toggleAttribute("hidden", !dark);
                }
                $("theme-btn").addEventListener("click", function () {

                // The stored calorie baseline, or null: with none, the server

                // The FDA "% Daily Value" rows: amount left, % of goal right,

                function nutrientRow(name, sw, value, goal, unit) {
                    const v = value || 0;

                    return (
                        '<li class="nut"><span><span class="name">' +
                        name +
                        '</span><span class="amt"><b>' +

                        "</b>" +
                        (goal ? " / " + fmt(goal) : "") +

                        unit +

                              sw +

                function setGoalStatus(text, cls) {
                    clearTimeout(goalStatusTimer);
                    goalStatus = { text: text, cls: cls || "" };

                        st.className = "b-status " + goalStatus.cls;

                    }

                function saveGoal(calories) {
                    const btn = $("g-save");
                    if (btn) btn.disabled = true;
                    setGoalStatus("Saving…");
                    fetch("/api/dashboard/goal", {
                        method: "POST",
                        headers: {
                            Authorization: "Bearer " + token,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ calories: calories }),
                    })
                        .then(function (r) {
                            return r
                                .json()
                                .catch(function () {
                                    return {};
                                })
                                .then(function (b) {
                                    return {
                                        ok: r.ok,
                                        status: r.status,
                                        body: b,
                                    };
                                });
                        })
                        .then(function (res) {
                            if (res.status === 401) return signOut();
                            if (!res.ok) {
                                if ($("g-save")) $("g-save").disabled = false;
                                setGoalStatus(
                                    (res.body && res.body.error_description) ||
                                        "Could not save.",
                                    "err",
                                );
                                return;
                            }
                            goalDraft = null;
                            goalStatus = { text: "Saved.", cls: "ok" };
                            goalStatusTimer = setTimeout(function () {
                                goalStatus = { text: "", cls: "" };
                                const st = $("g-status");
                                if (st) setGoalStatus("");
                            }, 4000);
                            refresh();
                        })
                        .catch(function () {
                            if ($("g-save")) $("g-save").disabled = false;
                            setGoalStatus("Could not reach the server.", "err");
                        });
                }
                function wireGoalForm() {
                    const box = $("goal-box");

                    input.value =
                        goalDraft != null

                            : goalCustom() == null
                              ? ""
                              : String(goalCustom());
                    box.addEventListener("toggle", function () {
                        goalOpen = box.open;
                    });
                    input.addEventListener("input", function () {
                        goalDraft = input.value;
                    });
                    $("goal-form").addEventListener("submit", function (ev) {
                        ev.preventDefault();
                        const v = input.value.trim();
                        saveGoal(v === "" ? null : Number(v));

                    if (reset)
                        reset.addEventListener("click", function () {
                            goalDraft = null;
                            input.value = "";

                CHARTS.today = function () {

                        host,

                    );

                        null,
                        rows.map((r) =>
                            Math.max(r.calories, r.goal_calories || 0),
                        ),
                    );
                    const maxY = niceMax(Math.max(peak, 500) * 1.05);
                    const yAt = (v) => base - (v / maxY) * (base - top);
                    const lay = bandLayout(rows.length, c.w);
                    lay.barW = Math.min(lay.barW, 44);
                    calBars(svg, rows, 0, c.w, yAt, base, lay);

                        svgEl("line", {
                            x1: 0,
                            x2: c.w,
                            y1: base + 0.5,
                            y2: base + 0.5,

                        "trend through " + e.weighin_days + " weigh-ins",
                        e.actual_g,
                        "",
                    ]);
                    const max = Math.max.apply(
                        null,
                        bars.map((b) => Math.abs(b[2])).concat([100]),
                    );
                    const row = function (b) {
                        const pct = (Math.abs(b[2]) / max) * 50;
                        const pos =
                            b[2] >= 0
                                ? "left:50%;width:" + pct + "%"
                                : "right:50%;width:" + pct + "%";
                        return (
                            '<div class="evs-row ' +
                            b[3] +
                            '"><span class="evs-name">' +
                            b[0] +
                            (b[1] ? "<small>" + b[1] + "</small>" : "") +
                            '</span><span class="evs-track" aria-hidden="true"><i class="' +
                            (b[2] >= 0 ? "s-gain" : "s-loss") +
                            '" style="' +
                            pos +
                            '"></i></span><span class="evs-val">' +
                            wDelta(b[2], unit) +
                            "</span></div>"
                        );
                    };
                    const lim = wDelta(max, unit).replace(/^\+/, "");
                    const period =
                        '<p class="evs-period">Period: ' +
                        esc(shortDay(e.first_date)) +
                        " – " +
                        esc(shortDay(e.last_date)) +
                        " · " +
                        plural(e.span_days, "day") +
                        " · " +
                        e.covered_days +
                        " counted</p>";
                    let verdict;
                    if (e.quality === "no_estimate")
                        verdict = hasBurn()
                            ? "Calibration needs counted days between weigh-ins (2+ entries and at least half your typical day, or marked on the Meals tab)."
                            : "No estimate for these days yet. " +
                              ADD_BODY +
                              " to estimate your burn.";
                    else if (!e.calibrated)
                        verdict =
                            e.quality === "too_noisy"
                                ? "Your weigh-ins scatter too much to calibrate yet (±" +
                                  fmt(e.uncertainty_kcal) +
                                  " kcal/day). Weigh in more often, at the same time of day."
                                : e.quality === "missing_bmr"
                                  ? "Calibration needs height, birth date and sex to calculate BMR."
                                  : e.quality === "no_estimate"
                                    ? "Calibration needs counted days between weigh-ins (2+ entries and at least half your typical day, or marked on the Meals tab)."
                                    : e.quality === "too_few_days"
                                      ? "Calibration needs 3+ weeks between first and last weigh-in, with 70% of those days counted."
                                      : "Calibration needs weigh-ins on at least 4 different days in the last 42 days.";
                    else {
                        const est =
                            e.est_scaled_g != null
                                ? e.est_scaled_g
                                : e.est_logged_g;
                        const gap = Math.abs(e.gap_g);
                        const k = Math.abs(e.implied_kcal_per_day);
                        const losing = est <= 0 && e.actual_g <= 0;
                        let first;
                        if (gap < 50)
                            first =
                                "Your scale matched the estimate almost exactly";
                        else if (losing)
                            first =
                                "Your scale lost " +
                                wDelta(gap, unit).replace(/^\+/, "") +
                                (e.gap_g > 0 ? " less" : " more") +
                                " than estimated";
                        else
                            first =
                                "Your scale came in " +
                                wDelta(gap, unit).replace(/^\+/, "") +
                                (e.gap_g > 0 ? " higher" : " lower") +
                                " than estimated";
                        verdict =
                            first +
                            (k < 50
                                ? " — the burn estimate looks about right (within ~50 kcal/day, ±" +
                                  fmt(e.uncertainty_kcal) +
                                  " kcal/day)."
                                : " — the burn estimate looks ~" +
                                  fmt(Math.round(k / 10) * 10) +
                                  " kcal/day (±" +
                                  fmt(e.uncertainty_kcal) +
                                  " kcal/day) " +
                                  (e.implied_kcal_per_day > 0
                                      ? "high"
                                      : "low") +
                                  ".") +
                            ' <span class="aside">(It assumes your resting burn + your watch’s active kcal + digestion (10% of what you eat); a “low” reading means you burn more than that.)</span>';
                    }
                    return (
                        head +
                        '<div class="evs"><div class="evs-rows" role="img" aria-label="' +
                        esc(
                            bars
                                .map(
                                    (b) =>
                                        b[0] +
                                        (b[1] ? " (" + b[1] + ")" : "") +
                                        " " +
                                        wDelta(b[2], unit),
                                )
                                .join(", "),
                        ) +
                        '">' +
                        bars.map(row).join("") +
                        '<div class="evs-axis" aria-hidden="true"><span></span><span><span>' +
                        MINUS +
                        lim +
                        "</span><span>0</span><span>+" +
                        lim +
                        "</span></span><span></span></div></div>" +
                        period +
                        '<p class="evs-verdict">' +
                        verdict +
                        "</p></div>"
                    );
                }

                /* ---------- chart rows: days, or weekly / monthly bars ---------- */
                // The Trends charts plot `trendBuckets` (server-side, averages
                // per logged day) when the range is grouped, and the daily rows
                // for 7 days — one shape for both, so every chart and tooltip
                // reads the same fields.
                const gran = () => data.granularity || "day";
                function monthName(iso, long) {
                    const d = parseDay(iso);
                    return d.toLocaleDateString(
                        undefined,
                        long
                            ? { month: "long", year: "numeric" }
                            : d.getMonth() === 0
                              ? { month: "short", year: "2-digit" }
                              : { month: "short" },
                    );
                }
                // "Oct 14–20", or "Oct 28–Nov 3" across a month boundary.
                function spanLabel(start, end) {
                    const s = parseDay(start);
                    const e = parseDay(end);
                    if (s.getMonth() === e.getMonth())
                        return (
                            s.toLocaleDateString(undefined, {
                                month: "short",
                            }) +
                            " " +
                            s.getDate() +
                            "–" +
                            e.getDate()
                        );
                    return shortDay(start) + "–" + shortDay(end);
                }
                function dayRow(r) {
                    return {
                        date: r.date,
                        title:
                            longDay(r.date) +
                            (r.in_progress ? " · so far" : ""),
                        label: shortDay(r.date),
                        calories: r.calories,
                        protein_g: r.protein_g,
                        carbs_g: r.carbs_g,
                        fat_g: r.fat_g,
                        goal_calories: r.goal_calories,
                        goal_protein_g: r.goal_protein_g,
                        bmr_kcal: r.bmr_kcal,
                        active_kcal: r.active_kcal,
                        burn_kcal: r.burn_kcal,
                        balance_g: r.balance_g,
                        balance_kcal: r.balance_kcal,
                        in_progress: r.in_progress,
                        dim: r.in_progress,
                        avg: false,
                        mealCount: r.mealCount,
                        // The body-change band: today is never counted
                        // while it runs.
                        band_g: r.in_progress ? null : r.balance_g,
                        band_kcal: r.in_progress ? null : r.balance_kcal,
                        band_days: r.in_progress || r.balance_g == null ? 0 : 1,
                    };
                }
                function bucketRow(b) {
                    const week = gran() === "week";
                    return {
                        date: b.start,
                        title:
                            (week
                                ? shortDay(b.start) + " – " + shortDay(b.end)
                                : monthName(b.start, true)) +
                            (b.partial ? " · so far" : ""),
                        label: week
                            ? spanLabel(b.start, b.end)
                            : monthName(b.start, false),
                        start: b.start,
                        end: b.end,
                        calories: b.calories,
                        protein_g: b.protein_g,
                        carbs_g: b.carbs_g,
                        fat_g: b.fat_g,
                        goal_calories: b.goal_calories,
                        goal_protein_g: null,
                        bmr_kcal: b.bmr_kcal,
                        active_kcal: b.active_kcal,
                        burn_kcal: b.burn_kcal,
                        balance_g: b.balance_g,
                        balance_kcal: b.balance_kcal,
                        in_progress: b.partial,
                        dim: b.partial,
                        avg: true,
                        logged: b.logged_days,
                        days: b.days,
                        band_g: b.balance_g_sum,
                        band_kcal: b.balance_kcal_sum,
                        band_days: b.balance_days,
                    };
                }
                function chartRows() {
                    return gran() === "day"
                        ? data.daily.map(dayRow)
                        : (data.trendBuckets || []).map(bucketRow);
                }
                const loggedText = (r) =>
                    r.avg
                        ? r.logged + " of " + plural(r.days, "day") + " logged"
                        : String(r.mealCount);
                const perWord = () =>
                    gran() === "week"
                        ? "week"
                        : gran() === "month"
                          ? "month"
                          : "day";
                // "−420 kcal · −55 g"
                const kcalG = (kcal, g) =>
                    fmtSigned(kcal) + " kcal · " + fmtSigned(g) + " g";

                RENDER.trends = function () {
                    const rows = data.daily;
                    const s = trendsStats(rows);
                    const any = anyLogged(rows);
                    const hasGoal = rows.some((r) => r.goal_calories);
                    const g = gran();
                    const emptyMsg =
                        '<p class="empty">Nothing logged in these ' +
                        rows.length +
                        " days.</p>";
                    const calLegend = legend(
                        [
                            [
                                LG.bar("m-kcal"),
                                g === "day"
                                    ? "Eaten"
                                    : "Eaten (avg per logged day)",

                        ]
                            .concat(
                                hasGoal
                                    ? [
                                          [LG.hatch(), "Over goal"],
                                          [LG.line(), "Goal = your target"],
                                      ]

                            .concat(

                                    ? [

                                                  : "Resting burn (changes with weight)",

                                          .concat(

                                                  ? [
                                                        [

                                                        ],

                                                  : [],

                                          .concat([
