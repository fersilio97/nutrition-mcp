<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <script>
            // Pre-paint theme: runs before any CSS parses, so a dark-mode
            // visitor never sees a light flash. localStorage can throw
            // (private window, blocked site data); the page works without it.
            (function () {
                try {
                    var t = localStorage.getItem("nutrition-dash-theme");
                    if (t === "light" || t === "dark")
                        document.documentElement.setAttribute("data-theme", t);
                } catch (e) {}
            })();
        </script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Your nutrition dashboard</title>
        <style>
            /* ================= tokens =================
               Contrast ratios for every pair are in
               docs/redesign/REQUIREMENTS.md §4.2. Series colours are
               graphics-only in light mode (never body text); every series
               label is ink/muted text beside a swatch. Over goal and
               gain/loss never rest on colour alone: a hatch + the word
               "over", and a sign + bar direction. */
            :root,
            :root[data-theme="light"] {
                color-scheme: light;
                --bg: #f3f7f4;
                --surface: #ffffff;
                --surface-2: #e8f0eb;
                --border: #d5e0d9;
                --control: #7b8c82;
                --grid: #e3ebe6;
                --ink: #0f1f18;
                --muted: #4a5d53;
                --subtle: #586960;
                --accent: #0a7255;
                --accent-ink: #ffffff;
                --accent-soft: #d9f0e5;
                --focus-ring: #1a66d1;
                --kcal: #d4570b;
                --protein: #7c3aed;
                --carbs: #16803a;
                --fat: #d6265f;
                --fiber: #0f7f78;
                --sugar: #5c7f0a;
                --water: #0a78b8;
                --burn: #2f5fd0;
                --over: #c4262e;
                --gain: #b45309;
                --loss: #1d64b8;
                --warn: #9a5b00;
                --shadow-card:
                    0 1px 2px rgb(15 31 24 / 0.05),
                    0 6px 20px -8px rgb(15 31 24 / 0.12);
                --over-tint: #f6d4d5;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --bg: #0a1310;
                    --surface: #111d18;
                    --surface-2: #182821;
                    --border: #263a31;
                    --control: #5d7468;
                    --grid: #1c2c25;
                    --ink: #e6f0ea;
                    --muted: #a6b8ae;
                    --subtle: #8fa298;
                    --accent: #3dd6a0;
                    --accent-ink: #04261b;
                    --accent-soft: #123a2c;
                    --focus-ring: #7fb2ff;
                    --kcal: #fb923c;
                    --protein: #b197fc;
                    --carbs: #4ade80;
                    --fat: #fb7199;
                    --fiber: #2dd4bf;
                    --sugar: #bef264;
                    --water: #38bdf8;
                    --burn: #7aa7ff;
                    --over: #ff6b6b;
                    --gain: #f6ad55;
                    --loss: #6cb4ff;
                    --warn: #f0b44c;
                    --shadow-card: none;
                    --over-tint: #4a1f22;
                }
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --bg: #0a1310;
                --surface: #111d18;
                --surface-2: #182821;
                --border: #263a31;
                --control: #5d7468;
                --grid: #1c2c25;
                --ink: #e6f0ea;
                --muted: #a6b8ae;
                --subtle: #8fa298;
                --accent: #3dd6a0;
                --accent-ink: #04261b;
                --accent-soft: #123a2c;
                --focus-ring: #7fb2ff;
                --kcal: #fb923c;
                --protein: #b197fc;
                --carbs: #4ade80;
                --fat: #fb7199;
                --fiber: #2dd4bf;
                --sugar: #bef264;
                --water: #38bdf8;
                --burn: #7aa7ff;
                --over: #ff6b6b;
                --gain: #f6ad55;
                --loss: #6cb4ff;
                --warn: #f0b44c;
                --shadow-card: none;
                --over-tint: #4a1f22;
            }

            :root {
                --t-hero: 40px;
                --t-figure: 26px;
                --t-title: 20px;
                --t-h2: 16px;
                --t-body: 15px;
                --t-small: 13px;
                --t-micro: 12px;
                --s1: 4px;
                --s2: 8px;
                --s3: 12px;
                --s4: 16px;
                --s5: 20px;
                --s6: 24px;
                --s8: 32px;
                --s12: 48px;
                --r-sm: 8px;
                --r-md: 14px;
                --r-lg: 20px;
                --r-pill: 999px;
                --gutter: 16px;
                --ease: cubic-bezier(0.22, 1, 0.36, 1);
            }
            @media (min-width: 481px) {
                :root {
                    --gutter: 24px;
                }
            }
            @media (min-width: 1024px) {
                :root {
                    --gutter: 32px;
                }
            }
            @media (max-width: 480px) {
                :root {
                    --t-hero: 34px;
                }
            }

            /* ================= base ================= */
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            html {
                -webkit-text-size-adjust: 100%;
            }
            body {
                background: var(--bg);
                color: var(--ink);
                font:
                    400 var(--t-body) / 1.5 system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    sans-serif;
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
                min-height: 100vh;
            }
            [hidden] {
                display: none !important;
            }
            button,
            input,
            select {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            :focus-visible {
                outline: 2px solid var(--focus-ring);
                outline-offset: 2px;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
            .num,
            .tab-nums {
                font-variant-numeric: tabular-nums;
            }

            /* ================= buttons ================= */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--s2);
                min-height: 44px;
                padding: 0 var(--s4);
                border-radius: var(--r-sm);
                border: 1px solid var(--control);
                background: var(--surface);
                font-weight: 600;
                font-size: 14px;
                transition:
                    background-color 0.12s linear,
                    transform 0.12s var(--ease);
            }
            .btn:hover {
                background: var(--surface-2);
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn.primary {
                background: var(--accent);
                color: var(--accent-ink);
                border-color: var(--accent);
            }
            .btn.primary:hover {
                background: color-mix(in srgb, var(--accent) 88%, var(--ink));
            }
            .btn:disabled {
                opacity: 0.6;
                cursor: default;
            }
            .icon-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--s2);
                min-width: 44px;
                height: 44px;
                padding: 0 var(--s2);
                border: 0;
                border-radius: var(--r-sm);
                background: transparent;
                color: var(--muted);
                font-size: 14px;
                font-weight: 600;
                transition:
                    background-color 0.12s linear,
                    transform 0.12s var(--ease);
            }
            .icon-btn:hover {
                background: var(--surface-2);
                color: var(--ink);
            }
            .icon-btn:active {
                transform: scale(0.98);
            }
            .icon-btn svg {
                width: 22px;
                height: 22px;
                flex: none;
            }
            .icon-btn .txt {
                display: none;
            }
            @media (min-width: 481px) {
                .icon-btn .txt {
                    display: inline;
                }
                #signout {
                    padding: 0 var(--s3);
                }
            }
            .link-btn {
                display: inline-flex;
                align-items: center;
                min-height: 44px;
                padding: 0 var(--s1);
                margin: -12px calc(-1 * var(--s1));
                border: 0;
                background: none;
                color: var(--accent);
                font-weight: 650;
                font-size: var(--t-small);
                text-decoration: underline;
                text-underline-offset: 3px;
                text-decoration-thickness: 1px;
            }
            .link-btn:hover {
                text-decoration-thickness: 2px;
            }

            /* ================= login ================= */
            .login-wrap {
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: max(var(--gutter), env(safe-area-inset-top))
                    max(var(--gutter), env(safe-area-inset-right))
                    max(var(--gutter), env(safe-area-inset-bottom))
                    max(var(--gutter), env(safe-area-inset-left));
            }
            .login {
                width: 100%;
                max-width: 380px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--r-lg);
                box-shadow: var(--shadow-card);
                padding: var(--s8) var(--s6);
            }
            .login .mark {
                width: 40px;
                height: 40px;
                border-radius: 12px;
                background: var(--accent-soft);
                color: var(--accent);
                display: grid;
                place-items: center;
                margin-bottom: var(--s4);
            }
            .login h1 {
                font-size: var(--t-title);
                line-height: 1.2;
                font-weight: 680;
                margin: 0 0 var(--s2);
            }
            .login p {
                margin: 0 0 var(--s6);
                color: var(--muted);
                font-size: var(--t-small);
            }
            .field {
                display: grid;
                gap: 6px;
                margin-bottom: var(--s4);
            }
            .field > span,
            label.field {
                font-size: var(--t-small);
                font-weight: 600;
                color: var(--ink);
            }
            .input {
                width: 100%;
                height: 44px;
                padding: 0 var(--s3);
                border: 1px solid var(--control);
                border-radius: var(--r-sm);
                background: var(--surface);
                font-size: 16px;
            }
            .login .btn {
                width: 100%;
                margin-top: var(--s2);
            }
            .err {
                color: var(--over);
                font-size: var(--t-small);
                font-weight: 600;
                min-height: 1.45em;
                margin-top: var(--s3);
            }

            /* ================= app chrome ================= */
            .app {
                max-width: 1120px;
                margin: 0 auto;
                padding: 0 max(var(--gutter), env(safe-area-inset-right))
                    max(var(--s12), env(safe-area-inset-bottom))
                    max(var(--gutter), env(safe-area-inset-left));
            }
            /* Mobile: the header scrolls away and only the tab bar sticks.
               display:contents lets the nav stick to the page rather than
               to this wrapper; at ≥1024 the wrapper becomes one sticky row. */
            .chrome {
                display: contents;
            }
            .top {
                display: flex;
                align-items: center;
                gap: var(--s2);
                padding: max(var(--s4), env(safe-area-inset-top)) 0 var(--s3);
            }
            .brand {
                flex: 1;
                min-width: 0;
            }
            .brand h1 {
                margin: 0;
                font-size: var(--t-title);
                line-height: 1.2;
                font-weight: 680;
                letter-spacing: -0.01em;
                display: flex;
                align-items: center;
                gap: var(--s2);
            }
            .brand h1 .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--accent);
                flex: none;
            }
            .sub {
                margin: 2px 0 0;
                color: var(--muted);
                font-size: var(--t-small);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .sub.is-error {
                color: var(--over);
                font-weight: 600;
                white-space: normal;
            }
            .actions {
                display: flex;
                align-items: center;
                gap: 2px;
                flex: none;
            }
            .tabs-wrap {
                position: sticky;
                top: 0;
                z-index: 20;
                margin: 0 calc(-1 * var(--gutter));
                padding: var(--s2) var(--gutter);
                background: var(--surface);
                border-bottom: 1px solid transparent;
                transition: border-color 0.12s linear;
            }
            @supports (backdrop-filter: blur(12px)) or
                (-webkit-backdrop-filter: blur(12px)) {
                .tabs-wrap {
                    background: color-mix(
                        in srgb,
                        var(--surface) 92%,
                        transparent
                    );
                    -webkit-backdrop-filter: blur(12px);
                    backdrop-filter: blur(12px);
                }
            }
            body.scrolled .tabs-wrap {
                border-bottom-color: var(--border);
            }
            [role="tablist"] {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: var(--s1);
                padding: var(--s1);
                border-radius: var(--r-md);
                background: var(--surface-2);
            }
            [role="tab"] {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                min-height: 56px;
                padding: var(--s1) var(--s1) 6px;
                border: 0;
                border-radius: 10px;
                background: transparent;
                color: var(--muted);
                font-size: var(--t-micro);
                font-weight: 550;
                line-height: 1.2;
            }
            [role="tab"] svg {
                width: 22px;
                height: 22px;
            }
            [role="tab"]:hover {
                color: var(--ink);
                background: color-mix(in srgb, var(--surface) 50%, transparent);
            }
            [role="tab"][aria-selected="true"] {
                background: var(--accent-soft);
                color: var(--ink);
                font-weight: 650;
            }
            [role="tab"][aria-selected="true"] svg {
                color: var(--accent);
            }
            /* The non-colour cue: a 3px bar under the label. */
            [role="tab"][aria-selected="true"]::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 3px;
                width: 22px;
                height: 3px;
                margin-left: -11px;
                border-radius: var(--r-pill);
                background: var(--accent);
            }
            @media (min-width: 481px) {
                [role="tab"] {
                    flex-direction: row;
                    gap: var(--s2);
                    min-height: 48px;
                    font-size: 14px;
                    padding: 0 var(--s3);
                }
                [role="tab"] svg {
                    width: 20px;
                    height: 20px;
                }
                [role="tab"][aria-selected="true"]::after {
                    bottom: 4px;
                    width: 28px;
                    margin-left: -14px;
                }
            }
            @media (min-width: 1024px) {
                .chrome {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) auto auto;
                    align-items: center;
                    gap: var(--s6);
                    position: sticky;
                    top: 0;
                    z-index: 20;
                    margin: 0 calc(-1 * var(--gutter));
                    padding: var(--s3) var(--gutter);
                    background: var(--bg);
                    border-bottom: 1px solid transparent;
                }
                @supports (backdrop-filter: blur(12px)) or
                    (-webkit-backdrop-filter: blur(12px)) {
                    .chrome {
                        background: color-mix(
                            in srgb,
                            var(--bg) 92%,
                            transparent
                        );
                        -webkit-backdrop-filter: blur(12px);
                        backdrop-filter: blur(12px);
                    }
                }
                body.scrolled .chrome {
                    border-bottom-color: var(--border);
                }
                .top {
                    display: contents;
                }
                .actions {
                    grid-column: 3;
                    grid-row: 1;
                }
                .tabs-wrap {
                    position: static;
                    grid-column: 2;
                    grid-row: 1;
                    margin: 0;
                    padding: 0;
                    background: none;
                    border: 0;
                    -webkit-backdrop-filter: none;
                    backdrop-filter: none;
                }
                [role="tablist"] {
                    grid-template-columns: repeat(4, auto);
                }
                [role="tab"] {
                    min-height: 44px;
                }
            }

            /* ================= panels ================= */
            main {
                padding-top: var(--s4);
            }
            [role="tabpanel"] {
                outline-offset: 4px;
                border-radius: var(--r-sm);
            }
            [role="tabpanel"].enter {
                animation: panel-in 160ms var(--ease);
            }
            @keyframes panel-in {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            .panel-body {
                transition: opacity 0.12s linear;
            }
            .refreshing .panel-body {
                opacity: 0.6;
            }
            .panel-head {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: var(--s3);
                margin-bottom: var(--s4);
            }
            .range-label {
                margin: 0;
                font-size: var(--t-h2);
                font-weight: 650;
                line-height: 1.3;
            }
            .range-label small {
                display: block;
                font-size: var(--t-small);
                font-weight: 400;
                color: var(--muted);
            }
            .seg {
                display: inline-grid;
                grid-auto-flow: column;
                grid-auto-columns: 1fr;
                border: 1px solid var(--control);
                border-radius: var(--r-sm);
                padding: 2px;
                gap: 2px;
                background: var(--surface);
            }
            .seg button {
                position: relative;
                min-height: 40px;
                min-width: 72px;
                padding: 0 var(--s3);
                border: 1px solid transparent;
                border-radius: 6px;
                background: transparent;
                color: var(--muted);
                font-size: 14px;
                font-weight: 550;
                white-space: nowrap;
            }
            .seg button:hover {
                background: var(--surface-2);
                color: var(--ink);
            }
            .seg button[aria-pressed="true"] {
                background: var(--accent-soft);
                color: var(--ink);
                font-weight: 650;
                border-color: var(--accent);
            }
            .seg[aria-disabled="true"] button {
                cursor: progress;
            }
            .spin {
                display: inline-block;
                width: 12px;
                height: 12px;
                margin-left: 6px;
                vertical-align: -1px;
                border: 2px solid currentColor;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (max-width: 480px) {
                .panel-head .seg {
                    width: 100%;
                }
                .seg button {
                    min-width: 0;
                    min-height: 44px;
                    padding: 0 var(--s1);
                }
            }

            .grid {
                display: grid;
                gap: var(--s4);
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--r-md);
                box-shadow: var(--shadow-card);
                padding: var(--s4);
                min-width: 0;
            }
            @media (min-width: 481px) {
                .card {
                    padding: var(--s5);
                }
            }
            .card.hero {
                border-radius: var(--r-lg);
            }
            .card-head {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: var(--s3);
                margin-bottom: var(--s3);
            }
            .card h3 {
                margin: 0;
                font-size: var(--t-h2);
                line-height: 1.3;
                font-weight: 650;
            }
            .card h3 .est {
                font-weight: 500;
                color: var(--subtle);
                font-size: var(--t-small);
            }
            .note {
                margin: 4px 0 0;
                font-size: var(--t-small);
                line-height: 1.45;
                color: var(--muted);
            }
            .micro {
                font-size: var(--t-micro);
                line-height: 1.35;
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .empty {
                padding: var(--s6) var(--s2);
                text-align: center;
                color: var(--muted);
                font-size: var(--t-small);
            }
            .banner {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: var(--s3);
                margin-bottom: var(--s4);
                padding: var(--s3) var(--s4);
                border: 1px solid
                    color-mix(in srgb, var(--over) 45%, var(--border));
                border-left: 4px solid var(--over);
                border-radius: var(--r-sm);
                background: var(--surface);
            }
            .banner p {
                flex: 1 1 200px;
                margin: 0;
                font-weight: 600;
            }
            .notice {
                display: flex;
                gap: var(--s3);
                align-items: flex-start;
                padding: var(--s3) var(--s4);
                border-radius: var(--r-sm);
                background: color-mix(in srgb, var(--warn) 10%, var(--surface));
                border: 1px solid
                    color-mix(in srgb, var(--warn) 35%, var(--border));
                font-size: var(--t-small);
            }
            .notice b {
                color: var(--warn);
            }

            /* stat cards */
            .stats {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: var(--s3);
            }
            @media (min-width: 700px) {
                .stats.four {
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                }
            }
            .stat {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--r-md);
                box-shadow: var(--shadow-card);
                padding: var(--s3) var(--s4) var(--s4);
                min-width: 0;
            }
            .stat .figure {
                margin-top: 6px;
                font-size: var(--t-figure);
                line-height: 1.1;
                font-weight: 680;
                letter-spacing: -0.02em;
                font-variant-numeric: tabular-nums;
                overflow-wrap: anywhere;
            }
            .stat .unit {
                margin-left: 3px;
                font-size: var(--t-small);
                font-weight: 500;
                letter-spacing: 0;
                color: var(--muted);
            }
            .stat .foot {
                margin-top: 6px;
                font-size: var(--t-small);
                line-height: 1.4;
                color: var(--muted);
            }
            .stat.missing .figure {
                color: var(--subtle);
            }
            .over-text {
                color: var(--over);
                font-weight: 650;
            }
            .chip {
                display: inline-flex;
                align-items: center;
                padding: 1px 8px;
                border-radius: var(--r-pill);
                font-size: var(--t-micro);
                font-weight: 650;
                line-height: 1.5;
            }
            .chip.over {
                color: var(--over);
                background: color-mix(in srgb, var(--over) 12%, var(--surface));
                border: 1px solid
                    color-mix(in srgb, var(--over) 40%, var(--surface));
            }
            .chip.est {
                color: var(--subtle);
                border: 1px solid var(--border);
            }
            .sw {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 3px;
                vertical-align: 0;
                margin-right: 6px;
                flex: none;
            }
            .sw.dot {
                border-radius: 50%;
            }

            /* legends */
            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: var(--s1) var(--s4);
                margin: 0 0 var(--s2);
                padding: 0;
                list-style: none;
                font-size: var(--t-small);
                color: var(--ink);
            }
            .legend li {
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .legend svg {
                width: 14px;
                height: 14px;
                flex: none;
            }

            /* ================= charts ================= */
            .plot {
                position: relative;
                width: 100%;
                min-width: 0;
            }
            .plot svg.chart {
                display: block;
                touch-action: pan-y;
                border-radius: 4px;
                overflow: visible;
            }
            .chart text {
                font-size: 12px;
                font-family: inherit;
            }
            .ax {
                fill: var(--muted);
                font-variant-numeric: tabular-nums;
            }
            .gridline {
                stroke: var(--grid);
                stroke-width: 1;
            }
            .zero {
                stroke: var(--muted);
                stroke-width: 1;
            }
            .goal-line {
                fill: none;
                stroke: var(--muted);
                stroke-width: 2;
                stroke-linejoin: round;
            }
            .goal-lbl {
                fill: var(--muted);
                font-weight: 600;
                paint-order: stroke;
                stroke: var(--surface);
                stroke-width: 4px;
                stroke-linejoin: round;
            }
            .m-kcal {
                fill: var(--kcal);
            }
            .m-over {
                fill: url(#hatch-over);
            }
            .m-protein {
                fill: var(--protein);
            }
            .m-carbs {
                fill: var(--carbs);
            }
            .m-fat {
                fill: var(--fat);
            }
            .m-fiber {
                fill: var(--fiber);
            }
            .m-gain {
                fill: var(--gain);
            }
            .m-loss {
                fill: var(--loss);
            }
            .m-burn {
                fill: var(--surface);
                stroke: var(--burn);
                stroke-width: 2;
            }
            .m-band {
                fill: var(--accent-soft);
            }
            .m-wline {
                fill: none;
                stroke: var(--accent);
                stroke-width: 2;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            .m-wdot {
                fill: var(--accent);
                stroke: var(--surface);
                stroke-width: 2;
            }
            .m-target {
                stroke: var(--muted);
                stroke-width: 2;
                stroke-dasharray: 6 4;
            }
            .m-tick {
                stroke: var(--muted);
                stroke-width: 2;
                stroke-linecap: round;
            }
            .dim {
                opacity: 0.6;
            }
            .guide {
                stroke: var(--muted);
                stroke-width: 1;
                pointer-events: none;
            }
            .lbl {
                fill: var(--ink);
                font-variant-numeric: tabular-nums;
                font-weight: 600;
            }
            .hatch-bg {
                fill: var(--over-tint);
            }
            .hatch-fg {
                fill: var(--over);
            }
            .s-kcal {
                background: var(--kcal);
            }
            .s-protein {
                background: var(--protein);
            }
            .s-carbs {
                background: var(--carbs);
            }
            .s-fat {
                background: var(--fat);
            }
            .s-fiber {
                background: var(--fiber);
            }
            .s-sugar {
                background: var(--sugar);
            }
            .s-burn {
                background: var(--surface);
                box-shadow: inset 0 0 0 2px var(--burn);
                border-radius: 50%;
            }
            .s-gain {
                background: var(--gain);
            }
            .s-loss {
                background: var(--loss);
            }
            .s-accent {
                background: var(--accent);
            }
            .s-muted {
                background: var(--muted);
            }

            /* tooltip */
            #tip {
                position: fixed;
                z-index: 50;
                left: 0;
                top: 0;
                min-width: 150px;
                max-width: min(280px, calc(100vw - 16px));
                padding: var(--s2) var(--s3);
                border-radius: 10px;
                background: var(--surface);
                border: 1px solid var(--border);
                box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
                font-size: var(--t-small);
                line-height: 1.4;
                pointer-events: none;
                opacity: 0;
                transition: opacity 100ms linear;
            }
            #tip.on {
                opacity: 1;
            }
            #tip .t-date {
                font-weight: 650;
                margin-bottom: 4px;
            }
            #tip .row {
                display: flex;
                align-items: center;
                gap: var(--s3);
                font-variant-numeric: tabular-nums;
            }
            #tip .row span {
                flex: 1;
                display: inline-flex;
                align-items: center;
                color: var(--muted);
            }
            #tip .row b {
                font-weight: 650;
            }
            #tip .row.strong span {
                color: var(--ink);
            }

            /* skeletons */
            .skel {
                display: grid;
                gap: var(--s4);
            }
            .sk {
                border-radius: var(--r-md);
                background: linear-gradient(
                        90deg,
                        transparent 0%,
                        color-mix(in srgb, var(--surface) 55%, transparent) 50%,
                        transparent 100%
                    )
                    var(--surface-2);
                background-size: 200% 100%;
                animation: shimmer 1.2s linear infinite;
            }
            @keyframes shimmer {
                from {
                    background-position: 150% 0;
                }
                to {
                    background-position: -50% 0;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
                .btn:active,
                .icon-btn:active {
                    transform: none;
                }
            }

            /* ===== panel-specific styles are added below ===== */

            /* ---------- Today ---------- */
            .today-grid {
                display: grid;
                gap: var(--s4);
            }
            .today-grid > .col {
                display: grid;
                gap: var(--s4);
                align-content: start;
                min-width: 0;
            }
            @media (min-width: 1024px) {
                .today-grid {
                    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                }
            }
            .hero-in {
                display: grid;
                justify-items: center;
                gap: var(--s4);
            }
            @media (min-width: 700px) {
                .hero-in {
                    grid-template-columns: auto minmax(0, 1fr);
                    justify-items: stretch;
                    align-items: center;
                    gap: var(--s6);
                }
            }
            .ring {
                position: relative;
                width: 168px;
                height: 168px;
            }
            .ring svg {
                width: 100%;
                height: 100%;
                display: block;
            }
            @media (max-width: 480px) {
                .ring {
                    width: 148px;
                    height: 148px;
                }
            }
            .ring-track {
                fill: none;
                stroke: var(--surface-2);
            }
            .ring-arc {
                fill: none;
                stroke: var(--kcal);
                stroke-linecap: round;
                transition: stroke-dashoffset 500ms var(--ease);
            }
            .ring-over {
                fill: none;
                stroke: url(#hatch-over);
                stroke-linecap: butt;
                transition: stroke-dashoffset 500ms var(--ease);
            }
            .ring-c {
                position: absolute;
                inset: 0;
                display: grid;
                place-content: center;
                text-align: center;
            }
            .ring-c b {
                font-size: var(--t-hero);
                line-height: 1;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .ring-c span {
                margin-top: 4px;
                font-size: var(--t-small);
                color: var(--muted);
            }
            .ring-foot {
                margin: 0;
                text-align: center;
                font-size: var(--t-body);
            }
            @media (min-width: 700px) {
                .ring-foot {
                    text-align: left;
                }
            }
            .ring-foot .basis {
                display: block;
                margin-top: 2px;
                color: var(--muted);
                font-size: var(--t-small);
            }
            .trio {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                margin-top: var(--s4);
                border-top: 1px solid var(--border);
                width: 100%;
            }
            .trio > div {
                padding: var(--s3) var(--s2) 0;
                min-width: 0;
            }
            .trio > div:first-child {
                padding-left: 0;
            }
            @media (min-width: 481px) {
                .trio > div + div {
                    padding-left: var(--s4);
                }
                .ring-foot {
                    font-size: 17px;
                }
            }
            .trio > div + div {
                border-left: 1px solid var(--border);
            }
            .trio .figure {
                margin-top: 4px;
                font-size: 22px;
                line-height: 1.1;
                font-weight: 680;
                letter-spacing: -0.02em;
                font-variant-numeric: tabular-nums;
                display: flex;
                align-items: center;
                white-space: nowrap;
            }
            .trio .figure small {
                margin-left: 3px;
                font-size: var(--t-small);
                font-weight: 500;
                color: var(--muted);
                letter-spacing: 0;
            }
            .trio .figure.missing {
                color: var(--subtle);
            }
            .trio .foot {
                margin-top: 4px;
                font-size: var(--t-micro);
                color: var(--muted);
                line-height: 1.35;
            }
            @media (max-width: 380px) {
                .trio .figure {
                    font-size: 19px;
                }
            }
            .nutrients {
                display: grid;
                gap: var(--s3);
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .nutrients li {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 6px var(--s3);
                align-items: baseline;
            }
            .nutrients .name {
                font-weight: 600;
                display: inline-flex;
                align-items: center;
            }
            .nutrients .val {
                font-variant-numeric: tabular-nums;
                color: var(--muted);
                font-size: var(--t-small);
                display: inline-flex;
                gap: var(--s2);
                align-items: center;
            }
            .nutrients .val b {
                color: var(--ink);
                font-weight: 650;
            }
            .track {
                grid-column: 1 / -1;
                height: 8px;
                border-radius: var(--r-pill);
                background: var(--surface-2);
                overflow: hidden;
            }
            .track i {
                display: block;
                height: 100%;
                width: 0;
                border-radius: var(--r-pill);
                transition: width 400ms var(--ease);
            }
            .card-head .link-btn {
                margin-top: -10px;
                white-space: nowrap;
            }
            .meal-list {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .meal-list > li {
                padding: var(--s3) 0;
                border-top: 1px solid var(--border);
            }
            .meal-list > li:first-child {
                border-top: 0;
                padding-top: 0;
            }
            .m1 {
                display: flex;
                align-items: baseline;
                gap: var(--s2);
            }
            .m-time {
                font-variant-numeric: tabular-nums;
                color: var(--muted);
                font-size: var(--t-small);
            }
            .m-type {
                font-weight: 650;
                flex: 1;
                min-width: 0;
            }
            .m-kcal {
                font-variant-numeric: tabular-nums;
                font-weight: 650;
                white-space: nowrap;
            }
            .m-desc {
                margin: 2px 0 0;
                overflow-wrap: anywhere;
            }
            .m-mac {
                margin: 4px 0 0;
                font-size: var(--t-small);
                color: var(--muted);
                font-variant-numeric: tabular-nums;
                display: flex;
                flex-wrap: wrap;
                gap: 2px var(--s3);
            }
            .m-mac b {
                font-weight: 600;
                color: var(--ink);
            }

            /* ---------- Body ---------- */
            .w-hero {
                display: grid;
                gap: var(--s2);
            }
            .card h3.micro {
                font-size: var(--t-micro);
                font-weight: 600;
                line-height: 1.35;
            }
            .field label {
                font-size: var(--t-small);
                font-weight: 600;
            }
            .w-now {
                display: flex;
                align-items: baseline;
                flex-wrap: wrap;
                gap: var(--s1) var(--s3);
            }
            .w-now b {
                font-size: var(--t-hero);
                line-height: 1;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .w-now .unit {
                font-size: var(--t-h2);
                color: var(--muted);
                font-weight: 500;
                margin-left: -6px;
            }
            .w-now .when {
                margin-left: auto;
                color: var(--muted);
                font-size: var(--t-small);
            }
            .w-line {
                margin: 0;
                font-variant-numeric: tabular-nums;
            }
            .w-line .muted {
                color: var(--muted);
            }
            .body-grid {
                display: grid;
                gap: var(--s4);
            }
            .body-grid > .col {
                display: grid;
                gap: var(--s4);
                align-content: start;
                min-width: 0;
            }
            @media (min-width: 481px) and (max-width: 1023px) {
                .stats.three {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }
            @media (min-width: 1024px) {
                .body-grid {
                    grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
                    align-items: start;
                }
                .body-grid > .col:first-child {
                    order: 0;
                }
            }
            details.body-box > summary {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--s3);
                min-height: 44px;
                margin: calc(-1 * var(--s2)) 0;
                font-size: var(--t-h2);
                font-weight: 650;
                cursor: pointer;
                list-style: none;
                border-radius: var(--r-sm);
            }
            details.body-box > summary::-webkit-details-marker {
                display: none;
            }
            details.body-box > summary::after {
                content: "";
                width: 9px;
                height: 9px;
                margin-right: 6px;
                border-right: 2px solid var(--muted);
                border-bottom: 2px solid var(--muted);
                transform: rotate(45deg);
                transition: transform 0.15s var(--ease);
            }
            details.body-box[open] > summary::after {
                transform: rotate(-135deg);
            }
            .body-form {
                display: grid;
                gap: var(--s4);
                margin-top: var(--s4);
            }
            .pair {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 84px;
                gap: var(--s2);
            }
            select.input {
                padding-right: var(--s2);
            }
            .form-foot {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--s3);
            }
            .b-status {
                font-size: var(--t-small);
                font-weight: 600;
                color: var(--muted);
                transition: opacity 0.4s linear;
            }
            .b-status.err {
                color: var(--over);
            }
            .b-status.fade {
                opacity: 0;
            }

            /* ---------- Meals ---------- */
            /* One table. At ≥1024 it is a table; below, each day's tbody
               is a card and each row a wrapping flex line, so nothing
               ever scrolls sideways and descriptions wrap in full. */
            .meals-table {
                width: 100%;
                border-collapse: collapse;
                font-variant-numeric: tabular-nums;
            }
            .meals-table th,
            .meals-table td {
                text-align: left;
                vertical-align: top;
                padding: var(--s2) var(--s3);
            }
            .meals-table .n {
                text-align: right;
                white-space: nowrap;
            }
            .meals-table thead th {
                font-size: var(--t-micro);
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
            }
            .meals-table tr.day th {
                padding-top: var(--s5);
                font-size: var(--t-micro);
                font-weight: 650;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--ink);
                border-bottom: 1px solid var(--border);
            }
            .meals-table tr.day .tot {
                float: right;
                font-weight: 600;
                color: var(--muted);
                letter-spacing: 0;
                text-transform: none;
                font-size: var(--t-small);
            }
            .meals-table tr.day .tot b {
                color: var(--ink);
            }
            .meals-table tr.meal td {
                border-bottom: 1px solid var(--grid);
            }
            .meals-table td.ty {
                font-weight: 650;
                white-space: nowrap;
            }
            .meals-table td.t {
                color: var(--muted);
                white-space: nowrap;
            }
            .meals-table td.d {
                overflow-wrap: anywhere;
                min-width: 12em;
            }
            .meals-table td.k {
                font-weight: 650;
            }
            .partial {
                font-weight: 500;
                text-transform: none;
                letter-spacing: 0;
                color: var(--warn);
            }
            .meals-foot {
                margin: var(--s4) 0 0;
                text-align: center;
                font-size: var(--t-small);
                color: var(--muted);
            }
            @media (max-width: 1023px) {
                .meals-wrap.card {
                    background: none;
                    border: 0;
                    box-shadow: none;
                    padding: 0;
                }
                .meals-table,
                .meals-table tbody,
                .meals-table tr,
                .meals-table th,
                .meals-table td {
                    display: block;
                }
                .meals-table thead {
                    position: absolute;
                    width: 1px;
                    height: 1px;
                    overflow: hidden;
                    clip: rect(0 0 0 0);
                }
                .meals-table tbody {
                    margin-bottom: var(--s4);
                }
                .meals-table tr.day th {
                    padding: var(--s2) var(--s1);
                    border: 0;
                }
                .meals-table tr.day .tot {
                    float: none;
                    display: block;
                    margin-top: 2px;
                }
                .meals-table tr.meal {
                    display: flex;
                    flex-wrap: wrap;
                    align-items: baseline;
                    gap: 2px var(--s3);
                    padding: var(--s3) var(--s4);
                    background: var(--surface);
                    border: 1px solid var(--border);
                    border-top-width: 0;
                    box-shadow: var(--shadow-card);
                }
                .meals-table tr.day + tr.meal {
                    border-top-width: 1px;
                    border-radius: var(--r-md) var(--r-md) 0 0;
                }
                .meals-table tr.meal.last {
                    border-radius: 0 0 var(--r-md) var(--r-md);
                }
                .meals-table tr.day + tr.meal.last {
                    border-radius: var(--r-md);
                }
                .meals-table tr.meal td {
                    padding: 0;
                    border: 0;
                }
                .meals-table td.t {
                    order: 1;
                    font-size: var(--t-small);
                }
                .meals-table td.ty {
                    order: 2;
                    flex: 1;
                }
                .meals-table td.k {
                    order: 3;
                }
                .meals-table td.k::after {
                    content: " kcal";
                    font-weight: 400;
                    color: var(--muted);
                    font-size: var(--t-small);
                }
                .meals-table td.d {
                    order: 4;
                    flex-basis: 100%;
                    min-width: 0;
                    margin: 2px 0 4px;
                }
                .meals-table td.mac {
                    order: 5;
                    font-size: var(--t-small);
                    color: var(--muted);
                    text-align: left;
                }
                .meals-table td.mac::before {
                    content: attr(data-l) " ";
                }
                .meals-table td.mac b {
                    color: var(--ink);
                    font-weight: 600;
                }
            }
            @media (min-width: 1024px) {
                .meals-table td.mac b {
                    font-weight: 400;
                }
            }

            /* ---------- Trends ---------- */
            .stack {
                display: grid;
                gap: var(--s4);
            }
            .evs {
                display: grid;
                gap: var(--s3);
                margin: var(--s3) 0 var(--s4);
            }
            .evs-row {
                display: grid;
                grid-template-columns: 7.5em minmax(0, 1fr) 5.5em;
                align-items: center;
                gap: var(--s3);
            }
            .evs-name {
                font-size: var(--t-small);
                font-weight: 600;
                line-height: 1.25;
            }
            .evs-name small {
                display: block;
                font-weight: 400;
                color: var(--muted);
            }
            .evs-track {
                position: relative;
                height: 18px;
                border-radius: 4px;
                background: var(--surface-2);
            }
            .evs-track::before {
                content: "";
                position: absolute;
                left: 50%;
                top: -4px;
                bottom: -4px;
                width: 1px;
                background: var(--muted);
            }
            .evs-track i {
                position: absolute;
                top: 3px;
                bottom: 3px;
                min-width: 2px;
                border-radius: 3px;
            }
            .evs-row.faint .evs-track i {
                opacity: 0.5;
            }
            .evs-val {
                text-align: right;
                font-variant-numeric: tabular-nums;
                font-weight: 650;
                white-space: nowrap;
            }
            .evs-axis {
                display: grid;
                grid-template-columns: 7.5em minmax(0, 1fr) 5.5em;
                gap: var(--s3);
                font-size: var(--t-micro);
                color: var(--muted);
            }
            .evs-axis span:nth-child(2) {
                display: flex;

        </style>
    </head>
