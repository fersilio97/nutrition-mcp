                    const cols = [];
                    rows.forEach(function (r, i) {
                        const cx = lay.bw * (i + 0.5);
                        if (r.goal_calories) {
                            const half = lay.barW / 2 + 4;
                            svg.appendChild(
                                svgEl("line", {
                                    x1: cx - half,
                                    x2: cx + half,
                                    y1: yAt(r.goal_calories),
                                    y2: yAt(r.goal_calories),
                                    class: "m-tick",
                                }),
                            );
                        }
                        svgText(
                            svg,
                            cx,
                            c.h - 6,
                            parseDay(r.date).toLocaleDateString(undefined, {
                                weekday: "narrow",
                            }),
                            r.in_progress ? "lbl" : "ax",
                        );
                        const tc = calTip(r);
                        cols.push({ x: cx, html: tc.html, text: tc.text });
                    });
                    inspect(svg, cols, top, base);
                };

                /* ================= TRENDS ================= */
                function stat(label, figure, unit, foot, missing) {
                    return (
                        '<div class="stat' +
                        (missing ? " missing" : "") +
                        '"><div class="micro">' +
                        label +
                        '</div><div class="figure">' +
                        figure +
                        (unit ? '<span class="unit">' + unit + "</span>" : "") +
                        "</div>" +
                        (foot ? '<div class="foot">' + foot + "</div>" : "") +
                        "</div>"
                    );
                }
                // Weight deltas: grams under 1 kg, else one decimal in the
                // user's unit. Pounds stay pounds at every size.
                function wDelta(g, unit) {
                    if (unit !== "lb" && Math.abs(g) < 1000)
                        return fmtSigned(g) + " g";
                    return fmtSignedDec(toUnit(g, unit)) + " " + unit;
                }
                function trendsStats(rows) {
                    const logged = rows.filter((r) => r.mealCount > 0);
                    const complete = rows.filter((r) => !r.in_progress);
                    const withGoal = complete.filter((r) => r.goal_calories);
                    const done = complete.filter((r) => r.balance_g != null);
                    return {
                        logged: logged,
                        avgKcal: logged.length
                            ? logged.reduce((a, r) => a + r.calories, 0) /
                              logged.length
                            : null,
                        avgProtein: logged.length
                            ? logged.reduce((a, r) => a + r.protein_g, 0) /
                              logged.length
                            : null,
                        withGoal: withGoal,
                        overDays: withGoal.filter(isOver).length,
                        done: done,
                        net: done.reduce((a, r) => a + r.balance_g, 0),
                    };
                }
                function tilesHtml(rows, s) {
                    const g = data.goals;
                    const evs = data.estimateVsScale;
                    let html = "";
                    html += s.logged.length
                        ? stat(
                              "Daily average",
                              fmt(s.avgKcal),
                              "kcal",
                              s.logged.length +
                                  " of " +
                                  rows.length +
                                  " days logged",
                          )
                        : stat(
                              "Daily average",
                              "—",
                              "",
                              "0 of " + rows.length + " days logged",
                              true,
                          );
                    html += s.logged.length
                        ? stat(
                              "Avg protein",
                              fmt(s.avgProtein),
                              "g",
                              g && g.protein_g
                                  ? "goal " + fmt(g.protein_g) + " g"
                                  : "per logged day",
                          )
                        : stat(
                              "Avg protein",
                              "—",
                              "",
                              "Nothing logged yet",
                              true,
                          );
                    html += s.withGoal.length
                        ? stat(
                              "Over goal",
                              String(s.overDays),
                              "of " + plural(s.withGoal.length, "day"),
                              "complete days only",
                          )
                        : stat(
                              "Over goal",
                              "—",
                              "",
                              "No calorie goal set",
                              true,
                          );
                    html += !hasBurn()
                        ? stat("Net est. change", "—", "", ADD_BODY, true)
                        : s.done.length
                          ? stat(
                                "Net est. change",
                                fmtSigned(s.net),
                                "g",
                                "over " +
                                    plural(s.done.length, "complete day") +
                                    " · estimate" +
                                    (evs && evs.actual_g != null
                                        ? ' · <span style="white-space:nowrap">scale: ' +
                                          wDelta(
                                              evs.actual_g,
                                              data.weightUnit,
                                          ) +
                                          "</span>"
                                        : ""),
                            )
                          : stat(
                                "Net est. change",
                                "—",
                                "",
                                "No complete logged days",
                                true,
                            );
                    return '<div class="stats four">' + html + "</div>";
                }
                function evsHtml() {
                    const e = data.estimateVsScale;
                    const unit = data.weightUnit;
                    const note =
                        '<p class="note">What the estimate predicted from eating vs estimated burn, next to what the scale did between your first and last weigh-in in this period. Over a few days the scale mostly shows water and glycogen, so only longer spans say much about the estimate.</p>';
                    const head =
                        '<div class="card-head"><div><h3 id="h-evs">Estimate vs reality <span class="est">(estimate)</span></h3>' +
                        note +
                        "</div></div>";
                    if (!e || e.status === "no_weighins")
                        return (
                            head +
                            '<p class="empty">Log your weight at least twice in this period to compare — ask Claude to log a weigh-in.</p>'
                        );
                    const bars = [];
                    if (e.est_logged_g != null)
                        bars.push([
                            "Estimated",
                            e.covered_days < e.span_days ? "logged days" : "",
                            e.est_logged_g,
                            "",
                        ]);
                    if (e.est_scaled_g != null)
                        bars.push([
                            "Estimated",
                            "all days, if unlogged were similar",
                            e.est_scaled_g,
                            "faint",
                        ]);
                    bars.push(["Scale", "actual weigh-ins", e.actual_g, ""]);
                    const max = Math.max.apply(
                        null,
                        bars.map((b) => Math.abs(b[2])).concat([100]),
                    );
                    const row = function (b) {
                        const pct = (Math.abs(b[2]) / max) * 50;
                        const pos =
                            b[2] >= 0
                                ? "left:50%;width:" + pct + "%"
                                : "right:50%;width:" + pct + "%";
                        return (
                            '<div class="evs-row ' +
                            b[3] +
                            '"><span class="evs-name">' +
                            b[0] +
                            (b[1] ? "<small>" + b[1] + "</small>" : "") +
                            '</span><span class="evs-track" aria-hidden="true"><i class="' +
                            (b[2] >= 0 ? "s-gain" : "s-loss") +
                            '" style="' +
                            pos +
                            '"></i></span><span class="evs-val">' +
                            wDelta(b[2], unit) +
                            "</span></div>"
                        );
                    };
                    const lim = wDelta(max, unit).replace(/^\+/, "");
                    const period =
                        '<p class="note">Period: ' +
                        esc(shortDay(e.first_date)) +
                        " → " +
                        esc(shortDay(e.last_date)) +
                        " · " +
                        plural(e.span_days, "day") +
                        " · " +
                        e.covered_days +
                        " logged</p>";
                    let verdict;
                    if (e.status === "no_estimate")
                        verdict = hasBurn()
                            ? "No logged days between these weigh-ins, so there is no estimate to compare yet."
                            : "No estimate for these days yet. " +
                              ADD_BODY +
                              " to estimate your burn.";
                    else if (!e.calibrated)
                        verdict =
                            "Not enough logged days yet to judge the estimate (need 2+ weeks, 70% logged).";
                    else {
                        const est =
                            e.est_scaled_g != null
                                ? e.est_scaled_g
                                : e.est_logged_g;
                        const gap = Math.abs(e.gap_g);
                        const k = Math.abs(e.implied_kcal_per_day);
                        const losing = est <= 0 && e.actual_g <= 0;
                        let first;
                        if (gap < 50)
                            first =
                                "Your scale matched the estimate almost exactly";
                        else if (losing)
                            first =
                                "Your scale lost " +
                                wDelta(gap, unit).replace(/^\+/, "") +
                                (e.gap_g > 0 ? " less" : " more") +
                                " than estimated";
                        else
                            first =
                                "Your scale came in " +
                                wDelta(gap, unit).replace(/^\+/, "") +
                                (e.gap_g > 0 ? " higher" : " lower") +
                                " than estimated";
                        verdict =
                            first +
                            (k < 50
                                ? " — the burn estimate looks about right (within ~50 kcal/day)."
                                : " — the burn estimate looks ~" +
                                  fmt(Math.round(k / 10) * 10) +
                                  " kcal/day " +
                                  (e.implied_kcal_per_day > 0
                                      ? "high"
                                      : "low") +
                                  ".") +
                            ' <span style="color:var(--muted)">(It assumes BMR × 1.2 + your watch’s active kcal.)</span>';
                    }
                    return (
                        head +
                        '<div class="evs" role="img" aria-label="' +
                        esc(
                            bars
                                .map(
                                    (b) =>
                                        b[0] +
                                        (b[1] ? " (" + b[1] + ")" : "") +
                                        " " +
                                        wDelta(b[2], unit),
                                )
                                .join(", "),
                        ) +
                        '">' +
                        bars.map(row).join("") +
                        '<div class="evs-axis" aria-hidden="true"><span></span><span><span>' +
                        MINUS +
                        lim +
                        "</span><span>0</span><span>+" +
                        lim +
                        "</span></span><span></span></div></div>" +
                        period +
                        '<p class="evs-verdict">' +
                        verdict +
                        "</p>"
                    );
                }

                RENDER.trends = function () {
                    const rows = data.daily;
                    const s = trendsStats(rows);
                    const any = anyLogged(rows);
                    const hasGoal = rows.some((r) => r.goal_calories);
                    const emptyMsg =
                        '<p class="empty">Nothing logged in these ' +
                        rows.length +
                        " days.</p>";
                    const calLegend = legend(
                        [[LG.bar("m-kcal"), "Eaten"]]
                            .concat(
                                hasGoal
                                    ? [
                                          [LG.hatch(), "Over goal"],
                                          [
                                              LG.line(),
                                              "Goal (incl. active kcal)",
                                          ],
                                      ]
                                    : [],
                            )
                            .concat(
                                hasBurn() ? [[LG.ring(), "Est. burn"]] : [],
                            ),
                    );
                    const done = s.done;
                    const balNote = !hasBurn()
                        ? ""
                        : "(eaten − estimated burn) ÷ 7.7 kcal per gram. An estimate for spotting the trend — daily scale weight swings far more with water and salt. Today is left out until it ends." +
                          (done.length > 1
                              ? " Net over " +
                                done.length +
                                " complete logged days: " +
                                fmtSigned(s.net) +
                                " g."
                              : "");
                    $("trends-body").innerHTML =
                        '<div class="stack">' +
                        tilesHtml(rows, s) +
                        '<section class="card" aria-labelledby="h-cal"><div class="card-head"><div><h3 id="h-cal">Calories per day</h3><p class="note">' +
                        (hasGoal
                            ? "Each day’s goal is your " +
                              fmt(data.goals.calories) +
                              " kcal baseline plus that day’s active calories from your watch; the part of a bar above it is hatched."
                            : "No calorie goal set.") +
                        "</p></div></div>" +
                        (any
                            ? calLegend +
                              '<div class="plot" id="cal-plot"></div>'
                            : emptyMsg) +
                        "</section>" +
                        '<section class="card" aria-labelledby="h-bal"><div class="card-head"><div><h3 id="h-bal">Estimated body change <span class="est">(estimate)</span></h3><p class="note">' +
                        balNote +
                        "</p></div></div>" +
                        (!hasBurn()
                            ? '<p class="empty">Add your height, birth date and sex under Body → Body details to estimate this.<br>' +
                              ADD_BODY +
                              "</p>"
                            : done.length
                              ? legend([
                                    [LG.bar("m-gain"), "Est. gain (+, up)"],
                                    [LG.bar("m-loss"), "Est. loss (−, down)"],
                                ]) + '<div class="plot" id="bal-plot"></div>'
                              : '<p class="empty">No complete logged days in this range.</p>') +
                        "</section>" +
                        '<section class="card" aria-labelledby="h-evs">' +
                        evsHtml() +
                        "</section>" +
                        '<section class="card" aria-labelledby="h-mac"><div class="card-head"><div><h3 id="h-mac">Macros per day</h3><p class="note">Stacked grams of protein, carbs and fat.</p></div></div>' +
                        (any
                            ? legend([
                                  [LG.bar("m-protein"), "Protein"],
                                  [LG.bar("m-carbs"), "Carbs"],
                                  [LG.bar("m-fat"), "Fat"],
                              ]) + '<div class="plot" id="macro-plot"></div>'
                            : emptyMsg) +
                        "</section></div>";
                };

                function yAxis(svg, maxY, x0, x1, yAt, ticks, f) {
                    for (let i = 0; i <= ticks; i++) {
                        const v = (maxY / ticks) * i;
                        const y = yAt(v);
                        svg.appendChild(
                            svgEl("line", {
                                x1: x0,
                                x2: x1,
                                y1: y,
                                y2: y,
                                class: "gridline",
                            }),
                        );
                        svgText(
                            svg,
                            x0 - 8,
                            y + 4,
                            f ? f(v) : fmt(v),
                            "ax",
                            "end",
                        );
                    }
                }
                function xAxis(svg, rows, lay, x0, y) {
                    xLabelIdx(rows.length, lay.bw * rows.length).forEach(
                        function (i) {
                            svgText(
                                svg,
                                x0 + lay.bw * (i + 0.5),
                                y,
                                shortDay(rows[i].date),
                                "ax",
                                "middle",
                            );
                        },
                    );
                }
                function rangeText() {
                    return (
                        shortDay(data.startDate) +
                        " to " +
                        shortDay(data.endDate)
                    );
                }

                function caloriesChart() {
                    const host = $("cal-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = data.daily;
                    const s = trendsStats(rows);
                    const c = chartSvg(
                        host,
                        isDesktop() ? 280 : 220,
                        "Calories per day, " +
                            rangeText() +
                            ": average " +
                            fmt(s.avgKcal) +
                            " kcal over " +
                            plural(s.logged.length, "logged day") +
                            ", " +
                            s.overDays +
                            " over goal. Use the arrow keys to read each day.",
                    );
                    const svg = c.svg;
                    const plotW = c.w - PAD.l - PAD.r;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const peak = Math.max.apply(
                        null,
                        rows.map((r) =>
                            Math.max(
                                r.calories,
                                r.goal_calories || 0,
                                r.burn_kcal || 0,
                            ),
                        ),
                    );
                    const maxY = tickMax(peak * 1.05, 4);
                    const yAt = (v) => base - (v / maxY) * plotH;
                    yAxis(svg, maxY, PAD.l, PAD.l + plotW, yAt, 4);
                    const lay = bandLayout(rows.length, plotW);
                    calBars(svg, rows, PAD.l, plotW, yAt, base, lay);
                    // Goal as a step line: each day's own target across its
                    // column, joined vertically where it changes.
                    let d = "";
                    rows.forEach(function (r, i) {
                        if (!r.goal_calories) return;
                        const y = yAt(r.goal_calories);
                        const x0 = PAD.l + lay.bw * i;
                        const prev = rows[i - 1];
                        d +=
                            (prev && prev.goal_calories ? "L" : "M") +
                            x0 +
                            "," +
                            y +
                            "L" +
                            (x0 + lay.bw) +
                            "," +
                            y;
                    });
                    if (d)
                        svg.appendChild(
                            svgEl("path", { d: d, class: "goal-line" }),
                        );
                    const rr =
                        rows.length <= 31 ? 4 : rows.length <= 90 ? 2.5 : 1.5;
                    rows.forEach(function (r, i) {
                        if (!r.burn_kcal) return;
                        const ci = svgEl("circle", {
                            cx: PAD.l + lay.bw * (i + 0.5),
                            cy: yAt(r.burn_kcal),
                            r: rr,
                            class: "m-burn" + (r.in_progress ? " dim" : ""),
                        });
                        if (rr < 3) ci.style.strokeWidth = "1.5";
                        svg.appendChild(ci);
                    });
                    // Drawn last, with a surface halo, so no mark covers it.
                    const lastGoal = rows[rows.length - 1].goal_calories;
                    if (lastGoal)
                        svgText(
                            svg,
                            PAD.l + plotW,
                            Math.max(PAD.t + 4, yAt(lastGoal) - 9),
                            "Goal " + fmt(lastGoal),
                            "goal-lbl",
                            "end",
                        );
                    xAxis(svg, rows, lay, PAD.l, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {
                            const t = calTip(r);
                            return {
                                x: PAD.l + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                }

                // Estimated grams gained (up, --gain) or lost (down, --loss)
                // per complete day. Today is excluded: a day still running
                // reads as a huge deficit and would set the scale.
                function balanceChart() {
                    const host = $("bal-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = data.daily;
                    const plotted = (r) =>
                        r.balance_g != null && !r.in_progress;
                    const known = rows.filter(plotted);
                    const net = known.reduce((a, r) => a + r.balance_g, 0);
                    const c = chartSvg(
                        host,
                        isDesktop() ? 160 : 140,
                        "Estimated grams gained or lost per day, " +
                            rangeText() +
                            ": net " +
                            fmtSigned(net) +
                            " g over " +
                            plural(known.length, "complete logged day") +
                            ". Use the arrow keys to read each day.",
                    );
                    const svg = c.svg;
                    const plotW = c.w - PAD.l - PAD.r;
                    const top = PAD.t;
                    const bottom = c.h - PAD.b;
                    const zeroY = (top + bottom) / 2;
                    const peak = Math.max.apply(
                        null,
                        known.map((r) => Math.abs(r.balance_g)),
                    );
                    const maxAbs = niceMax(Math.max(peak, 20) * 1.15);
                    const yAt = (v) =>
                        zeroY - (v / maxAbs) * ((bottom - top) / 2);
                    [maxAbs, -maxAbs].forEach(function (v) {
                        svg.appendChild(
                            svgEl("line", {
                                x1: PAD.l,
                                x2: PAD.l + plotW,
                                y1: yAt(v),
                                y2: yAt(v),
                                class: "gridline",
                            }),
                        );
                        svgText(
                            svg,
                            PAD.l - 8,
                            yAt(v) + 4,
                            fmtSigned(v),
                            "ax",
                            "end",
                        );
                    });
                    const lay = bandLayout(rows.length, plotW);
                    const labels = rows.length <= 14;
                    rows.forEach(function (r, i) {
                        if (!plotted(r)) return;
                        const v = r.balance_g;
                        const x = PAD.l + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const y = v >= 0 ? yAt(v) : zeroY;
                        const h = Math.max(1, Math.abs(yAt(v) - zeroY));
                        svg.appendChild(
                            svgEl("rect", {
                                x: x,
                                y: y,
                                width: lay.barW,
                                height: h,
                                rx: Math.min(3, lay.barW / 2),
                                class: v >= 0 ? "m-gain" : "m-loss",
                            }),
                        );
                        if (labels)
                            svgText(
                                svg,
                                x + lay.barW / 2,
                                v >= 0 ? y - 4 : y + h + 13,
                                fmtSigned(v),
                                "lbl",
                                "middle",
                            );
                    });
                    svg.appendChild(
                        svgEl("line", {
                            x1: PAD.l,
                            x2: PAD.l + plotW,
                            y1: zeroY,
                            y2: zeroY,
                            class: "zero",
                        }),
                    );
                    svgText(svg, PAD.l - 8, zeroY + 4, "0 g", "ax", "end");
                    xAxis(svg, rows, lay, PAD.l, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {
                            const t = plotted(r)
                                ? tipContent(longDay(r.date), [
                                      [
                                          r.balance_g >= 0
                                              ? "s-gain"
                                              : "s-loss",
                                          "Est. change",
                                          fmtSigned(r.balance_g) + " g",
                                          1,
                                      ],
                                      [
                                          null,
                                          "Eaten − burn",
                                          fmtSigned(r.calories - r.burn_kcal) +
                                              " kcal",
                                      ],
                                  ])
                                : tipContent(
                                      longDay(r.date) +
                                          (r.in_progress ? " · so far" : ""),
                                      [
                                          [
                                              null,
                                              r.in_progress
                                                  ? "In progress"
                                                  : "Not logged",
                                              r.in_progress
                                                  ? "not counted yet"
                                                  : "no estimate",
                                          ],
                                      ],
                                  );
                            return {
                                x: PAD.l + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        top,
                        bottom,
                    );
                }

                const MACROS = [
                    {
                        key: "protein_g",
                        name: "Protein",
                        cls: "m-protein",
                        sw: "s-protein",
                    },
                    {
                        key: "carbs_g",
                        name: "Carbs",
                        cls: "m-carbs",
                        sw: "s-carbs",
                    },
                    { key: "fat_g", name: "Fat", cls: "m-fat", sw: "s-fat" },
                ];
                function macroChart() {
                    const host = $("macro-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = data.daily;
                    const logged = rows.filter((r) => r.mealCount > 0);
                    const avg = (k) =>
                        logged.length
                            ? logged.reduce((a, r) => a + r[k], 0) /
                              logged.length
                            : 0;
                    const c = chartSvg(
                        host,
                        isDesktop() ? 280 : 220,
                        "Protein, carbs and fat in grams per day, " +
                            rangeText() +
                            ". Averages per logged day: protein " +
                            fmt(avg("protein_g")) +
                            " g, carbs " +
                            fmt(avg("carbs_g")) +
                            " g, fat " +
                            fmt(avg("fat_g")) +
                            " g. Use the arrow keys to read each day.",
                    );
                    const svg = c.svg;
                    const plotW = c.w - PAD.l - PAD.r;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const total = (r) => r.protein_g + r.carbs_g + r.fat_g;
                    const maxY = tickMax(
                        Math.max.apply(null, rows.map(total)) * 1.05,
                        4,
                    );
                    const yAt = (v) => base - (v / maxY) * plotH;
                    yAxis(svg, maxY, PAD.l, PAD.l + plotW, yAt, 4);
                    const lay = bandLayout(rows.length, plotW);
                    const gapPx = lay.barW >= 4 ? 2 : 0;
                    rows.forEach(function (r, i) {
                        const x = PAD.l + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const w = lay.barW;
                        let acc = 0;
                        // Fat at the bottom, protein on top. Each segment
                        // above another leaves a 2px gap; only the segment
                        // that finishes the stack is rounded.
                        for (let s = MACROS.length - 1; s >= 0; s--) {
                            const val = r[MACROS[s].key] || 0;
                            if (val <= 0) continue;
                            const yTop = yAt(acc + val);
                            const segH = Math.max(
                                0,
                                yAt(acc) - yTop - (acc > 0 ? gapPx : 0),
                            );
                            const isTop = acc + val >= total(r) - 0.001;
                            svg.appendChild(
                                svgEl("path", {
                                    d: isTop
                                        ? barPath(
                                              x,
                                              yTop,
                                              w,
                                              segH,
                                              Math.min(4, w / 2),
                                          )
                                        : rectPath(x, yTop, w, segH),
                                    class:
                                        MACROS[s].cls +
                                        (r.in_progress ? " dim" : ""),
                                }),
                            );
                            acc += val;
                        }
                    });
                    xAxis(svg, rows, lay, PAD.l, c.h - 8);
                    inspect(
                        svg,
                        rows.map(function (r, i) {
                            const t = tipContent(
                                longDay(r.date) +
                                    (r.in_progress ? " · so far" : ""),
                                MACROS.map((m) => [
                                    m.sw,
                                    m.name,
                                    fmt(r[m.key]) + " g",
                                ]).concat(
                                    r.goal_protein_g
                                        ? [
                                              [
                                                  null,
                                                  "Protein goal",
                                                  fmt(r.goal_protein_g) + " g",
                                              ],
                                          ]
                                        : [],
                                ),
                            );
                            return {
                                x: PAD.l + lay.bw * (i + 0.5),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                }
                CHARTS.trends = function () {
                    caloriesChart();
                    balanceChart();
                    macroChart();
                };

                /* ================= BODY ================= */
                const BMI_LABEL = {
                    underweight: "Underweight",
                    healthy: "Healthy range",
                    overweight: "Overweight",
                    obese: "Obese",
                };
                // Form state that must outlive a re-render (range change,
                // refetch after save): open/closed, whether the user has
                // toggled it, unsaved input, and the status line.
                let bodyTouched = false;
                let bodyOpen = false;
                let bodyDraft = null;
                let bodyStatus = { text: "", cls: "" };
                let bodyStatusTimer = 0;
                const detailsMissing = () =>
                    data.weightStats.missing.some((m) => m !== "weight");

                function targetFoot(s, unit) {
                    if (s.to_target_g === 0) return "At target";
                    if (s.projected_date)
                        return (
                            "At this rate: " +
                            longDay(s.projected_date) +
                            " (est.)"
                        );
                    if (s.weekly_rate_g != null)
                        return "Current trend is not heading there";
                    return "Target " + wfmt(s.target_g, unit) + " " + unit;
                }
                function bodyStats(s, unit) {
                    let h = "";
                    h +=
                        s.bmi != null
                            ? stat(
                                  "BMI",
                                  s.bmi.toFixed(1),
                                  "",
                                  BMI_LABEL[s.bmi_category],
                              )
                            : s.height_cm == null
                              ? stat("BMI", "—", "", ADD_BODY, true)
                              : stat("BMI", "—", "", "Needs a weigh-in", true);
                    h +=
                        s.healthy_min_g != null
                            ? stat(
                                  "Healthy range",
                                  wfmt(s.healthy_min_g, unit) +
                                      "–" +
                                      wfmt(s.healthy_max_g, unit),
                                  unit,
                                  "BMI 18.5–24.9 at " +
                                      Number(s.height_cm).toFixed(0) +
                                      " cm",
                              )
                            : stat("Healthy range", "—", "", ADD_BODY, true);
                    h +=
                        s.change_g != null
                            ? stat(
                                  "Change",
                                  fmtSignedDec(toUnit(s.change_g, unit)),
                                  unit,
                                  "over " +
                                      s.trend_days +
                                      " days · " +
                                      fmtSignedDec(
                                          toUnit(s.weekly_rate_g, unit),
                                          2,
                                      ) +
                                      " " +
                                      unit +
                                      "/week",
                              )
                            : stat(
                                  "Change",
                                  "—",
                                  "",
                                  "Needs 2+ weigh-ins on different days",
                                  true,
                              );
                    if (s.target_g != null)
                        h += stat(
                            "To target",
                            s.to_target_g != null
                                ? fmtSignedDec(toUnit(s.to_target_g, unit))
                                : wfmt(s.target_g, unit),
                            unit,
                            targetFoot(s, unit),
                        );
                    h +=
                        s.bmr_kcal != null
                            ? stat(
                                  "Resting burn (est.)",
                                  fmt(s.bmr_kcal),
                                  "kcal",
                                  "BMR · Mifflin-St Jeor" +
                                      (s.age != null ? " · age " + s.age : ""),
                              )
                            : stat(
                                  "Resting burn (est.)",
                                  "—",
                                  "",
                                  ADD_BODY,
                                  true,
                              );
                    h +=
                        s.burn_today_kcal != null
                            ? stat(
                                  "Est. burn today",
                                  fmt(s.burn_today_kcal),
                                  "kcal",
                                  "BMR × 1.2 + today’s active kcal",
                              )
                            : stat("Est. burn today", "—", "", ADD_BODY, true);
                    return '<div class="stats three">' + h + "</div>";
                }
                function weightHero(s, unit) {
                    if (s.latest_g == null)
                        return '<section class="card hero" aria-labelledby="h-w"><h3 id="h-w" class="sr-only">Current weight</h3><p class="empty">No weigh-ins yet. Ask Claude to log your weight.</p></section>';
                    const change =
                        s.change_g != null
                            ? "<b>" +
                              fmtSignedDec(toUnit(s.change_g, unit)) +
                              " " +
                              unit +
                              '</b> <span class="muted">over ' +
                              s.trend_days +
                              " days · " +
                              fmtSignedDec(toUnit(s.weekly_rate_g, unit), 2) +
                              " " +
                              unit +
                              "/week</span>"
                            : '<span class="muted">Needs 2+ weigh-ins on different days for a trend</span>';
                    let target = "";
                    if (s.target_g != null) {
                        target =
                            s.to_target_g === 0
                                ? "<b>At target</b> (" +
                                  wfmt(s.target_g, unit) +
                                  " " +
                                  unit +
                                  ")"
                                : "<b>" +
                                  wfmt(Math.abs(s.to_target_g), unit) +
                                  " " +
                                  unit +
                                  "</b> to target " +
                                  wfmt(s.target_g, unit) +
                                  ' <span class="muted">· ' +
                                  (s.projected_date
                                      ? "est. " +
                                        esc(longDay(s.projected_date)) +
                                        " at this rate"
                                      : s.weekly_rate_g != null
                                        ? "current trend is not heading there"
                                        : "needs a trend") +
                                  "</span>";
                    }
                    return (
                        '<section class="card hero w-hero" aria-labelledby="h-w"><h3 id="h-w" class="micro">Current weight</h3><div class="w-now"><b>' +
                        wfmt(s.latest_g, unit) +
                        '</b><span class="unit">' +
                        unit +
                        '</span><span class="when">Logged ' +
                        esc(shortDay(s.latest_date)) +
                        '</span></div><p class="w-line">' +
                        change +
                        "</p>" +
                        (target ? '<p class="w-line">' + target + "</p>" : "") +
                        "</section>"
                    );
                }
                function bodyFormHtml() {
                    return (
                        '<section class="card"><details class="body-box" id="body-box"' +
                        (bodyOpen ? " open" : "") +
                        '><summary>Body details</summary><p class="note">Used only for BMI, your healthy weight range and the estimated daily burn (Mifflin-St Jeor × 1.2 for a desk day, plus your workouts’ active calories).</p>' +
                        '<form id="body-form" class="body-form" novalidate>' +
                        '<div class="field"><label for="b-height">Height</label><span class="pair"><input class="input" id="b-height" type="number" inputmode="decimal" step="0.1" min="20" max="272" /><select class="input" id="b-unit" aria-label="Height unit"><option value="cm">cm</option><option value="in">in</option></select></span></div>' +
                        '<label class="field" for="b-birth">Birth date<input class="input" id="b-birth" type="date" /></label>' +
                        '<label class="field" for="b-sex">Sex<select class="input" id="b-sex"><option value="">—</option><option value="male">Male</option><option value="female">Female</option></select></label>' +
                        '<div class="form-foot"><button type="submit" class="btn primary" id="b-save">Save</button><span class="b-status ' +
                        bodyStatus.cls +
                        '" id="b-status" role="status">' +
                        esc(bodyStatus.text) +
                        "</span></div></form></details></section>"
                    );
                }
                function fillBodyForm() {
                    const body = data.body;
                    const d = bodyDraft;
                    const unit = d
                        ? d.unit
                        : data.weightUnit === "lb"
                          ? "in"
                          : "cm";
                    $("b-unit").value = unit;
                    $("b-height").value = d
                        ? d.height
                        : body.height_cm == null
                          ? ""
                          : unit === "in"
                            ? (body.height_cm / 2.54).toFixed(1)
                            : String(body.height_cm);
                    $("b-birth").value = d ? d.birth : body.birth_date || "";
                    $("b-sex").value = d ? d.sex : body.sex || "";
                    // Open it when something is missing, so the ask is
                    // visible — unless the user has toggled it themselves.
                    if (
                        detailsMissing() &&
                        !bodyTouched &&
                        !$("body-box").open
                    ) {
                        // The toggle event fires async; its handler
                        // consumes this flag, so it is set only when a
                        // toggle will actually follow.
                        bodyBoxProgrammatic = true;
                        $("body-box").open = true;
                        bodyOpen = true;
                    }
                }
                function setBodyStatus(text, cls) {
                    clearTimeout(bodyStatusTimer);
                    bodyStatus = { text: text, cls: cls || "" };
                    const st = $("b-status");
                    if (st) {
                        st.className = "b-status " + bodyStatus.cls;
                        st.textContent = text;
                    }
                }
                function wireBodyForm() {
                    const box = $("body-box");
                    box.addEventListener("toggle", function () {
                        bodyOpen = box.open;
                        if (bodyBoxProgrammatic) bodyBoxProgrammatic = false;
                        else bodyTouched = true;
                    });
                    $("body-form").addEventListener("input", function () {
                        bodyDraft = {
                            height: $("b-height").value,
                            unit: $("b-unit").value,
                            birth: $("b-birth").value,
                            sex: $("b-sex").value,
                        };
                    });
                    $("body-form").addEventListener("submit", function (ev) {
                        ev.preventDefault();
                        const btn = $("b-save");
                        const h = $("b-height").value.trim();
                        btn.disabled = true;
                        setBodyStatus("Saving…");
                        fetch("/api/dashboard/body", {
                            method: "POST",
                            headers: {
                                Authorization: "Bearer " + token,
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                height: h === "" ? null : Number(h),
                                height_unit: $("b-unit").value,
                                birth_date: $("b-birth").value || null,
                                sex: $("b-sex").value || null,
                            }),
                        })
                            .then(function (r) {
                                return r
                                    .json()
                                    .catch(function () {
                                        return {};
                                    })
                                    .then(function (b) {
                                        return {
                                            ok: r.ok,
                                            status: r.status,
                                            body: b,
                                        };
                                    });
                            })
                            .then(function (res) {
                                if ($("b-save")) $("b-save").disabled = false;
                                if (res.status === 401) return signOut();
                                if (!res.ok) {
                                    setBodyStatus(
                                        (res.body &&
                                            res.body.error_description) ||
                                            "Could not save.",
                                        "err",
                                    );
                                    return;
                                }
                                bodyDraft = null;
                                setBodyStatus("Saved.");
                                bodyStatusTimer = setTimeout(function () {
                                    const st = $("b-status");
                                    if (st) st.classList.add("fade");
                                    bodyStatusTimer = setTimeout(function () {
                                        setBodyStatus("");
                                    }, 450);
                                }, 4000);
                                refresh();
                            })
                            .catch(function () {
                                if ($("b-save")) $("b-save").disabled = false;
                                setBodyStatus(
                                    "Could not reach the server.",
                                    "err",
                                );
                            });
                    });
                }

                RENDER.body = function () {
                    const s = data.weightStats;
                    const unit = data.weightUnit;
                    const pts = data.weights.length;
                    const windowDays =
                        dayDiff(data.weightWindowStart, data.endDate) + 1;
                    $("body-body").innerHTML =
                        '<div class="stack">' +
                        (detailsMissing()
                            ? '<div class="notice"><span><b>Missing details.</b> Add your height, birth date and sex to see BMI and estimated burn.</span></div>'
                            : "") +
                        weightHero(s, unit) +
                        '<div class="body-grid"><div class="col">' +
                        bodyStats(s, unit) +
                        bodyFormHtml() +
                        '</div><div class="col"><section class="card" aria-labelledby="h-wchart"><div class="card-head"><div><h3 id="h-wchart">Weight · since ' +
                        esc(shortDay(data.weightWindowStart)) +
                        '</h3><p class="note">' +
                        (pts
                            ? plural(pts, "weigh-in") +
                              " since " +
                              esc(longDay(data.weightWindowStart)) +
                              ", in " +
                              unit +
                              "."
                            : "No weigh-ins in the last " +
                              windowDays +
                              " days.") +
                        "</p></div></div>" +
                        (pts
                            ? legend(
                                  [[LG.dotline(), "Weight"]]
                                      .concat(
                                          s.target_g != null
                                              ? [[LG.line(true), "Target"]]
                                              : [],
                                      )
                                      .concat(
                                          s.healthy_min_g != null
                                              ? [
                                                    [
                                                        LG.bar("m-band"),
                                                        "Healthy BMI range",
                                                    ],
                                                ]
                                              : [],
                                      ),
                              ) + '<div class="plot" id="weight-plot"></div>'
                            : '<p class="empty">No weigh-ins yet. Ask Claude to log your weight.</p>') +
                        "</section></div></div></div>";
                    fillBodyForm();
                    wireBodyForm();
                };

                // Time-scaled, not index-scaled: weigh-ins are irregular, and
                // even spacing would make a two-week gap look like a day.
                CHARTS.body = function () {
                    const host = $("weight-plot");
                    if (!host || !host.clientWidth) return;
                    const unit = data.weightUnit;
                    const s = data.weightStats;
                    const pts = data.weights
                        .map((w) => ({
                            date: w.date,
                            v: toUnit(w.weight_g, unit),
                        }))
                        .sort((a, b) => (a.date < b.date ? -1 : 1));
                    const first = pts[0];
                    const last = pts[pts.length - 1];
                    const c = chartSvg(
                        host,
                        isDesktop() ? 300 : 240,
                        "Body weight since " +
                            shortDay(data.weightWindowStart) +
                            ": " +
                            first.v.toFixed(1) +
                            " " +
                            unit +
                            " on " +
                            shortDay(first.date) +
                            " to " +
                            last.v.toFixed(1) +
                            " " +
                            unit +
                            " on " +
                            shortDay(last.date) +
                            (s.target_g != null
                                ? ", target " +
                                  wfmt(s.target_g, unit) +
                                  " " +
                                  unit
                                : "") +
                            ". Use the arrow keys to read each weigh-in.",
                    );
                    const svg = c.svg;
                    const plotW = c.w - PAD.l - PAD.r;
                    const base = c.h - PAD.b;
                    const plotH = base - PAD.t;
                    const vals = pts.map((p) => p.v);
                    if (s.target_g != null) vals.push(toUnit(s.target_g, unit));
                    let lo = Math.min.apply(null, vals);
                    let hi = Math.max.apply(null, vals);
                    const padY = (hi - lo) * 0.2 || 1;
                    lo -= padY;
                    hi += padY;
                    const t0 = parseDay(data.weightWindowStart).getTime();
                    const t1 = parseDay(data.endDate).getTime();
                    const xAt = (iso) =>
                        PAD.l +
                        (t1 === t0
                            ? plotW / 2
                            : ((parseDay(iso).getTime() - t0) / (t1 - t0)) *
                              plotW);
                    const yAt = (v) => base - ((v - lo) / (hi - lo)) * plotH;
                    if (s.healthy_min_g != null) {
                        const a = Math.max(lo, toUnit(s.healthy_min_g, unit));
                        const b = Math.min(hi, toUnit(s.healthy_max_g, unit));
                        if (b > a)
                            svg.appendChild(
                                svgEl("rect", {
                                    x: PAD.l,
                                    y: yAt(b),
                                    width: plotW,
                                    height: yAt(a) - yAt(b),
                                    class: "m-band",
                                }),
                            );
                    }
                    for (let i = 0; i <= 3; i++) {
                        const v = lo + ((hi - lo) / 3) * i;
                        svg.appendChild(
                            svgEl("line", {
                                x1: PAD.l,
                                x2: PAD.l + plotW,
                                y1: yAt(v),
                                y2: yAt(v),
                                class: "gridline",
                            }),
                        );
                        svgText(
                            svg,
                            PAD.l - 8,
                            yAt(v) + 4,
                            v.toFixed(1),
                            "ax",
                            "end",
                        );
                    }
                    if (s.target_g != null) {
                        const ty = yAt(toUnit(s.target_g, unit));
                        svg.appendChild(
                            svgEl("line", {
                                x1: PAD.l,
                                x2: PAD.l + plotW,
                                y1: ty,
                                y2: ty,
                                class: "m-target",
                            }),
                        );
                        svgText(
                            svg,
                            PAD.l + plotW,
                            ty - 7,
                            "Target " + wfmt(s.target_g, unit),
                            "goal-lbl",
                            "end",
                        );
                    }
                    svg.appendChild(
                        svgEl("path", {
                            d: pts
                                .map(
                                    (p, i) =>
                                        (i ? "L" : "M") +
                                        xAt(p.date) +
                                        "," +
                                        yAt(p.v),
                                )
                                .join(" "),
                            class: "m-wline",
                        }),
                    );
                    const r = pts.length > 60 ? 2.5 : 4;
                    pts.forEach(function (p) {
                        svg.appendChild(
                            svgEl("circle", {
                                cx: xAt(p.date),
                                cy: yAt(p.v),
                                r: r,
                                class: "m-wdot",
                            }),
                        );
                    });
                    [data.weightWindowStart, data.endDate].forEach(
                        function (iso, k) {
                            svgText(
                                svg,
                                k ? PAD.l + plotW : PAD.l,
                                c.h - 8,
                                shortDay(iso),
                                "ax",
                                k ? "end" : "start",
                            );
                        },
                    );
                    inspect(
                        svg,
                        pts.map(function (p) {
                            const rows = [
                                [
                                    "s-accent",
                                    "Weight",
                                    p.v.toFixed(1) + " " + unit,
                                    1,
                                ],
                            ];
                            if (s.height_cm)
                                rows.push([
                                    null,
                                    "BMI",
                                    (
                                        (unit === "lb"
                                            ? p.v * 0.45359237
                                            : p.v) /
                                        Math.pow(s.height_cm / 100, 2)
                                    ).toFixed(1),
                                ]);
                            const t = tipContent(longDay(p.date), rows);
                            return {
                                x: xAt(p.date),
                                html: t.html,
                                text: t.text,
                            };
                        }),
                        PAD.t,
                        base,
                    );
                };

                /* ================= MEALS ================= */
                RENDER.meals = function () {
                    const meals = data.meals;
                    if (!meals.length) {
                        $("meals-body").innerHTML =
                            '<div class="card"><p class="empty">No meals logged in this range.</p></div>';
                        return;
                    }
                    // Group by local day in the PROFILE timezone, newest first
                    // (the API already sorts newest first).
                    const groups = [];
                    const byDay = {};
                    meals.forEach(function (m) {
                        const d = localDate(m.logged_at);
                        if (!byDay[d]) {
                            byDay[d] = { date: d, meals: [] };
                            groups.push(byDay[d]);
                        }
                        byDay[d].meals.push(m);
                    });
                    const capped = meals.length >= 50;
                    const sum = (list, k) =>
                        list.reduce((a, m) => a + (m[k] || 0), 0);
                    const MAC = [
                        ["protein_g", "P"],
                        ["carbs_g", "C"],
                        ["fat_g", "F"],
                        ["fiber_g", "Fib"],
                        ["sugar_g", "Sug"],
                    ];
                    const body = groups
                        .map(function (g, gi) {
                            const day = parseDay(g.date).toLocaleDateString(
                                undefined,
                                {
                                    weekday: "short",
                                    month: "short",
                                    day: "numeric",
                                },
                            );
                            const partial =
                                capped && gi === groups.length - 1
                                    ? ' <span class="partial">(partial — older meals not shown)</span>'
                                    : "";
                            const tot =
                                "<b>" +
                                fmt(sum(g.meals, "calories")) +
                                " kcal</b> · P " +
                                fmt(sum(g.meals, "protein_g")) +
                                " · C " +
                                fmt(sum(g.meals, "carbs_g")) +
                                " · F " +
                                fmt(sum(g.meals, "fat_g")) +
                                " · Fib " +
                                fmt(sum(g.meals, "fiber_g"));
                            return (
                                '<tbody><tr class="day"><th colspan="9" scope="colgroup">' +
                                esc(day) +
                                partial +
                                '<span class="tot">' +
                                tot +
                                "</span></th></tr>" +
                                g.meals
                                    .map(function (m, i) {
                                        return (
                                            '<tr class="meal' +
                                            (i === g.meals.length - 1
                                                ? " last"
                                                : "") +
                                            '"><td class="t">' +
                                            esc(localTime(m.logged_at)) +
                                            '</td><td class="ty">' +
                                            esc(mealTypeLabel(m.meal_type)) +
                                            '</td><td class="d">' +
                                            esc(m.description) +
                                            '</td><td class="n k">' +
                                            nz(m.calories) +
                                            "</td>" +
                                            MAC.map(function (x) {
                                                return (
                                                    '<td class="n mac" data-l="' +
                                                    x[1] +
                                                    '"><b>' +
                                                    nz(m[x[0]]) +
                                                    "</b></td>"
                                                );
                                            }).join("") +
                                            "</tr>"
                                        );
                                    })
                                    .join("") +
                                "</tbody>"
                            );
                        })
                        .join("");
                    $("meals-body").innerHTML =
                        '<div class="card meals-wrap"><table class="meals-table"><caption class="sr-only">Meals in this range, grouped by day, newest first</caption><thead><tr><th scope="col">Time</th><th scope="col">Meal</th><th scope="col">Description</th><th scope="col" class="n">kcal</th><th scope="col" class="n">P</th><th scope="col" class="n">C</th><th scope="col" class="n">F</th><th scope="col" class="n">Fib</th><th scope="col" class="n">Sug</th></tr></thead>' +
                        body +
                        '</table><p class="meals-foot">Showing the ' +
                        plural(
                            meals.length,
                            "most recent meal",
                            "most recent meals",
                        ) +
                        " in this range" +
                        (capped ? " — the dashboard lists at most 50." : ".") +
                        "</p></div>";
                };

                /* ---------- data ---------- */
                function renderHeader() {
                    const sub = $("sub");
                    sub.classList.toggle("is-error", loadError && !data);
                    if (loadError && !data)
                        sub.textContent =
                            "Could not load data. Is the server running?";
                    else if (data)
                        sub.textContent =
                            longDay(data.endDate) + " · " + data.timezone;
                    else sub.textContent = "Loading…";
                }
                function fetchData() {
                    return fetch("/api/dashboard/data?days=" + range, {
                        headers: { Authorization: "Bearer " + token },
                    }).then(function (r) {
                        if (r.status === 401) {
                            signOut();
                            throw new Error("unauthorized");
                        }
                        if (!r.ok) throw new Error("http " + r.status);
                        return r.json();
                    });
                }
                let seq = 0;
                function refresh() {
                    const mine = ++seq;
                    loading = true;
                    loadError = false;
                    renderBanners();
                    renderRangeHeads();
                    renderHeader();
                    paint();
                    return fetchData()
                        .then(function (d) {
                            if (mine !== seq || !token) return;
                            data = d;
                            loading = false;
                            onData();
                        })
                        .catch(function (e) {
                            if (mine !== seq) return;
                            loading = false;
                            if (e && e.message === "unauthorized") return;
                            loadError = true;
                            renderBanners();
                            renderRangeHeads();
                            renderHeader();
                            paint();
                        });
                }
                function onData() {
                    markDirty();
                    renderBanners();
                    renderRangeHeads();
                    renderHeader();
                    paint();
                }

                /* ---------- session ---------- */
                function showApp() {
                    $("login").hidden = true;
                    $("app").hidden = false;
                }
                function signOut() {
                    token = null;
                    data = null;
                    loading = false;
                    loadError = false;
                    seq++;
                    store(KEY, null);
                    clearInspect();
                    TABS.forEach(function (t) {
                        $(t + "-body").innerHTML = "";
                    });
                    $("app").hidden = true;
                    $("login").hidden = false;
                    $("email").focus();
                }
                $("signout").addEventListener("click", signOut);

                $("login-form").addEventListener("submit", function (ev) {
                    ev.preventDefault();
                    const err = $("login-err");
                    const btn = $("login-btn");
                    err.textContent = "";
                    if (!$("email").value.trim() || !$("password").value) {
                        err.textContent = "Email or password is incorrect.";
                        return;
                    }
                    btn.disabled = true;
                    fetch("/api/dashboard/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: $("email").value,
                            password: $("password").value,
                        }),
                    })
                        .then(function (r) {
                            return r
                                .json()
                                .catch(function () {
                                    return {};
                                })
                                .then(function (b) {
                                    return {
                                        ok: r.ok,
                                        status: r.status,
                                        body: b,
                                    };
                                });
                        })
                        .then(function (res) {
                            btn.disabled = false;
                            if (!res.ok || !res.body.access_token) {
                                err.textContent =
                                    res.status === 429
                                        ? "Too many attempts. Wait a minute and try again."
                                        : "Email or password is incorrect.";
                                return;
                            }
                            token = res.body.access_token;
                            store(KEY, token);
                            $("password").value = "";
                            showApp();
                            // A deep link (#body) survives signing in;
                            // otherwise this lands on Today.
                            const want = location.hash.slice(1);
                            const tab =
                                TABS.indexOf(want) >= 0 ? want : "today";
                            selectTab(tab, { fromHash: true });
                            $("tab-" + tab).focus();
                            refresh();
                        })
                        .catch(function () {
                            btn.disabled = false;
                            err.textContent = "Could not reach the server.";
                        });
                });

                /* ---------- boot ---------- */
                const savedRange = +load(RANGE_KEY);
                if (RANGES.some((r) => r[0] === savedRange)) range = savedRange;
                const startTab = location.hash.slice(1);
                active = TABS.indexOf(startTab) >= 0 ? startTab : "today";
                selectTab(active, { fromHash: true });
                token = load(KEY);
                if (token) {
                    showApp();
                    refresh();
                }
            })();
        </script>
    </body>
</html>
