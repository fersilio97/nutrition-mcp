        <script>
            (function () {
                "use strict";

                const KEY = "nutrition-dash-token";
                const THEME_KEY = "nutrition-dash-theme";
                const RANGE_KEY = "nutrition-dash-range";
                const TABS = ["today", "trends", "body", "meals"];
                const RANGES = [
                    [7, "7 days"],
                    [30, "30 days"],
                    [90, "90 days"],
                    [365, "1 year"],
                ];

                let token = null;
                let data = null;
                let loading = false;
                let loadError = false;
                let active = "today";
                let range = 30;
                // Content is rebuilt when data changes; charts also redraw
                // on resize. Only the visible panel is ever painted.
                const contentDirty = {};
                const chartsDirty = {};
                // Set while the page (not the user) opens Body details, so
                // the auto-open does not count as the user's own toggle.
                let bodyBoxProgrammatic = false;

                /* ---------- storage (try/catch: private windows) ---------- */
                function store(k, v) {
                    try {
                        if (v === null) localStorage.removeItem(k);
                        else localStorage.setItem(k, v);
                    } catch (e) {}
                }
                function load(k) {
                    try {
                        return localStorage.getItem(k);
                    } catch (e) {
                        return null;
                    }
                }

                const $ = (id) => document.getElementById(id);

                /* ---------- formatting ---------- */
                const round = (n) => Math.round(n || 0);
                const fmt = (n) => round(n).toLocaleString();
                const MINUS = "−";
                function fmtSigned(n) {
                    const r = round(n);
                    return (
                        (r > 0 ? "+" : r < 0 ? MINUS : "") +
                        Math.abs(r).toLocaleString()
                    );
                }
                function fmtSignedDec(n, dp) {
                    const d = dp == null ? 1 : dp;
                    const v = Number(n.toFixed(d));
                    return (
                        (v > 0 ? "+" : v < 0 ? MINUS : "") +
                        Math.abs(v).toFixed(d)
                    );
                }
                // Parse YYYY-MM-DD as a local date. new Date("2026-09-16")
                // parses as UTC and can display as the previous day west of
                // Greenwich — which is exactly where this user is.
                function parseDay(iso) {
                    const p = iso.split("-");
                    return new Date(+p[0], +p[1] - 1, +p[2]);
                }
                const shortDay = (iso) =>
                    parseDay(iso).toLocaleDateString(undefined, {
                        month: "short",
                        day: "numeric",
                    });
                const longDay = (iso) =>
                    parseDay(iso).toLocaleDateString(undefined, {
                        weekday: "short",
                        month: "short",
                        day: "numeric",
                    });
                const dayDiff = (a, b) =>
                    Math.round((parseDay(b) - parseDay(a)) / 864e5);
                function esc(s) {
                    return String(s == null ? "" : s).replace(
                        /[&<>"']/g,
                        (c) =>
                            ({
                                "&": "&amp;",
                                "<": "&lt;",
                                ">": "&gt;",
                                '"': "&quot;",
                                "'": "&#39;",
                            })[c],
                    );
                }
                const toUnit = (g, unit) =>
                    unit === "lb" ? g / 453.59237 : g / 1000;
                const wfmt = (g, unit) => toUnit(g, unit).toFixed(1);

                /* Profile-timezone dates and times. An invalid zone falls
                   back to the browser's, rather than throwing mid-render. */
                function tzOpts(o) {
                    const tz = data && data.timezone;
                    if (!tz) return o;
                    try {
                        new Intl.DateTimeFormat(undefined, { timeZone: tz });
                        return Object.assign({ timeZone: tz }, o);
                    } catch (e) {
                        return o;
                    }
                }
                function localDate(iso) {
                    return new Intl.DateTimeFormat(
                        "en-CA",
                        tzOpts({
                            year: "numeric",
                            month: "2-digit",
                            day: "2-digit",
                        }),
                    ).format(new Date(iso));
                }
                function localTime(iso) {
                    return new Intl.DateTimeFormat(
                        undefined,
                        tzOpts({ hour: "2-digit", minute: "2-digit" }),
                    ).format(new Date(iso));
                }

                /* ---------- svg ---------- */
                function svgEl(tag, attrs) {
                    const e = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        tag,
                    );
                    for (const k in attrs)
                        if (attrs[k] !== null && attrs[k] !== undefined)
                            e.setAttribute(k, attrs[k]);
                    return e;
                }
                function svgText(svg, x, y, txt, cls, anchor) {
                    const t = svgEl("text", {
                        x: x,
                        y: y,
                        class: cls || "ax",
                        "text-anchor": anchor || "middle",
                    });
                    t.textContent = txt;
                    svg.appendChild(t);
                    return t;
                }
                // Bar with only its top corners rounded, so the mark stays
                // anchored to the baseline instead of floating on a pill.
                function barPath(x, y, w, h, r) {
                    if (h <= 0) return "";
                    r = Math.max(0, Math.min(r, w / 2, h));
                    return (
                        "M" +
                        x +
                        "," +
                        (y + h) +
                        "V" +
                        (y + r) +
                        "a" +
                        r +
                        "," +
                        r +
                        " 0 0 1 " +
                        r +
                        "," +
                        -r +
                        "h" +
                        (w - 2 * r) +
                        "a" +
                        r +
                        "," +
                        r +
                        " 0 0 1 " +
                        r +
                        "," +
                        r +
                        "V" +
                        (y + h) +
                        "Z"
                    );
                }
                const rectPath = (x, y, w, h) =>
                    h <= 0
                        ? ""
                        : "M" +
                          x +
                          "," +
                          y +
                          "h" +
                          w +
                          "v" +
                          h +
                          "h" +
                          -w +
                          "Z";
                // Axis max as `ticks` steps of a round size (1, 1.5, 2, …
                // × 10ⁿ), so every gridline label is a number people use
                // and the headroom stays under ~30%.
                function tickMax(peak, ticks) {
                    const raw = Math.max(peak, 1) / ticks;
                    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
                    for (const s of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10])
                        if (s * mag >= raw) return s * mag * ticks;
                    return 10 * mag * ticks;
                }
                function niceMax(v) {
                    if (v <= 0) return 10;
                    const mag = Math.pow(10, Math.floor(Math.log10(v)));
                    const steps = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10];
                    for (const s of steps) if (s * mag >= v) return s * mag;
                    return 10 * mag;
                }
                function legend(items) {
                    // items: [shape, swatch class / svg, label]
                    return (
                        '<ul class="legend">' +
                        items
                            .map(function (it) {
                                return "<li>" + it[0] + esc(it[1]) + "</li>";
                            })
                            .join("") +
                        "</ul>"
                    );
                }
                const LG = {
                    bar: (cls) =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" class="' +
                        cls +
                        '"/></svg>',
                    hatch: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" class="m-over"/></svg>',
                    line: (dashed) =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="' +
                        (dashed ? "m-target" : "goal-line") +
                        '"/></svg>',
                    ring: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" class="m-burn"/></svg>',
                    dotline: () =>
                        '<svg viewBox="0 0 14 14" aria-hidden="true"><line x1="0" y1="7" x2="14" y2="7" class="m-wline"/><circle cx="7" cy="7" r="3.5" class="m-wdot"/></svg>',
                };

                /* ---------- x-axis layout ---------- */
                const PAD = { t: 16, r: 12, b: 28, l: 44 };
                function xLabelIdx(n, plotW) {
                    // floor(plotW / 56) labels at most, always the last one.
                    const max = Math.max(2, Math.floor(plotW / 56));
                    const step = Math.max(1, Math.ceil(n / max));
                    const out = [];
                    for (let i = 0; i < n; i += step) out.push(i);
                    const last = n - 1;
                    if (out[out.length - 1] !== last) {
                        if (
                            out.length > 1 &&
                            last - out[out.length - 1] < step * 0.6
                        )
                            out.pop();
                        out.push(last);
                    }
                    return out;
                }
                function bandLayout(n, plotW) {
                    const bw = plotW / n;
                    const gap = bw >= 5 ? Math.min(2, bw * 0.18) : 0;
                    const barW = Math.max(1, Math.min(bw - gap, 48));
                    return { bw: bw, barW: barW };
                }

                /* ---------- tooltip / inspect ---------- */
                const tip = $("tip");
                const live = $("live");
                let current = null; // { svg, clear }

                function tipContent(title, rows) {
                    // rows: [swatchClass|null, label, value, strong?]
                    const html =
                        '<div class="t-date">' +
                        esc(title) +
                        "</div>" +
                        rows
                            .map(function (r) {
                                return (
                                    '<div class="row' +
                                    (r[3] ? " strong" : "") +
                                    '"><span>' +
                                    (r[0]
                                        ? '<i class="sw ' + r[0] + '"></i>'
                                        : "") +
                                    esc(r[1]) +
                                    "</span><b>" +
                                    esc(r[2]) +
                                    "</b></div>"
                                );
                            })
                            .join("");
                    const text =
                        title +
                        ". " +
                        rows
                            .map(function (r) {
                                return r[1] + " " + r[2];
                            })
                            .join(", ") +
                        ".";
                    return { html: html, text: text };
                }
                function placeTip(html, x, y) {
                    tip.innerHTML = html;
                    tip.hidden = false;
                    const r = tip.getBoundingClientRect();
                    let left = x - r.width / 2;
                    left = Math.max(
                        8,
                        Math.min(innerWidth - r.width - 8, left),
                    );
                    let top = y - r.height - 12;
                    if (top < 8) top = y + 16;
                    if (top + r.height > innerHeight - 8)
                        top = Math.max(8, innerHeight - r.height - 8);
                    tip.style.left = left + "px";
                    tip.style.top = top + "px";
                    requestAnimationFrame(function () {
                        tip.classList.add("on");
                    });
                }
                function hideTip() {
                    tip.classList.remove("on");
                    tip.hidden = true;
                }
                function clearInspect() {
                    if (current) current.clear();
                    current = null;
                    hideTip();
                }

                /**
                 * Pointer + keyboard inspection for one chart. cols:
                 * [{x, html, text}] in svg pixels; top/bottom bound the
                 * guide. Mouse hovers; touch/pen pins the column with a
                 * guide; arrows step it, mirrored to the live region.
                 */
                function inspect(svg, cols, top, bottom) {
                    if (!cols.length) return;
                    let idx = -1;
                    let pinned = false;
                    const guide = svgEl("line", {
                        class: "guide",
                        x1: -10,
                        x2: -10,
                        y1: top,
                        y2: bottom,
                    });
                    guide.style.display = "none";
                    svg.appendChild(guide);
                    function colAt(clientX) {
                        const x = clientX - svg.getBoundingClientRect().left;
                        let best = 0;
                        let bd = Infinity;
                        cols.forEach(function (c, i) {
                            const d = Math.abs(c.x - x);
                            if (d < bd) {
                                bd = d;
                                best = i;
                            }
                        });
                        return best;
                    }
                    const self = {
                        svg: svg,
                        clear: function () {
                            idx = -1;
                            pinned = false;
                            guide.style.display = "none";
                        },
                    };
                    function anchorShow(i) {
                        idx = i;
                        const c = cols[i];
                        guide.setAttribute("x1", c.x);
                        guide.setAttribute("x2", c.x);
                        guide.style.display = "";
                        const r = svg.getBoundingClientRect();
                        if (current && current !== self) current.clear();
                        current = self;
                        placeTip(c.html, r.left + c.x, r.top + top);
                    }
                    svg.addEventListener("pointermove", function (ev) {
                        if (ev.pointerType !== "mouse" || pinned) return;
                        const i = colAt(ev.clientX);
                        idx = i;
                        if (current && current !== self) current.clear();
                        current = self;
                        guide.style.display = "none";
                        placeTip(cols[i].html, ev.clientX, ev.clientY - 4);
                    });
                    svg.addEventListener("pointerleave", function (ev) {
                        if (
                            ev.pointerType === "mouse" &&
                            !pinned &&
                            current === self
                        )
                            clearInspect();
                    });
                    svg.addEventListener("pointerdown", function (ev) {
                        if (ev.pointerType === "mouse") return;
                        ev.stopPropagation();
                        pinned = true;
                        anchorShow(colAt(ev.clientX));
                    });
                    svg.addEventListener("keydown", function (ev) {
                        let i = idx;
                        if (ev.key === "ArrowRight")
                            i = i < 0 ? 0 : Math.min(cols.length - 1, i + 1);
                        else if (ev.key === "ArrowLeft")
                            i = i < 0 ? cols.length - 1 : Math.max(0, i - 1);
                        else if (ev.key === "Home") i = 0;
                        else if (ev.key === "End") i = cols.length - 1;
                        else if (ev.key === "Escape") {
                            if (current === self) clearInspect();
                            return;
                        } else return;
                        ev.preventDefault();
                        pinned = true;
                        anchorShow(i);
                        live.textContent = cols[i].text;
                    });
                    svg.addEventListener("blur", function () {
                        if (current === self) clearInspect();
                    });
                }
                document.addEventListener("pointerdown", function (ev) {
                    if (current && !current.svg.contains(ev.target))
                        clearInspect();
                });
                document.addEventListener("keydown", function (ev) {
                    if (ev.key === "Escape" && current) clearInspect();
                });
                addEventListener(
                    "scroll",
                    function () {
                        if (current) clearInspect();
                        document.body.classList.toggle("scrolled", scrollY > 4);
                    },
                    { passive: true },
                );

                function chartSvg(host, h, label) {
                    const w = Math.floor(host.clientWidth);
                    host.textContent = "";
                    const svg = svgEl("svg", {
                        class: "chart",
                        width: w,
                        height: h,
                        viewBox: "0 0 " + w + " " + h,
                        role: "img",
                        tabindex: 0,
                        "aria-label": label,
                    });
                    host.appendChild(svg);
                    return { svg: svg, w: w, h: h };
                }
                const isDesktop = () => innerWidth >= 1024;

                /* ---------- theme ---------- */
                const mq = matchMedia("(prefers-color-scheme: dark)");
                function isDark() {
                    const cur =
                        document.documentElement.getAttribute("data-theme");
                    return cur === "dark" || (!cur && mq.matches);
                }
                function syncThemeBtn() {
                    const dark = isDark();
                    $("theme-btn").setAttribute(
                        "aria-label",
                        dark ? "Switch to light theme" : "Switch to dark theme",
                    );
                    // SVGElement has no `hidden` property; assigning one
                    // would only set an expando, so toggle the attribute.
                    $("theme-btn")
                        .querySelector(".i-moon")
                        .toggleAttribute("hidden", dark);
                    $("theme-btn")
                        .querySelector(".i-sun")
                        .toggleAttribute("hidden", !dark);
                }
                $("theme-btn").addEventListener("click", function () {
                    const next = isDark() ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", next);
                    store(THEME_KEY, next);
                    // Every mark takes colour through CSS variables, so a
                    // theme switch needs no re-render.
                    syncThemeBtn();
                });
                if (mq.addEventListener)
                    mq.addEventListener("change", syncThemeBtn);
                syncThemeBtn();

                /* ---------- tabs ---------- */
                const tabBtns = TABS.map((t) => $("tab-" + t));
                function selectTab(name, opts) {
                    opts = opts || {};
                    if (TABS.indexOf(name) < 0) name = "today";
                    const changed = name !== active;
                    active = name;
                    clearInspect();
                    TABS.forEach(function (t) {
                        const on = t === name;
                        const b = $("tab-" + t);
                        b.setAttribute("aria-selected", on ? "true" : "false");
                        b.tabIndex = on ? 0 : -1;
                        const p = $("panel-" + t);
                        p.hidden = !on;
                        if (on && changed) {
                            p.classList.remove("enter");
                            void p.offsetWidth;
                            p.classList.add("enter");
                        }
                    });
                    if (opts.focus) $("tab-" + name).focus();
                    // A history entry per tab change, so back/forward
                    // moves between tabs. The panels' ids are panel-*,
                    // so the browser has no anchor to scroll to.
                    if (!opts.fromHash && location.hash !== "#" + name)
                        history.pushState(null, "", "#" + name);
                    paint();
                    // Start the new panel at its top when the tab bar is
                    // already stuck.
                    if (changed && !opts.fromHash) {
                        const nav = document.querySelector(
                            isDesktop() ? ".chrome" : ".tabs-wrap",
                        );
                        const navTop =
                            $("main").getBoundingClientRect().top +
                            scrollY -
                            nav.offsetHeight;
                        if (scrollY > navTop) scrollTo(0, Math.max(0, navTop));
                    }
                }
                tabBtns.forEach(function (b, i) {
                    b.addEventListener("click", function () {
                        selectTab(b.dataset.tab);
                    });
                    b.addEventListener("keydown", function (ev) {
                        let j = -1;
                        if (ev.key === "ArrowRight") j = (i + 1) % TABS.length;
                        else if (ev.key === "ArrowLeft")
                            j = (i - 1 + TABS.length) % TABS.length;
                        else if (ev.key === "Home") j = 0;
                        else if (ev.key === "End") j = TABS.length - 1;
                        if (j < 0) return;
                        ev.preventDefault();
                        selectTab(TABS[j], { focus: true });
                    });
                });
                addEventListener("hashchange", function () {
                    selectTab(location.hash.slice(1), { fromHash: true });
                });
                addEventListener("popstate", function () {
                    selectTab(location.hash.slice(1) || "today", {
                        fromHash: true,
                    });
                });

                /* ---------- range control (Trends + Meals) ---------- */
                function renderRangeHeads() {
                    const label = data
                        ? esc(shortDay(data.startDate)) +
                          " – " +
                          esc(shortDay(data.endDate)) +
                          "<small>" +
                          esc(
                              RANGES.filter((r) => r[0] === range)[0][1] +
                                  " · " +
                                  data.timezone,
                          ) +
                          "</small>"
                        : "&nbsp;<small>&nbsp;</small>";
                    // Keep keyboard focus on a segment across the rebuild.
                    const fe = document.activeElement;
                    const focusDays =
                        fe && fe.closest && fe.closest(".seg") ? range : null;
                    document
                        .querySelectorAll("[data-range-head]")
                        .forEach(function (h) {
                            h.innerHTML =
                                '<p class="range-label">' +
                                label +
                                '</p><div class="seg" role="group" aria-label="Date range"' +
                                (loading ? ' aria-disabled="true"' : "") +
                                ">" +
                                RANGES.map(function (r) {
                                    const on = r[0] === range;
                                    return (
                                        '<button type="button" data-days="' +
                                        r[0] +
                                        '" aria-pressed="' +
                                        on +
                                        '">' +
                                        r[1] +
                                        (on && loading
                                            ? '<span class="spin" aria-hidden="true"></span>'
                                            : "") +
                                        "</button>"
                                    );
                                }).join("") +
                                "</div>";
                        });
                    if (focusDays != null) {
                        const b = document.querySelector(
                            "#panel-" +
                                active +
                                ' .seg button[data-days="' +
                                focusDays +
                                '"]',
                        );
                        if (b) b.focus();
                    }
                }
                document.addEventListener("click", function (ev) {
                    const b =
                        ev.target.closest && ev.target.closest(".seg button");
                    if (!b || loading) return;
                    const n = +b.dataset.days;
                    if (n === range) return;
                    range = n;
                    store(RANGE_KEY, String(n));
                    refresh();
                });

                /* ---------- painting ---------- */
                function markDirty() {
                    TABS.forEach(function (t) {
                        contentDirty[t] = true;
                        chartsDirty[t] = true;
                    });
                }
                const RENDER = {};
                const CHARTS = {};
                const SKELETON = {
                    today: '<div class="skel"><div class="sk" style="height:220px"></div><div class="sk" style="height:160px"></div><div class="sk" style="height:140px"></div></div>',
                    trends: '<div class="skel"><div class="stats four"><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div></div><div class="sk" style="height:300px"></div><div class="sk" style="height:200px"></div></div>',
                    body: '<div class="skel"><div class="sk" style="height:150px"></div><div class="sk" style="height:220px"></div><div class="sk" style="height:300px"></div></div>',
                    meals: '<div class="skel"><div class="sk" style="height:120px"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:120px"></div></div>',
                };
                function paint() {
                    const t = active;
                    const panel = $("panel-" + t);
                    panel.classList.toggle("refreshing", loading && !!data);
                    if (!data) {
                        const b = $(t + "-body");
                        if (!b.querySelector(".skel") && !loadError)
                            b.innerHTML = SKELETON[t];
                        if (loadError) b.innerHTML = "";
                        return;
                    }
                    if (contentDirty[t]) {
                        RENDER[t]();
                        contentDirty[t] = false;
                        chartsDirty[t] = true;
                    }
                    if (chartsDirty[t] && CHARTS[t]) {
                        CHARTS[t]();
                        chartsDirty[t] = false;
                    }
                }
                let lastW = 0;
                let rafId = 0;
                new ResizeObserver(function (entries) {
                    const w = Math.round(entries[0].contentRect.width);
                    if (w === lastW) return;
                    lastW = w;
                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(function () {
                        TABS.forEach(function (t) {
                            chartsDirty[t] = true;
                        });
                        clearInspect();
                        if (data) paint();
                    });
                }).observe($("main"));

                /* ---------- error banner ---------- */
                function renderBanners() {
                    document
                        .querySelectorAll(".banner-slot")
                        .forEach(function (s) {
                            s.innerHTML = loadError
                                ? '<div class="banner" role="alert"><p>Could not load data. Is the server running?</p><button type="button" class="btn" data-retry>Retry</button><button type="button" class="icon-btn" data-dismiss aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
                                : "";
                        });
                }
                document.addEventListener("click", function (ev) {
                    if (ev.target.closest("[data-retry]")) refresh();
                    else if (ev.target.closest("[data-dismiss]")) {
                        ev.target.closest(".banner").remove();
                    }
                });

                /* ================= shared pieces ================= */
                const isOver = (r) =>
                    !!r.goal_calories && r.calories > r.goal_calories;
                const anyLogged = (rows) => rows.some((r) => r.mealCount > 0);
                const hasBurn = () => data.daily.some((r) => r.burn_kcal);
                function plural(n, one, many) {
                    return n + " " + (n === 1 ? one : many || one + "s");
                }
                // Every field of the old calories tooltip, plus "Over by".
                function calTip(r) {
                    const rows = [
                        ["s-kcal", "Eaten", fmt(r.calories) + " kcal", 1],
                    ];
                    if (r.goal_calories)
                        rows.push([null, "Goal", fmt(r.goal_calories)]);
                    if (r.active_kcal)
                        rows.push([
                            null,
                            "incl. active",
                            "+" + fmt(r.active_kcal),
                        ]);
                    if (isOver(r))
                        rows.push([
                            null,
                            "Over by",
                            fmt(r.calories - r.goal_calories) + " kcal",
                            1,
                        ]);
                    if (r.burn_kcal)
                        rows.push(["s-burn", "Est. burn", fmt(r.burn_kcal)]);
                    if (r.balance_g != null)
                        rows.push([
                            null,
                            "Est. change",
                            fmtSigned(r.balance_g) + " g",
                        ]);
                    rows.push([null, "Meals", String(r.mealCount)]);
                    return tipContent(
                        longDay(r.date) + (r.in_progress ? " · so far" : ""),
                        rows,
                    );
                }
                function mealTypeLabel(t) {
                    if (!t) return "Meal";
                    return t.charAt(0).toUpperCase() + t.slice(1);
                }
                const nz = (v) => (v == null ? "—" : fmt(v));
                function mealItem(m) {
                    return (
                        '<li><div class="m1"><span class="m-time">' +
                        esc(localTime(m.logged_at)) +
                        '</span><span class="m-type">' +
                        esc(mealTypeLabel(m.meal_type)) +
                        '</span><span class="m-kcal">' +
                        nz(m.calories) +
                        ' <span class="m-time">kcal</span></span></div><p class="m-desc">' +
                        esc(m.description) +
                        '</p><p class="m-mac"><span>P <b>' +
                        nz(m.protein_g) +
                        "</b></span><span>C <b>" +
                        nz(m.carbs_g) +
                        "</b></span><span>F <b>" +
                        nz(m.fat_g) +
                        "</b></span><span>Fib <b>" +
                        nz(m.fiber_g) +
                        "</b></span><span>Sug <b>" +
                        nz(m.sugar_g) +
                        "</b></span></p></li>"
                    );
                }
                // Calorie bars against each day's goal: --kcal up to the
                // goal, a hatched segment above it. Returns the bar layout.
                function calBars(svg, rows, x0, plotW, yAt, base, lay) {
                    rows.forEach(function (r, i) {
                        if (r.calories <= 0) return;
                        const x = x0 + lay.bw * i + (lay.bw - lay.barW) / 2;
                        const w = lay.barW;
                        const rad = Math.min(4, w / 2);
                        const g = isOver(r) ? r.goal_calories : null;
                        const cls = r.in_progress ? " dim" : "";
                        if (g == null) {
                            svg.appendChild(
                                svgEl("path", {
                                    d: barPath(
                                        x,
                                        yAt(r.calories),
                                        w,
                                        base - yAt(r.calories),
                                        rad,
                                    ),
                                    class: "m-kcal" + cls,
                                }),
                            );
                        } else {
                            svg.appendChild(
                                svgEl("path", {
                                    d: rectPath(x, yAt(g), w, base - yAt(g)),
                                    class: "m-kcal" + cls,
                                }),
                            );
                            svg.appendChild(
                                svgEl("path", {
                                    d: barPath(
                                        x,
                                        yAt(r.calories),
                                        w,
                                        yAt(g) - yAt(r.calories),
                                        rad,
                                    ),
                                    class: "m-over" + cls,
                                }),
                            );
                        }
                    });
                }
                function goBodyDetails() {
                    selectTab("body");
                    const box = $("body-box");
                    if (box) {
                        // The user asked for it: their toggle, not ours.
                        box.open = true;
                        box.scrollIntoView({ block: "start" });
                        $("b-height").focus();
                    }
                }
                document.addEventListener("click", function (ev) {
                    const t =
                        ev.target.closest && ev.target.closest("[data-go]");
                    if (!t) return;
                    if (t.dataset.go === "body-details") goBodyDetails();
                    else selectTab(t.dataset.go);
                });
                const ADD_BODY =
                    '<button type="button" class="link-btn" data-go="body-details">Add body details</button>';

                /* ================= TODAY ================= */
                const RING = 168;
                const RING_SW = 14;
                const RING_R = (RING - RING_SW) / 2;
                const RING_C = 2 * Math.PI * RING_R;

                function ringHtml(t) {
                    const eaten = t.calories || 0;
                    const goal = t.goal_calories;
                    const p = goal ? Math.min(eaten / goal, 1) : 0;
                    const overP =
                        goal && eaten > goal
                            ? Math.min((eaten - goal) / goal, 1)
                            : 0;
                    const label = goal
                        ? fmt(eaten) +
                          " of " +
                          fmt(goal) +
                          " kcal eaten today, " +
                          (eaten <= goal
                              ? fmt(goal - eaten) + " left"
                              : fmt(eaten - goal) + " over")
                        : fmt(eaten) + " kcal eaten today, no calorie goal set";
                    const c = RING / 2;
                    const arc = function (cls, frac) {
                        return frac > 0
                            ? '<circle class="' +
                                  cls +
                                  '" cx="' +
                                  c +
                                  '" cy="' +
                                  c +
                                  '" r="' +
                                  RING_R +
                                  '" stroke-width="' +
                                  RING_SW +
                                  '" stroke-dasharray="' +
                                  RING_C +
                                  '" stroke-dashoffset="' +
                                  RING_C +
                                  '" data-to="' +
                                  RING_C * (1 - frac) +
                                  '" transform="rotate(-90 ' +
                                  c +
                                  " " +
                                  c +
                                  ')"/>'
                            : "";
                    };
                    return (
                        '<div class="ring" role="img" aria-label="' +
                        esc(label) +
                        '"><svg viewBox="0 0 ' +
                        RING +
                        " " +
                        RING +
                        '" aria-hidden="true"><circle class="ring-track" cx="' +
                        c +
                        '" cy="' +
                        c +
                        '" r="' +
                        RING_R +
                        '" stroke-width="' +
                        RING_SW +
                        '"/>' +
                        arc("ring-arc", p) +
                        arc("ring-over", overP) +
                        '</svg><div class="ring-c" aria-hidden="true"><b>' +
                        fmt(eaten) +
                        "</b><span>" +
                        (goal ? "of " + fmt(goal) + " kcal" : "kcal eaten") +
                        "</span></div></div>"
                    );
                }
                function ringFoot(t) {
                    const eaten = t.calories || 0;
                    const goal = t.goal_calories;
                    if (!goal)
                        return "No calorie goal set — ask Claude to set one.";
                    const basis = t.active_kcal
                        ? ' <span class="basis">Goal: ' +
                          fmt(goal - t.active_kcal) +
                          " base + " +
                          fmt(t.active_kcal) +
                          " active kcal</span>"
                        : "";
                    return eaten <= goal
                        ? "<b>" +
                              fmt(goal - eaten) +
                              " kcal left</b> of " +
                              fmt(goal) +
                              basis
                        : '<span class="over-text">▲ ' +
                              fmt(eaten - goal) +
                              " kcal over</span> " +
                              fmt(goal) +
                              basis;
                }
                function trioCell(label, figure, unit, foot, opts) {
                    opts = opts || {};
                    return (
                        '<div><div class="micro">' +
                        label +
                        '</div><div class="figure' +
                        (opts.missing ? " missing" : "") +
                        '">' +
                        (opts.sw
                            ? '<i class="sw dot ' + opts.sw + '"></i>'
                            : "") +
                        figure +
                        (unit ? "<small>" + unit + "</small>" : "") +
                        '</div><div class="foot">' +
                        foot +
                        "</div></div>"
                    );
                }
                function trioHtml(t) {
                    const burnKnown = t.burn_kcal != null;
                    let change;
                    if (!burnKnown)
                        change = trioCell("Est. change", "—", "", ADD_BODY, {
                            missing: true,
                        });
                    else if (!t.mealCount || t.balance_g == null)
                        change = trioCell(
                            "Est. change",
                            "—",
                            "",
                            "Nothing logged yet",
                            {
                                missing: true,
                            },
                        );
                    else
                        change = trioCell(
                            "Est. change",
                            fmtSigned(t.balance_g),
                            "g",
                            "so far · estimate",
                            { sw: t.balance_g >= 0 ? "s-gain" : "s-loss" },
                        );
                    return (
                        '<div class="trio">' +
                        trioCell(
                            "Eaten",
                            fmt(t.calories),
                            "kcal",
                            plural(t.mealCount, "meal"),
                        ) +
                        (burnKnown
                            ? trioCell(
                                  "Est. burn",
                                  fmt(t.burn_kcal),
                                  "kcal",
                                  "full day · estimate",
                              )
                            : trioCell("Est. burn", "—", "", ADD_BODY, {
                                  missing: true,
                              })) +
                        change +
                        "</div>"
                    );
                }
                function nutrientRow(name, sw, value, goal, unit) {
                    const v = value || 0;
                    const over = goal && v > goal;
                    return (
                        '<li><span class="name"><i class="sw ' +
                        sw +
                        '"></i>' +
                        name +
                        '</span><span class="val"><span><b>' +
                        fmt(v) +
                        "</b>" +
                        (goal ? " / " + fmt(goal) : "") +
                        " " +
                        unit +
                        "</span>" +
                        (over ? '<span class="chip over">over</span>' : "") +

                        (goal
                            ? '<span class="track" aria-hidden="true"><i class="' +

                              Math.min(100, (v / goal) * 100) +
                              '"></i></span>'
                            : "") +
                        "</li>"
                    );
                }
                function todayMeals() {
                    return data.meals
                        .filter(function (m) {
                            try {
                                return localDate(m.logged_at) === data.endDate;
                            } catch (e) {
                                return false;
                            }
                        })
                        .sort((a, b) => (a.logged_at < b.logged_at ? -1 : 1));
                }

                RENDER.today = function () {
                    const t = data.daily[data.daily.length - 1];
                    const g = data.goals;
                    const meals = todayMeals();
                    $("today-body").innerHTML =
                        '<div class="today-grid"><div class="col">' +
                        '<section class="card hero" aria-labelledby="h-ring"><h3 id="h-ring" class="sr-only">Calories today</h3><div class="hero-in">' +
                        ringHtml(t) +
                        '<p class="ring-foot">' +
                        ringFoot(t) +
                        "</p></div>" +
                        trioHtml(t) +
                        "</section>" +
                        '<section class="card" aria-labelledby="h-nut"><div class="card-head"><div><h3 id="h-nut">Nutrients</h3><p class="note">Today against your goals' +
                        (t.active_kcal
                            ? ", adjusted for active calories"
                            : "") +
                        '.</p></div></div><ul class="nutrients">' +
                        nutrientRow(
                            "Protein",
                            "s-protein",
                            t.protein_g,
                            t.goal_protein_g,
                            "g",
                        ) +
                        nutrientRow(
                            "Carbs",
                            "s-carbs",
                            t.carbs_g,
                            t.goal_carbs_g,
                            "g",
                        ) +
                        nutrientRow(
                            "Fat",
                            "s-fat",
                            t.fat_g,
                            t.goal_fat_g,
                            "g",
                        ) +
                        nutrientRow(
                            "Fiber",
                            "s-fiber",
                            t.fiber_g,
                            g && g.fiber_g,
                            "g",
                        ) +
                        "</ul></section></div>" +
                        '<div class="col">' +
                        '<section class="card" aria-labelledby="h-strip"><div class="card-head"><div><h3 id="h-strip">Last 7 days</h3><p class="note">Calories per day, with each day’s goal as a tick.</p></div><button type="button" class="link-btn" data-go="trends">See trends ›</button></div>' +
                        (anyLogged(data.daily.slice(-7)) ||
                        data.daily.slice(-7).some((r) => r.goal_calories)
                            ? '<div class="plot" id="strip-plot"></div>'
                            : '<p class="empty">Nothing logged in the last 7 days.</p>') +
                        "</section>" +
                        '<section class="card" aria-labelledby="h-meals-today"><div class="card-head"><div><h3 id="h-meals-today">Today’s meals</h3>' +
                        (meals.length
                            ? '<p class="note">' +
                              plural(meals.length, "meal") +

                        "</div></div>" +
                        (meals.length
                            ? '<ul class="meal-list">' +

                              "</ul>"
                            : '<p class="empty">Nothing logged yet today. Tell Claude what you ate and it will show up here.</p>') +
                        "</section></div></div>";
                    // Sweep the ring and grow the bars from zero.
                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            document
                                .querySelectorAll("#today-body [data-to]")
                                .forEach(function (c) {
                                    c.setAttribute(
                                        "stroke-dashoffset",
                                        c.dataset.to,
                                    );
                                });

                                .querySelectorAll("#today-body .track i")
                                .forEach(function (i) {
                                    i.style.width = i.dataset.w + "%";
                                });
                        });
                    });
                };

                CHARTS.today = function () {
                    const host = $("strip-plot");
                    if (!host || !host.clientWidth) return;
                    const rows = data.daily.slice(-7);
                    const logged = rows.filter((r) => r.mealCount > 0).length;
                    const c = chartSvg(
                        host,
                        132,
                        "Calories for the last 7 days: " +
                            plural(logged, "day") +
                            " logged, " +
                            rows.filter(isOver).length +
                            " over goal. Use the arrow keys to read each day.",
                    );
                    const svg = c.svg;
                    const top = 8;
                    const base = c.h - 24;
                    const peak = Math.max.apply(
                        null,
                        rows.map((r) =>
                            Math.max(r.calories, r.goal_calories || 0),
                        ),
                    );
                    const maxY = niceMax(Math.max(peak, 500) * 1.05);
                    const yAt = (v) => base - (v / maxY) * (base - top);

                        }),
